<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flaynity</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<style id="flaynity-startup-splash-style">
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #flaynity-startup-splash {
        position: fixed; inset: 0; width: 100vw; height: 100vh; min-height: 100dvh;
        z-index: 2147483647; background: #000; display: block; opacity: 1;
        visibility: visible; overflow: hidden; pointer-events: auto;
    }
    #flaynity-startup-splash img {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block;
        object-fit: cover; opacity: 0; visibility: hidden;
        -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    #flaynity-startup-splash.image-ready img { opacity: 1; visibility: visible; }
    #flaynity-startup-splash.is-hidden { display: none !important; }
</style>

<div id="flaynity-startup-splash" aria-hidden="true">
    <img id="flaynity-startup-splash-image" alt="" draggable="false">
</div>
<script>
(function () {
    'use strict';
    const splash = document.getElementById('flaynity-startup-splash');
    const image = document.getElementById('flaynity-startup-splash-image');
    const imageUrl = 'https://www.image2url.com/r2/default/images/1788267431153-51c681d9-a6ef-41fb-99ac-148a5b8e7e8c.jpg';
    const cacheName = 'flaynity-startup-image-v2';
    const STARTUP_DURATION = 3500;
    const startupStartedAt = Date.now();

    function showLoadedImage(src) {
        if (!image || !splash) return;
        image.onload = function () { splash.classList.add('image-ready'); };
        image.onerror = function () {};
        image.src = src;
        if (image.complete && image.naturalWidth > 0) splash.classList.add('image-ready');
    }
    async function loadCachedSplashImage() {
        try {
            if (!('caches' in window)) return false;
            const cache = await caches.open(cacheName);
            const cached = await cache.match(imageUrl);
            if (!cached) return false;
            const blob = await cached.blob();
            showLoadedImage(URL.createObjectURL(blob));
            return true;
        } catch (e) { return false; }
    }
    async function cacheSplashImage() {
        try {
            if (!navigator.onLine || !('caches' in window)) return;
            const cache = await caches.open(cacheName);
            const response = await fetch(imageUrl, { cache: 'reload' });
            if (response.ok) await cache.put(imageUrl, response.clone());
        } catch (e) {}
    }
    showLoadedImage(imageUrl);
    loadCachedSplashImage().then(function (cached) {
        if (!cached && navigator.onLine) showLoadedImage(imageUrl);
    });
    cacheSplashImage();
    window.__flaynitySplashHideAt = startupStartedAt + STARTUP_DURATION;
    window.__flaynityHideStartupSplash = function () {
        const remaining = Math.max(0, window.__flaynitySplashHideAt - Date.now());
        setTimeout(function () {
            if (splash) splash.classList.add('is-hidden');
        }, remaining);
    };
    window.__flaynityHideStartupSplash();
})();
</script>

<style id="flaynity-onboarding-style">
    #flaynity-onboarding {
        position: fixed; inset: 0; width: 100vw; height: 100vh; min-height: 100dvh;
        z-index: 2147483646; background: #000; overflow: hidden; display: none;
        font-family: 'Plus Jakarta Sans', sans-serif; touch-action: pan-y;
    }
    #flaynity-onboarding-track {
        position: absolute; inset: 0; width: 100%; height: 100%; display: flex;
        transform: translate3d(0,0,0); will-change: transform; transition: transform .42s cubic-bezier(.22,.8,.2,1);
        touch-action: pan-y;
    }
    #flaynity-onboarding .onboarding-slide {
        position: relative; flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover;
        display: block; opacity: 1; visibility: visible; user-select: none; -webkit-user-drag: none;
        background: #000; transform: translateZ(0); backface-visibility: hidden;
    }
    #flaynity-onboarding::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28%;
        background: transparent;
        pointer-events: none; z-index: 2;
    }
    #flaynity-onboarding-next {
        position: absolute; z-index: 4; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom));
        width: calc(100% - 32px); min-height: 54px; border: 0; border-radius: 16px;
        background: #FF2E55; color: #fff; font-size: 1.05rem; font-weight: 800;
        cursor: pointer; box-shadow: none !important; text-shadow: none; -webkit-box-shadow: none !important;
        -webkit-tap-highlight-color: transparent; opacity: 0; transform: translateX(70px);
        transition: opacity .55s ease, transform .55s cubic-bezier(.22,.8,.2,1);
    }
    #flaynity-onboarding.ready #flaynity-onboarding-next { opacity: 1; transform: translateX(0); }
    #flaynity-onboarding-dots {
        position: absolute; z-index: 5; left: 0; right: 0; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px);
        display: flex; justify-content: center; align-items: center; gap: 7px; pointer-events: none;
    }
    #flaynity-onboarding-dots span { width: 6px; height: 6px; border-radius: 50%; background: #000; display: block; flex: 0 0 6px; transform: translate3d(0,0,0); }
</style>
<div id="flaynity-onboarding" aria-hidden="true">
    <div id="flaynity-onboarding-track">
        <img class="onboarding-slide" src="https://www.image2url.com/r2/default/images/1788290108326-5cdf2a02-bc51-4194-b8ef-9353347a173c.png" alt="" draggable="false">
        <img class="onboarding-slide" src="https://www.image2url.com/r2/default/images/1788290164078-a14cb8c2-8f97-4986-baaf-9b738ecb7753.png" alt="" draggable="false">
        <img class="onboarding-slide" src="https://www.image2url.com/r2/default/images/1788290261336-c805b2db-e703-4b5c-8d27-c80fd9bc35bb.png" alt="" draggable="false">
    </div>
    <div id="flaynity-onboarding-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <button id="flaynity-onboarding-next" type="button">Get Started</button>
</div>
<script>
(function () {
    'use strict';
    const onboarding = document.getElementById('flaynity-onboarding');
    const track = document.getElementById('flaynity-onboarding-track');
    const slides = onboarding ? Array.from(onboarding.querySelectorAll('.onboarding-slide')) : [];
    const nextButton = document.getElementById('flaynity-onboarding-next');
    const splash = document.getElementById('flaynity-startup-splash');
    const urls = slides.map(function (img) { return img.getAttribute('src'); });
    let current = 0, timer = null, swipeStartX = 0, swipeStartY = 0, swipeStartTime = 0, dragging = false, swipeMoved = false, pointerId = null;
    let pendingShow = false;
    const SLIDE_MS = 3000;

    // Preload all onboarding images before the onboarding UI becomes visible.
    const preloadPromise = Promise.all(urls.map(function (url) {
        return new Promise(function (resolve) {
            const img = new Image();
            img.onload = img.onerror = function () { resolve(); };
            img.src = url;
        });
    }));

    function positionSlide(index, animate) {
        current = (index + slides.length) % slides.length;
        if (track) {
            track.style.transition = animate ? 'transform .42s cubic-bezier(.22,.8,.2,1)' : 'none';
            track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
        }
    }
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
    function startTimer() {
        stopTimer();
        timer = setInterval(function () { positionSlide(current + 1, true); }, SLIDE_MS);
    }
    function reveal() {
        if (!onboarding) return;
        onboarding.style.display = 'block';
        onboarding.setAttribute('aria-hidden', 'false');
        onboarding.classList.remove('ready');
        positionSlide(0, false);
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                onboarding.classList.add('ready');
            });
        });
        startTimer();
    }
    async function show() {
        pendingShow = true;
        // Never reveal onboarding underneath the startup splash.
        while (splash && !splash.classList.contains('is-hidden')) {
            await new Promise(function (resolve) { setTimeout(resolve, 60); });
        }
        await preloadPromise;
        if (!pendingShow) return;
        pendingShow = false;
        reveal();
    }
    window.__flaynityShowOnboarding = function () { show(); };
    window.__flaynityHideOnboarding = function () {
        pendingShow = false;
        stopTimer();
        if (!onboarding) return;
        onboarding.classList.remove('ready');
        onboarding.style.display = 'none';
        onboarding.setAttribute('aria-hidden', 'true');
    };

    function pointerStart(x, y, id) {
        stopTimer();
        swipeStartX = x; swipeStartY = y; swipeStartTime = Date.now();
        dragging = true; swipeMoved = false; pointerId = id || null;
        if (track) { track.style.transition = 'none'; track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)'; }
    }
    function pointerMove(x, y) {
        if (!dragging || !track) return;
        const dx = x - swipeStartX, dy = y - swipeStartY;
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.05) {
            // Lock the outer edges: first slide cannot move right, third slide cannot move left.
            if ((current === 0 && dx > 0) || (current === slides.length - 1 && dx < 0)) {
                swipeMoved = false;
                track.style.transform = 'translate3d(' + (-current * 100) + '%,0,0)';
                return;
            }
            swipeMoved = true;
            track.style.transform = 'translate3d(calc(' + (-current * 100) + '% + ' + dx + 'px),0,0)';
        }
    }
    function pointerEnd(x, y) {
        if (!dragging) return;
        dragging = false;
        const dx = x - swipeStartX, dy = y - swipeStartY;
        const width = onboarding ? onboarding.clientWidth : window.innerWidth;
        const progress = Math.min(1, Math.abs(dx) / Math.max(1, width));
        // A held/tapped image must not slide. Swipe follows the finger and only commits after a real horizontal drag.
        const edgeLocked = (current === 0 && dx > 0) || (current === slides.length - 1 && dx < 0);
        if (!edgeLocked && swipeMoved && Math.abs(dx) >= Math.max(45, width * 0.18) && Math.abs(dx) > Math.abs(dy) * 1.15) {
            positionSlide(current + (dx < 0 ? 1 : -1), true);
        } else {
            positionSlide(current, true);
        }
        startTimer();
        swipeMoved = false; pointerId = null;
    }
    if (onboarding) {
        onboarding.addEventListener('touchstart', function (e) {
            if (!e.touches.length) return;
            pointerStart(e.touches[0].clientX, e.touches[0].clientY, e.touches[0].identifier);
        }, { passive: true });
        onboarding.addEventListener('touchmove', function (e) {
            if (!e.touches.length) return;
            pointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        onboarding.addEventListener('touchend', function (e) {
            if (!e.changedTouches.length) return;
            pointerEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, { passive: true });
        onboarding.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse') pointerStart(e.clientX, e.clientY, e.pointerId);
        });
        onboarding.addEventListener('pointermove', function (e) {
            if (e.pointerType === 'mouse') pointerMove(e.clientX, e.clientY);
        });
        onboarding.addEventListener('pointerup', function (e) {
            if (e.pointerType === 'mouse') pointerEnd(e.clientX, e.clientY);
        });
    }
    if (nextButton) {
        nextButton.addEventListener('click', function () {
            window.__flaynityHideOnboarding();
            const authScreen = document.getElementById('auth-screen');
            if (authScreen) authScreen.style.display = 'flex';
            document.body.classList.add('auth-active');
        });
    }
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1400.0/aws-sdk.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.3.5/dist/hls.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloudflare-r2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/welcome-email.js"></script>

<div id="app"></div>
<script src="js/app.js"></script>
</body>
</html>
