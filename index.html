<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flaynity</title>
    
    <!-- Meta tags for security and mobile capabilities -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: wss: data: blob: 'unsafe-inline' 'unsafe-eval';">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons (Material Symbols Outlined & Rounded for fill states) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    <!-- Firebase SDK (Compat Version for Sketchware WebView) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- AWS SDK for Cloudflare R2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1490.0/aws-sdk.min.js"></script>

    <style>
        /* Global Reset & Entry Styles Only. No App UI. */
        :root {
            --flaynity-accent: #FF0050;
            --flaynity-bg: #FFFFFF;
            --flaynity-surface: #FFFFFF;
            --flaynity-text: #000000;
            --flaynity-text-secondary: #4B4B4B;
            --flaynity-divider: #E5E5E5;
            --flaynity-skeleton: #F0F0F0;
            --bottom-nav-height: 60px;
            --top-bar-height: 56px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --flaynity-bg: #000000;
                --flaynity-surface: #000000;
                --flaynity-text: #FFFFFF;
                --flaynity-text-secondary: #A0A0A0;
                --flaynity-divider: #222222;
                --flaynity-skeleton: #1A1A1A;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--flaynity-bg);
            color: var(--flaynity-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; 
            overscroll-behavior: none;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Core visibility and utility classes used by the JS router */
        .flaynity-hidden { display: none !important; }
        .flaynity-selectable { user-select: text; -webkit-user-select: text; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body>
    <!-- Root Container ONLY -->
    <div id="app"></div>
    
    <!-- Application Logic Entry (Without type="module") -->
    <script src="js/app.js"></script>
</body>
</html>
