<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Android WebView Optimization: No auto-zoom, no pinch-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Flaynity</title>

    <!-- Google Fonts: Roboto & Material Symbols (Premium Icons) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* Global Reset & Base Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #0f0f0f;
            overflow: hidden; /* Handled by individual pages */
            width: 100vw;
            height: 100vh;
            overscroll-behavior: none; /* Prevents pull-to-refresh glow */
        }
        /* Root container strictly for rendering pages */
        #flaynity-root {
            width: 100%;
            height: 100%;
            position: relative;
        }
        /* Material Symbols Setup */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>

    <!-- STRICT REQUIREMENT: Only the root container -->
    <div id="flaynity-root"></div>

    <!-- Firebase SDKs (Modular) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <!-- AWS SDK for Cloudflare R2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1408.0/aws-sdk.min.js"></script>

    <!-- Application Core Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/cloudflare-r2.js"></script>
    <script src="js/navigation.js"></script>

</body>
</html>
