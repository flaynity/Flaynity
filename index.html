<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents unwanted zoom and scaling in Android WebView -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Flaynity</title>

    <!-- Premium Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <!-- Firebase SDK (Compat mode for easier Vanilla JS integration in WebView) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <!-- AWS SDK for Cloudflare R2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1490.0/aws-sdk.min.js"></script>

    <style>
        /* Global CSS Reset & Base Definitions */
        :root {
            --bg-primary: #000000;
            --bg-surface: #0A0A0A;
            --bg-surface-light: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-color: #FF1744;
            --nav-height: 56px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
            --font-family: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden; /* Handled by internal page routing */
            width: 100vw;
            height: 100vh;
        }

        /* Root container where page content + navigation will be injected */
        #root {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>

    <!-- ONLY ENTRY POINT. NO UI ALLOWED HERE. -->
    <div id="root"></div>

    <!-- Application Logic -->
    <script src="js/firebase-config.js"></script>
    <script src="js/cloudflare-r2.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
