<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flaynity - Social Media Platform</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase (v10.8.1 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>

    <!-- AWS SDK for R2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1400.0/aws-sdk.min.js"></script>

    <!-- HLS.js for video streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.3.5/dist/hls.min.js"></script>

    <style>
        /* ROOT THEME VARIABLES */
        :root {
            --bg-color: #FFFFFF;
            --surface: #FFFFFF;
            --primary: #FF2E55;
            --primary-glow: rgba(255, 46, 85, 0.12);
            --text-main: #000000;
            --text-muted: #555555;
            --card-bg: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --success: #00C853;
            --download: #007AFF;
            --border-color: #EEEEEE;
            --skeleton-base: #E0E0E0;
            --skeleton-shimmer: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --surface: #000000;
            --primary: #FF2E55;
            --primary-glow: rgba(255, 46, 85, 0.15);
            --text-main: #FFFFFF;
            --text-muted: #AAAAAA;
            --card-bg: #000000;
            --glass-bg: rgba(0, 0, 0, 0.95);
            --glass-border: rgba(255, 255, 255, 0.15);
            --border-color: #222222;
            --skeleton-base: #212121;
            --skeleton-shimmer: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea, select {
            -webkit-user-select: auto;
            user-select: auto;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            flex-direction: column;
            gap: 20px;
        }

        .splash-logo {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: 2px;
            background: linear-gradient(135deg, #bf953f, #b38728);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .splash-progress {
            width: 200px;
            height: 3px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .splash-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #bf953f, #b38728);
            width: 0%;
            animation: splashProgress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes splashProgress {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        /* MAIN APP */
        #app-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            z-index: 100;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .header-brand {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .header-brand span {
            color: var(--primary);
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #FF7A00);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* MAIN CONTENT */
        .app-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            margin-top: 56px;
            margin-bottom: 56px;
        }

        .tab-content {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 16px;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            position: relative;
        }

        /* SKELETON LOADER */
        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shimmer) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 200px;
            margin-bottom: 16px;
            border-radius: 12px;
        }

        /* FEED */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-card {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--skeleton-base);
            flex-shrink: 0;
            overflow: hidden;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-meta {
            flex: 1;
        }

        .post-author {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .post-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .post-content {
            margin-bottom: 12px;
        }

        .post-image {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            object-fit: cover;
            background: var(--skeleton-base);
            margin-bottom: 12px;
        }

        .post-text {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .post-actions {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--glass-border);
            padding-top: 12px;
        }

        .post-action-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .post-action-btn:active {
            color: var(--primary);
            transform: scale(0.95);
        }

        /* SHORTS */
        #shorts-tab {
            background: #000000 !important;
        }

        .shorts-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .shorts-container::-webkit-scrollbar {
            display: none;
        }

        .short-slide {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            position: relative;
            overflow: hidden;
        }

        .short-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .short-actions {
            position: absolute;
            right: 12px;
            bottom: 70px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        .short-action-btn {
            width: 50px;
            height: 50px;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: var(--surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.4rem;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* AUTH MODAL */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .auth-modal.active {
            display: flex;
        }

        .auth-box {
            background: var(--surface);
            border-radius: 20px;
            padding: 32px 24px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-box h1 {
            font-size: 2rem;
            text-align: center;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .auth-box h1 span {
            color: var(--primary);
        }

        .auth-box h2 {
            font-size: 0.95rem;
            text-align: center;
            margin: 0 0 24px 0;
            color: var(--text-muted);
        }

        .btn-google {
            width: 100%;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .btn-google:active {
            transform: scale(0.97);
            background: var(--primary-glow);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
    <div class="splash-logo">Flaynity</div>
    <div class="splash-progress">
        <div class="splash-progress-bar"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" style="display: none;">
    <!-- HEADER -->
    <header>
        <div class="header-brand">Flaynity</div>
        <div class="header-avatar" id="header-avatar" onclick="ProfileManager.openProfile()">F</div>
    </header>

    <!-- CONTENT -->
    <div class="app-content">
        <!-- HOME TAB -->
        <div id="home-tab" class="tab-content active">
            <div class="feed-container" id="feed-container"></div>
        </div>

        <!-- SHORTS TAB -->
        <div id="shorts-tab" class="tab-content">
            <div class="shorts-container" id="shorts-container"></div>
        </div>

        <!-- SEARCH TAB -->
        <div id="search-tab" class="tab-content">
            <div id="search-container"></div>
        </div>

        <!-- CREATE TAB -->
        <div id="create-tab" class="tab-content">
            <div id="create-container"></div>
        </div>

        <!-- PROFILE TAB -->
        <div id="profile-tab" class="tab-content">
            <div id="profile-container"></div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-tab="home" onclick="UI.switchTab('home')">
            <i class="nav-icon fas fa-home"></i>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-tab="shorts" onclick="UI.switchTab('shorts')">
            <i class="nav-icon fas fa-play"></i>
            <span class="nav-label">Shorts</span>
        </div>
        <div class="nav-item" data-tab="create" onclick="UI.switchTab('create')">
            <i class="nav-icon fas fa-plus"></i>
            <span class="nav-label">Create</span>
        </div>
        <div class="nav-item" data-tab="search" onclick="UI.switchTab('search')">
            <i class="nav-icon fas fa-search"></i>
            <span class="nav-label">Search</span>
        </div>
        <div class="nav-item" data-tab="profile" onclick="UI.switchTab('profile')">
            <i class="nav-icon fas fa-user"></i>
            <span class="nav-label">Profile</span>
        </div>
    </nav>
</div>

<!-- AUTH MODAL -->
<div id="auth-modal" class="auth-modal">
    <div class="auth-box">
        <h1>Welcome to <span>Flaynity</span></h1>
        <h2>Social Media Redefined</h2>
        <button class="btn-google" id="btn-google-signin" onclick="AuthManager.signInWithGoogle()">
            <i class="fab fa-google"></i>
            Sign in with Google
        </button>
    </div>
</div>

<script>
    // ============================================
    // FIREBASE ENGINE - PRODUCTION SINGLE INIT
    // ============================================
    
    const FirebaseEngine = (() => {
        let initialized = false;
        let db = null;
        let auth = null;

        return {
            init: async function() {
                if (initialized) return Promise.resolve();

                return new Promise((resolve, reject) => {
                    try {
                        const firebaseConfig = {
                            apiKey: "YOUR_API_KEY",
                            authDomain: "YOUR_AUTH_DOMAIN",
                            databaseURL: "YOUR_DATABASE_URL",
                            projectId: "YOUR_PROJECT_ID",
                            storageBucket: "YOUR_STORAGE_BUCKET",
                            messagingSenderId: "YOUR_MESSAGING_ID",
                            appId: "YOUR_APP_ID"
                        };

                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }

                        db = firebase.database();
                        auth = firebase.auth();
                        db.goOnline();
                        initialized = true;

                        console.log("✅ Firebase Engine initialized");
                        resolve();
                    } catch (e) {
                        console.error("❌ Firebase init failed:", e);
                        reject(e);
                    }
                });
            },

            getDatabase: () => db,
            getAuth: () => auth,
            isInitialized: () => initialized
        };
    })();

    // ============================================
    // LISTENER MANAGER - NO DUPLICATES
    // ============================================

    const ListenerManager = (() => {
        let listeners = {};

        return {
            attach: function(key, ref, callback) {
                if (listeners[key]) {
                    this.detach(key);
                }
                
                const onValue = ref.on('value', callback, (error) => {
                    console.error(`❌ Listener error (${key}):`, error);
                });

                listeners[key] = ref;
                console.log(`✅ Listener attached: ${key}`);
            },

            detach: function(key) {
                if (listeners[key]) {
                    listeners[key].off('value');
                    delete listeners[key];
                    console.log(`✅ Listener detached: ${key}`);
                }
            },

            detachAll: function() {
                Object.keys(listeners).forEach(key => {
                    if (listeners[key]) {
                        listeners[key].off('value');
                    }
                });
                listeners = {};
                console.log("✅ All listeners detached");
            }
        };
    })();

    // ============================================
    // CACHE MANAGER - SMART 5-MIN CACHE
    // ============================================

    const CacheManager = (() => {
        let cache = {};
        const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes

        return {
            set: function(key, data) {
                cache[key] = {
                    data,
                    timestamp: Date.now()
                };
            },

            get: function(key) {
                const item = cache[key];
                if (!item) return null;

                if (Date.now() - item.timestamp > CACHE_DURATION) {
                    delete cache[key];
                    return null;
                }

                return item.data;
            },

            clear: function(key) {
                if (key) {
                    delete cache[key];
                } else {
                    cache = {};
                }
            }
        };
    })();

    // ============================================
    // NETWORK MANAGER - REALTIME CONNECTIVITY
    // ============================================

    const NetworkManager = (() => {
        let isOnline = navigator.onLine;
        let listeners = [];

        window.addEventListener('online', () => {
            isOnline = true;
            console.log("🌐 Network: ONLINE - Syncing...");
            SyncManager.onNetworkRestored();
            listeners.forEach(cb => cb(true));
        });

        window.addEventListener('offline', () => {
            isOnline = false;
            console.log("📵 Network: OFFLINE");
            listeners.forEach(cb => cb(false));
        });

        return {
            isOnline: () => isOnline,
            onChange: function(callback) {
                listeners.push(callback);
            }
        };
    })();

    // ============================================
    // AUTH MANAGER - FIREBASE AUTH
    // ============================================

    const AuthManager = (() => {
        let currentUser = null;

        return {
            init: function() {
                const auth = FirebaseEngine.getAuth();
                
                auth.onAuthStateChanged((user) => {
                    currentUser = user;
                    if (user) {
                        console.log("✅ User logged in:", user.email);
                        document.getElementById('splash-screen').style.display = 'none';
                        document.getElementById('app-screen').style.display = 'flex';
                        document.getElementById('auth-modal').classList.remove('active');
                        SyncManager.refreshEverything();
                    } else {
                        console.log("❌ User not logged in");
                        document.getElementById('splash-screen').style.display = 'none';
                        document.getElementById('auth-modal').classList.add('active');
                    }
                });
            },

            signInWithGoogle: async function() {
                try {
                    if (typeof AndroidBridge !== 'undefined') {
                        AndroidBridge.triggerGoogleSignIn();
                    } else {
                        console.log("⚠️ Android Bridge not available");
                    }
                } catch (e) {
                    console.error("❌ Google sign-in failed:", e);
                }
            },

            handleGoogleToken: function(idToken) {
                const auth = FirebaseEngine.getAuth();
                const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
                
                auth.signInWithCredential(credential).then((result) => {
                    console.log("✅ Signed in as:", result.user.email);
                }).catch((error) => {
                    console.error("❌ Sign-in error:", error);
                });
            },

            getCurrentUser: () => currentUser,
            signOut: function() {
                FirebaseEngine.getAuth().signOut();
            }
        };
    })();

    // ============================================
    // FEED MANAGER - REALTIME FEED (50 LATEST)
    // ============================================

    const FeedManager = (() => {
        let feedData = [];

        return {
            loadFeed: async function() {
                return new Promise((resolve) => {
                    const db = FirebaseEngine.getDatabase();
                    const user = AuthManager.getCurrentUser();

                    if (!user) {
                        resolve([]);
                        return;
                    }

                    const ref = db.ref('feed').orderByChild('timestamp').limitToLast(50);
                    ListenerManager.attach('feed', ref, (snapshot) => {
                        feedData = [];
                        
                        snapshot.forEach((childSnapshot) => {
                            feedData.unshift(childSnapshot.val());
                        });

                        console.log("✅ Feed loaded:", feedData.length, "posts");
                        UI.renderFeed(feedData);
                        resolve(feedData);
                    });
                });
            },

            getFeed: () => feedData
        };
    })();

    // ============================================
    // SHORTS MANAGER - REALTIME SHORTS (100 LATEST)
    // ============================================

    const ShortsManager = (() => {
        let shortsData = [];

        return {
            loadShorts: async function() {
                return new Promise((resolve) => {
                    const db = FirebaseEngine.getDatabase();
                    const user = AuthManager.getCurrentUser();

                    if (!user) {
                        resolve([]);
                        return;
                    }

                    const ref = db.ref('shorts').orderByChild('timestamp').limitToLast(100);
                    ListenerManager.attach('shorts', ref, (snapshot) => {
                        shortsData = [];
                        
                        snapshot.forEach((childSnapshot) => {
                            shortsData.unshift(childSnapshot.val());
                        });

                        console.log("✅ Shorts loaded:", shortsData.length, "videos");
                        UI.renderShorts(shortsData);
                        resolve(shortsData);
                    });
                });
            },

            getShorts: () => shortsData
        };
    })();

    // ============================================
    // PROFILE MANAGER - REALTIME PROFILE
    // ============================================

    const ProfileManager = (() => {
        let profileData = null;

        return {
            loadProfile: async function() {
                return new Promise((resolve) => {
                    const db = FirebaseEngine.getDatabase();
                    const user = AuthManager.getCurrentUser();

                    if (!user) {
                        resolve(null);
                        return;
                    }

                    const ref = db.ref('users/' + user.uid);
                    ListenerManager.attach('profile', ref, (snapshot) => {
                        profileData = snapshot.val();
                        console.log("✅ Profile loaded");
                        UI.renderProfile(profileData);
                        resolve(profileData);
                    });
                });
            },

            getProfile: () => profileData,

            updateProfile: function(updates) {
                const db = FirebaseEngine.getDatabase();
                const user = AuthManager.getCurrentUser();

                if (!user) return;

                db.ref('users/' + user.uid).update(updates).then(() => {
                    console.log("✅ Profile updated");
                }).catch(e => console.error("❌ Update failed:", e));
            },

            openProfile: function() {
                UI.switchTab('profile');
            }
        };
    })();

    // ============================================
    // SYNC MANAGER - COMPLETE REFRESH
    // ============================================

    const SyncManager = (() => {
        let isSyncing = false;

        return {
            refreshEverything: async function() {
                if (isSyncing) return;
                isSyncing = true;

                console.log("🔄 Starting complete sync...");

                try {
                    // Detach and cleanup
                    ListenerManager.detachAll();
                    CacheManager.clear();

                    // Reload all data
                    await Promise.all([
                        FeedManager.loadFeed(),
                        ShortsManager.loadShorts(),
                        ProfileManager.loadProfile()
                    ]);

                    console.log("✅ Sync complete");
                } catch (e) {
                    console.error("❌ Sync failed:", e);
                } finally {
                    isSyncing = false;
                }
            },

            onNetworkRestored: async function() {
                console.log("🔄 Network restored - Full resync...");
                const db = FirebaseEngine.getDatabase();
                db.goOnline();
                await this.refreshEverything();
            }
        };
    })();

    // ============================================
    // UI RENDERER - DOM UPDATES ONLY
    // ============================================

    const UI = (() => {
        return {
            switchTab: function(tabName) {
                document.querySelectorAll('.tab-content').forEach(el => {
                    el.classList.remove('active');
                });
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('active');
                });

                document.getElementById(tabName + '-tab').classList.add('active');
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            },

            renderFeed: function(data) {
                const container = document.getElementById('feed-container');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">No posts yet</p>';
                    return;
                }

                data.forEach(post => {
                    const postEl = document.createElement('div');
                    postEl.className = 'post-card';
                    postEl.innerHTML = `
                        <div class="post-header">
                            <div class="post-avatar">
                                ${post.authorAvatar ? `<img src="${post.authorAvatar}" alt="">` : '<span>U</span>'}
                            </div>
                            <div class="post-meta">
                                <div class="post-author">${post.authorName || 'User'}</div>
                                <div class="post-time">${new Date(post.timestamp).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="post-content">
                            ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="">` : ''}
                            <div class="post-text">${post.text || ''}</div>
                        </div>
                        <div class="post-actions">
                            <button class="post-action-btn">
                                <i class="fas fa-heart"></i>
                                <span>${post.likes || 0}</span>
                            </button>
                            <button class="post-action-btn">
                                <i class="fas fa-comment"></i>
                                <span>${post.comments || 0}</span>
                            </button>
                            <button class="post-action-btn">
                                <i class="fas fa-share"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(postEl);
                });
            },

            renderShorts: function(data) {
                const container = document.getElementById('shorts-container');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: white; margin-top: 50%;">No shorts available</p>';
                    return;
                }

                data.forEach(short => {
                    const shortEl = document.createElement('div');
                    shortEl.className = 'short-slide';
                    shortEl.innerHTML = `
                        <video class="short-video" src="${short.videoUrl}" controls playsinline></video>
                    `;
                    container.appendChild(shortEl);
                });
            },

            renderProfile: function(data) {
                const container = document.getElementById('profile-container');
                if (!data) {
                    container.innerHTML = '<p style="text-align: center; padding: 20px;">No profile data</p>';
                    return;
                }
                
                container.innerHTML = `
                    <div style="text-align: center; padding: 24px;">
                        <h2>${data.displayName || 'User'}</h2>
                        <p style="color: var(--text-muted);">${data.bio || 'No bio'}</p>
                        <div style="display: flex; justify-content: space-around; margin: 20px 0;">
                            <div>
                                <div style="font-size: 1.5rem; font-weight: 800;">${data.followers || 0}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">Followers</div>
                            </div>
                            <div>
                                <div style="font-size: 1.5rem; font-weight: 800;">${data.following || 0}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">Following</div>
                            </div>
                            <div>
                                <div style="font-size: 1.5rem; font-weight: 800;">${data.videos || 0}</div>
                                <div style="font-size: 0.85rem; color: var(--text-muted);">Videos</div>
                            </div>
                        </div>
                        <button class="btn-google" onclick="AuthManager.signOut()" style="margin-top: 20px;">
                            Sign Out
                        </button>
                    </div>
                `;
            }
        };
    })();

    // ============================================
    // APP INITIALIZATION
    // ============================================

    async function initApp() {
        try {
            await FirebaseEngine.init();
            AuthManager.init();
            
            NetworkManager.onChange((isOnline) => {
                if (isOnline) {
                    SyncManager.onNetworkRestored();
                }
            });

            console.log("✅ App initialized");
        } catch (e) {
            console.error("❌ App init failed:", e);
        }
    }

    // Expose to Android bridge
    window.handleNativeGoogleSignIn = AuthManager.handleGoogleToken.bind(AuthManager);

    // Start app
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
