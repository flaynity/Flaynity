<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Android WebView Optimization: Prevents unwanted zooming, layout jumping & horizontal overflow -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Flaynity</title>

  <!-- Google Fonts: Roboto & Inter for clean MD3 typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Material Symbols Outlined (Material Design 3 Icons) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Firebase SDK (Compatibility build for seamless Vanilla JS WebView integration) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- AWS SDK for Cloudflare R2 S3-Compatible Uploads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1585.0/aws-sdk.min.js"></script>

  <style>
    /* Global CSS Reset & Android WebView Optimization */
    :root {
      --fl-primary: #FF0033;
      --fl-primary-hover: #D9002C;
      --fl-bg: #FFFFFF;
      --fl-surface: #F8F9FA;
      --fl-surface-variant: #F1F3F4;
      --fl-outline: #E0E0E0;
      --fl-text: #0F0F0F;
      --fl-text-secondary: #606060;
      --fl-text-disabled: #909090;
      --fl-bottom-nav-height: 56px;
      --fl-header-height: 52px;
      --fl-border-radius: 12px;
      --fl-ripple: rgba(0, 0, 0, 0.08);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--fl-bg);
      color: var(--fl-text);
      font-family: var(--font-main);
      font-size: 14px;
      line-height: 1.4;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Strict Root Container */
    #example {
      width: 100%;
      min-height: 100%;
      position: relative;
      background-color: var(--fl-bg);
      overflow-x: hidden;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      display: inline-block;
      line-height: 1;
    }

    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>

  <!-- Root Application Container (No Application UI Here) -->
  <div id="example"></div>

  <!-- Global Modular Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/cloudflare-r2.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
