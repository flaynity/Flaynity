<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flaynity – No Connection</title>
    <style>
        :root {
            --primary: #FF2E55;
            --bg: #FFFFFF;
            --text: #000000;
            --muted: #666666;
            --border: #EEEEEE;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #FFFFFF;
                --muted: #AAAAAA;
                --border: #222222;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
        }

        /* Animated signal icon */
        .signal-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 32px;
            position: relative;
        }
        .signal-icon svg { width: 100%; height: 100%; }
        .signal-bar {
            animation: signalPulse 1.6s ease-in-out infinite;
            transform-origin: bottom center;
        }
        .signal-bar:nth-child(1) { animation-delay: 0s; }
        .signal-bar:nth-child(2) { animation-delay: 0.2s; }
        .signal-bar:nth-child(3) { animation-delay: 0.4s; }
        .signal-bar:nth-child(4) { animation-delay: 0.6s; }
        @keyframes signalPulse {
            0%, 100% { opacity: 0.2; }
            50%       { opacity: 1; }
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .logo span { color: var(--primary); }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto 36px;
        }

        .btn-retry {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 46, 85, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-retry:active { transform: scale(0.95); box-shadow: none; }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #EF4444;
            display: inline-block;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        .footer-note {
            margin-top: 48px;
            font-size: 0.78rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <div class="signal-icon">
        <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Bar 1 – shortest -->
            <rect class="signal-bar" x="8"  y="72" width="14" height="16" rx="4" fill="#FF2E55"/>
            <!-- Bar 2 -->
            <rect class="signal-bar" x="28" y="56" width="14" height="32" rx="4" fill="#FF2E55"/>
            <!-- Bar 3 -->
            <rect class="signal-bar" x="48" y="40" width="14" height="48" rx="4" fill="#FF2E55"/>
            <!-- Bar 4 – tallest -->
            <rect class="signal-bar" x="68" y="24" width="14" height="64" rx="4" fill="#FF2E55"/>
            <!-- X mark over signal -->
            <line x1="60" y1="8" x2="88" y2="20" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
            <line x1="88" y1="8" x2="60" y2="20" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
        </svg>
    </div>

    <div class="logo">Flay<span>nity</span></div>

    <h1>No Internet Connection</h1>
    <p>
        It looks like you're offline. Check your Wi-Fi or mobile data and try again.
        Your content will load automatically once you're back online.
    </p>

    <button class="btn-retry" onclick="retryConnection()">
        <span class="status-dot"></span>
        Try Again
    </button>

    <p class="footer-note">
        Once connected, Flaynity will resume automatically — no restart needed.
    </p>

    <script>
        /**
         * Called by the Retry button AND by MainActivity.java's
         * ConnectivityManager.NetworkCallback.onAvailable() via:
         *
         *   webview.evaluateJavascript(
         *       "if(typeof retryConnection==='function') retryConnection();", null);
         *
         * This function NEVER calls location.reload() or webview.reload().
         * Instead it calls the AndroidBridge.retryConnection() method which
         * triggers MainActivity.retryConnection() → evaluates
         * window.FlaynityNetworkOnline() in the main WebView.
         */
        function retryConnection() {
            // If we have the Android bridge, delegate to native
            if (window.AndroidBridge && typeof window.AndroidBridge.retryConnection === 'function') {
                window.AndroidBridge.retryConnection();
                return;
            }

            // Fallback: check navigator.onLine and navigate to main app
            if (navigator.onLine) {
                // Navigate to the main app shell (cached by SW)
                window.location.href = '/';
            }
        }

        // Auto-retry when the browser detects connectivity
        window.addEventListener('online', () => {
            setTimeout(retryConnection, 800);
        });

        // Also listen for the Android bridge push
        window.FlaynityNetworkOnline = function () {
            retryConnection();
        };
    </script>
</body>
</html>
