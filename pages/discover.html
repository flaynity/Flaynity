<style>
    .discover-page {
        width: 100%;
        height: calc(100vh - var(--nav-height) - var(--safe-area-bottom));
        overflow-y: auto;
        background-color: var(--bg-primary);
        padding-top: var(--safe-area-top);
    }

    /* Sticky Search Header */
    .discover-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background-color: var(--bg-primary);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .discover-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .discover-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-primary);
    }

    .discover-settings {
        color: var(--text-primary);
        font-size: 26px;
    }

    /* Search Bar */
    .search-box-container {
        display: flex;
        align-items: center;
        background-color: var(--bg-surface-light);
        border-radius: 24px;
        padding: 4px 16px;
        height: 44px;
    }

    .search-box-container .material-symbols-outlined {
        color: var(--text-secondary);
        font-size: 22px;
    }

    .search-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-family: var(--font-family);
        font-size: 15px;
        padding: 0 12px;
        outline: none;
    }

    .search-input::placeholder {
        color: var(--text-secondary);
    }

    .mic-button {
        background-color: var(--bg-surface);
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-left: 12px;
    }

    .search-wrapper {
        display: flex;
        align-items: center;
    }

    /* Categories - Allowed Horizontal Scroll */
    .discover-categories {
        display: flex;
        overflow-x: auto;
        padding: 0 16px 16px;
        gap: 10px;
        background-color: var(--bg-primary);
        border-bottom: 1px solid var(--bg-surface);
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .discover-categories::-webkit-scrollbar {
        display: none;
    }

    .cat-chip {
        white-space: nowrap;
        background-color: var(--bg-surface-light);
        color: var(--text-primary);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .cat-chip.active {
        background-color: var(--text-primary);
        color: var(--bg-primary);
    }

    /* Search Results Area */
    .discover-results {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        color: var(--text-secondary);
    }

    .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
    }

    .empty-state-text {
        font-size: 15px;
        font-weight: 500;
    }
</style>

<div class="discover-page">
    <div class="discover-header">
        <div class="discover-top-row">
            <div class="discover-title">Discover</div>
            <span class="material-symbols-outlined discover-settings">settings</span>
        </div>
        
        <div class="search-wrapper">
            <div class="search-box-container" style="flex:1;">
                <span class="material-symbols-outlined">search</span>
                <input type="text" class="search-input" id="discover-search-input" placeholder="Search movies, TV shows...">
            </div>
            <div class="mic-button" onclick="triggerMicSearch()">
                <span class="material-symbols-outlined" style="color:var(--text-primary);">mic</span>
            </div>
        </div>
    </div>

    <div class="discover-categories" id="discover-categories">
        <div class="cat-chip active">Action</div>
        <div class="cat-chip">Sci-Fi</div>
        <div class="cat-chip">Horror</div>
        <div class="cat-chip">Comedy</div>
        <div class="cat-chip">Drama</div>
        <div class="cat-chip">Animation</div>
        <div class="cat-chip">Music</div>
        <div class="cat-chip">Gaming</div>
        <div class="cat-chip">Education</div>
    </div>

    <div class="discover-results" id="discover-results-container">
        <div class="empty-state">
            <span class="material-symbols-outlined empty-state-icon">search</span>
            <div class="empty-state-text">Search or use the mic to find movies, videos, and channels.</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const searchInput = document.getElementById('discover-search-input');
        const resultsContainer = document.getElementById('discover-results-container');
        const categories = document.querySelectorAll('.cat-chip');
        let searchTimeout;
        const db = window.firebase ? window.firebase.database() : null;

        // Category Selection
        categories.forEach(chip => {
            chip.addEventListener('click', () => {
                categories.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                performSearch(chip.innerText);
            });
        });

        // Debounced Search Input
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if(query.length === 0) {
                showEmptyState();
                return;
            }
            // Debounce 500ms
            searchTimeout = setTimeout(() => {
                performSearch(query);
            }, 500);
        });

        function performSearch(query) {
            if(!db) {
                renderPlaceholderResults(query);
                return;
            }

            // Realtime DB Architecture Search (Case-insensitive matching requires smart indexing)
            resultsContainer.innerHTML = '<div class="empty-state">Loading...</div>';
            
            // Simple query example (Actual implementation might use Algolia or specialized text search logic)
            db.ref('videos').orderByChild('title').startAt(query).endAt(query + "\uf8ff").limitToFirst(10).once('value', (snapshot) => {
                if(!snapshot.exists()) {
                    resultsContainer.innerHTML = `<div class="empty-state">No results found for "${query}"</div>`;
                    return;
                }
                
                resultsContainer.innerHTML = '';
                snapshot.forEach(child => {
                    const data = child.val();
                    const html = `
                        <div class="video-card" onclick="window.openWatchPage('${child.key}')">
                            <div class="video-thumbnail">
                                <img src="${data.thumbnailUrl || ''}">
                            </div>
                            <div class="video-info">
                                <div class="video-text" style="padding:0;">
                                    <div class="video-title">${data.title}</div>
                                    <div class="video-meta">@${data.ownerId} • ${data.views} views</div>
                                </div>
                            </div>
                        </div>
                    `;
                    resultsContainer.insertAdjacentHTML('beforeend', html);
                });
            });
        }

        function showEmptyState() {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined empty-state-icon">search</span>
                    <div class="empty-state-text">Search or use the mic to find movies, videos, and channels.</div>
                </div>
            `;
        }

        function renderPlaceholderResults(query) {
            resultsContainer.innerHTML = `
                <div style="font-size:14px; color:var(--text-secondary); margin-bottom:12px;">Results for "${query}"</div>
                <div class="video-card">
                    <div class="video-thumbnail skeleton"></div>
                    <div class="video-info" style="padding: 12px 0 0;">
                        <div class="video-text">
                            <div class="video-title skeleton" style="height:20px; width:80%;"></div>
                            <div class="video-meta skeleton" style="height:14px; width:50%; margin-top:8px;"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.triggerMicSearch = function() {
            // Android WebView JS Bridge support for Speech Recognition
            if(window.SketchwareBridge && window.SketchwareBridge.startSpeechRecognition) {
                window.SketchwareBridge.startSpeechRecognition();
            } else if('webkitSpeechRecognition' in window) {
                const recognition = new webkitSpeechRecognition();
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    searchInput.value = text;
                    performSearch(text);
                };
                recognition.start();
            } else {
                alert("Microphone search is not supported on this device/environment.");
            }
        };
    })();
</script>
