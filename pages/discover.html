<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF" id="flaynity-theme-color">
<script>(function(){var m=document.getElementById('flaynity-theme-color');var dark='#0F0F0F';var light='#FFFFFF';function sync(){var t=localStorage.getItem('flaynity-theme-pref')||'light';if(m)m.setAttribute('content',t==='dark'?dark:light);}sync();})();</script><title>Flaynity</title>
<style>
/* Search UI */
        .search-container { position: relative; margin-bottom: 15px; }
        .search-bar { width: 100%; padding: 16px 50px 16px 18px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 16px; color: var(--text-main); font-size: 1.05rem; outline:none; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .search-bar:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px rgba(255, 46, 85, 0.08); }
        .mic-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        
        .filters { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; margin-right: -20px; padding-right: 20px;}
        .filter-chip { padding: 8px 18px; background: var(--surface); border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 0.9rem; font-weight: 700; transition: 0.3s; border: 1px solid var(--glass-border); color: var(--text-muted); }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
</style></head><body>
<div class="tab-content" id="search-tab">
<div class="section-title" style="margin-top:20px;">Discover</div>
<div class="search-container">
<input class="search-bar" id="search-input" placeholder="Search movies, TV shows..." type="text"/>
<button class="mic-btn" onclick="startVoiceSearch(); playUI('click')"><i class="fas fa-microphone"></i></button>
</div>
<div class="filters">
<div class="filter-chip" onclick="applyFilter(28, this); playUI('click')">Action</div>
<div class="filter-chip" onclick="applyFilter(878, this); playUI('click')">Sci-Fi</div>
<div class="filter-chip" onclick="applyFilter(27, this); playUI('click')">Horror</div>
<div class="filter-chip" onclick="applyFilter(35, this); playUI('click')">Comedy</div>
<div class="filter-chip" onclick="applyFilter(10749, this); playUI('click')">Romance</div>
<div class="filter-chip" onclick="applyFilter(16, this); playUI('click')">Animation</div>
</div>
<div class="movie-grid" id="search-results">
<p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding: 60px 0; font-weight: 500;">Search or use the mic to find movies.</p>
</div>
</div>
</body></html>
