<style>
    .discover-container {
        width: 100%; height: 100%; display: flex; flex-direction: column; background: #ffffff;
    }
    
    /* Discover Top Bar */
    .discover-top-bar {
        display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
        background: #ffffff; flex-shrink: 0;
    }
    .discover-branding { font-size: 24px; font-weight: 800; color: #0f0f0f; }

    /* Search Box Container */
    .search-box-wrapper {
        padding: 0 16px 16px 16px; border-bottom: 1px solid #f0f0f0;
    }
    .search-input-container {
        display: flex; align-items: center; background: #f2f2f2; border-radius: 100px;
        padding: 4px 16px; height: 48px;
    }
    .search-input {
        flex: 1; border: none; background: transparent; outline: none;
        font-size: 16px; padding: 0 8px; color: #0f0f0f;
    }
    
    /* Wrap-able Chips (No Horizontal Overflow) */
    .discover-chips {
        display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; flex-shrink: 0;
    }
    .d-chip {
        padding: 8px 16px; border-radius: 100px; background: #f2f2f2;
        font-size: 14px; font-weight: 500; cursor: pointer; color: #0f0f0f;
    }

    /* Empty State */
    .discover-empty-state {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 32px; text-align: center; color: #666;
    }
    .discover-empty-state .material-symbols-rounded { font-size: 64px; color: #ddd; margin-bottom: 16px; }
    .empty-text-main { font-size: 18px; font-weight: 600; color: #0f0f0f; margin-bottom: 8px; }
    
    /* Search Results Area (Hidden Initially) */
    .search-results-area {
        flex: 1; overflow-y: auto; display: none; padding: 16px; padding-bottom: 80px;
    }
</style>

<div class="discover-container">
    <div class="discover-top-bar">
        <div class="discover-branding">Discover</div>
        <div style="display: flex; gap: 16px;">
            <span class="material-symbols-rounded">settings</span>
        </div>
    </div>

    <div class="search-box-wrapper">
        <div class="search-input-container">
            <span class="material-symbols-rounded" style="color: #666;">search</span>
            <input type="text" class="search-input" id="discover-search-input" placeholder="Search movies, TV shows...">
            <span class="material-symbols-rounded" style="color: #0f0f0f; cursor: pointer;">mic</span>
        </div>
    </div>

    <div class="discover-chips">
        <div class="d-chip">Action</div>
        <div class="d-chip">Sci-Fi</div>
        <div class="d-chip">Horror</div>
        <div class="d-chip">Comedy</div>
        <div class="d-chip">Romance</div>
        <div class="d-chip">Documentary</div>
    </div>

    <!-- Empty State -->
    <div class="discover-empty-state" id="discover-empty">
        <span class="material-symbols-rounded">travel_explore</span>
        <div class="empty-text-main">Ready to watch?</div>
        <div style="font-size: 14px;">Search or use the mic to find movies, shorts, and user posts.</div>
    </div>

    <!-- Results -->
    <div class="search-results-area" id="search-results-feed">
        <!-- Result Cards will be populated here -->
    </div>
</div>
