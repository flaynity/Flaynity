<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flaynity Discover</title>

    <!-- FontAwesome Icon Library (still used by the fullscreen search window) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
           DISCOVER (EXPLORE) PAGE
           Search bar -> category chips -> 2-column masonry feed
           Colors follow your app variables (light + dark), with
           fallbacks that match the reference design in light mode.
           ========================================================= */

        #search-tab {
            --dc-bg: var(--bg-color, #ffffff);
            --dc-ink: var(--text-main, #161823);
            --dc-mute: var(--text-muted, #8a8b91);
            --dc-field: rgba(128, 128, 134, 0.12);   /* search bar + chips */
            --dc-field-on: rgba(128, 128, 134, 0.26); /* selected chip */
            --dc-top: 40px;                           /* space for the status bar */

            margin-top: 0 !important;
            position: relative !important;
            top: 0 !important;
            padding: var(--dc-top) 0 96px 0 !important;
            box-sizing: border-box;
            background: var(--dc-bg);
            color: var(--dc-ink);
        }

        /* ---------- 1. Search bar ---------- */
        .discover-search-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 48px;
            margin: 0 16px 14px;
            padding: 0 18px 0 16px;
            background: var(--dc-field);
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, background .15s ease;
        }
        .discover-search-trigger:active { transform: scale(.985); }

        .dc-search-ic { flex: 0 0 auto; width: 26px; height: 26px; color: var(--dc-ink); }

        .dc-search-placeholder {
            flex: 1;
            min-width: 0;
            font-size: 1.02rem;
            font-weight: 400;
            color: var(--dc-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-search-btn {
            flex: 0 0 auto;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--dc-ink);
            letter-spacing: .1px;
        }

        /* ---------- 2. Category chips ---------- */
        .discover-tags-row {
            display: flex;
            gap: 9px;
            padding: 0 16px 14px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .discover-tags-row::-webkit-scrollbar { display: none; }

        .discover-tag-chip {
            flex: 0 0 auto;
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-radius: 18px;
            background: var(--dc-field);
            color: var(--dc-ink);
            font-size: .96rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .15s ease, transform .12s ease;
        }
        .discover-tag-chip:active { transform: scale(.96); }
        .discover-tag-chip.active { background: var(--dc-field-on); font-weight: 600; }

        /* ---------- 3. Masonry feed (2 columns) ---------- */
        .discover-feels-grid {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 0 8px;
            width: 100%;
            box-sizing: border-box;
            touch-action: pan-y;
        }
        .dc-col {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .discover-feels-card {
            position: relative;
            display: block;
            min-width: 0;
            cursor: pointer;
            color: var(--dc-ink);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: pan-y;
        }
        .discover-feels-card:active .dc-thumb { transform: scale(.985); }

        .dc-thumb {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #1b1b1f;
            transition: transform .15s ease;
        }
        .dc-thumb img,
        .dc-thumb video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .dc-thumb-ph {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            color: #fff;
            font-size: .8rem;
            font-weight: 600;
            background: linear-gradient(160deg, #3a3a44, #17171b);
        }
        .dc-badge {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .38);
            color: #fff;
        }
        .dc-badge svg { width: 18px; height: 18px; }

        .discover-feels-caption {
            margin: 10px 4px 0;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.32;
            color: var(--dc-ink);
            overflow-wrap: anywhere;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .dc-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 9px 4px 0;
            min-width: 0;
        }
        .dc-av {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--dc-field-on);
        }
        .dc-name {
            flex: 1;
            min-width: 0;
            font-size: .86rem;
            color: var(--dc-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-like {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .9rem;
            color: var(--dc-mute);
        }
        .dc-like svg { width: 20px; height: 20px; }

        /* Loading skeleton + empty state */
        .dc-skel-thumb,
        .dc-skel-line {
            background: linear-gradient(100deg, var(--dc-field) 30%, var(--dc-field-on) 50%, var(--dc-field) 70%);
            background-size: 220% 100%;
            animation: dc-shimmer 1.3s linear infinite;
        }
        .dc-skel-thumb { border-radius: 8px; }
        .dc-skel-line { height: 12px; border-radius: 6px; margin: 10px 4px 0; }
        @keyframes dc-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
        @media (prefers-reduced-motion: reduce) { .dc-skel-thumb, .dc-skel-line { animation: none; } }

        .discover-feels-empty {
            flex: 1;
            padding: 60px 20px;
            text-align: center;
            font-size: .92rem;
            color: var(--dc-mute);
        }

        /* =========================================================
           FULLSCREEN SEARCH WINDOW
           ========================================================= */
        #fullscreen-search-page {
            position: fixed;
            top: 35px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 35px);
            background: var(--bg-color, #fff);
            z-index: 99999;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        /* ---------- Search page (TikTok-style) ---------- */
        #fullscreen-search-page {
            --sp-field: #f1f1f2;
            --sp-ink: var(--text-main, #161823);
            --sp-mute: var(--text-muted, #8a8b91);
            --sp-accent: var(--primary, #FE2C55);
            font-family: inherit;
        }
        .search-topbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: var(--bg-color, #fff);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px 8px 6px;
            z-index: 10;
            box-sizing: border-box;
        }
        .search-back-btn {
            background: none;
            border: none;
            color: var(--sp-ink);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .search-back-btn svg { width: 28px; height: 28px; }
        .search-back-btn:active { background: rgba(128,128,134,.14); }

        .search-input-wrap {
            flex: 1;
            min-width: 0;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px 0 12px;
            background: var(--sp-field);
            border-radius: 10px;
            box-sizing: border-box;
        }
        .search-input-ic { flex: 0 0 auto; width: 24px; height: 24px; color: var(--sp-ink); }
        .search-main-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--sp-ink);
            font-family: inherit;
            font-size: 1.02rem;
            font-weight: 400;
            caret-color: var(--sp-accent);
        }
        .search-main-input::placeholder { color: var(--sp-mute); opacity: 1; }

        .search-action-btn {
            flex: 0 0 auto;
            background: none;
            border: none;
            padding: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .search-clear-dot {
            width: 24px; height: 24px; border-radius: 50%;
            background: #9a9a9f; color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .search-clear-dot svg { width: 12px; height: 12px; }
        /* mic is kept in the DOM for your JS but not shown (reference has none) */
        #search-mic-btn { display: none !important; }

        .search-go-btn {
            flex: 0 0 auto;
            background: none;
            border: none;
            padding: 8px 4px 8px 6px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--sp-accent);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .search-go-btn:active { opacity: .6; }

        /* ---- Suggestions ---- */
        .search-suggestions-list { display: flex; flex-direction: column; padding: 4px 0 0; }
        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 16px;
            min-height: 48px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
        }
        .suggestion-item:active { background: rgba(128,128,134,.08); }
        .suggestion-ic {
            flex: 0 0 auto;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--sp-field);
            color: #4b4b50;
            display: flex; align-items: center; justify-content: center;
        }
        .suggestion-ic svg { width: 17px; height: 17px; }
        .suggestion-text {
            flex: 1;
            min-width: 0;
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--sp-ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-text .hl { color: var(--sp-accent); }

        .search-report-hint {
            text-align: center;
            padding: 22px 24px 0;
            font-size: .95rem;
            color: var(--sp-mute);
        }

        /* ---- Recent searches ---- */
        .recent-wrap { padding: 4px 16px 24px; }
        .recent-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 6px;
        }
        .recent-title { font-size: 1.3rem; font-weight: 800; color: var(--sp-ink); }
        .recent-clear {
            background: none; border: none; padding: 6px 0 6px 12px;
            font-family: inherit; font-size: 1rem; font-weight: 500;
            color: var(--sp-mute); cursor: pointer;
        }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 48px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .recent-clock { flex: 0 0 auto; width: 22px; height: 22px; color: #a3a3a8; }
        .recent-text {
            flex: 1;
            min-width: 0;
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--sp-ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-x {
            flex: 0 0 auto;
            background: none; border: none; padding: 8px 2px 8px 10px;
            color: #8a8b91; cursor: pointer; display: flex;
        }
        .recent-x svg { width: 22px; height: 22px; }


        /* ---------- Results state: tabs + users list ---------- */
        .search-more-btn {
            display: none;
            flex: 0 0 auto;
            width: 44px; height: 44px;
            background: none; border: none; padding: 0;
            color: var(--sp-ink);
            align-items: center; justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .search-more-btn svg { width: 26px; height: 26px; }
        #fullscreen-search-page.is-results .search-go-btn { display: none; }
        #fullscreen-search-page.is-results .search-more-btn { display: flex; }
        #fullscreen-search-page.is-results .search-topbar { padding-right: 4px; }

        .search-tabs {
            display: none;
            position: sticky;
            top: 60px;
            z-index: 9;
            background: var(--bg-color, #fff);
            border-bottom: 1px solid var(--border-color, rgba(128,128,134,.18));
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .search-tabs::-webkit-scrollbar { display: none; }
        #fullscreen-search-page.is-results .search-tabs { display: flex; }
        .search-tab-btn {
            flex: 1 0 auto;
            background: none; border: none;
            padding: 12px 16px 10px;
            font-family: inherit;
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--sp-mute);
            position: relative;
            cursor: pointer;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .search-tab-btn.active { color: var(--sp-ink); font-weight: 700; }
        .search-tab-btn.active::after {
            content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px;
            height: 2.5px; background: var(--sp-ink); border-radius: 2px;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .user-row:active { background: rgba(128,128,134,.07); }
        .user-avatar {
            flex: 0 0 auto;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: #e9e9eb;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 1px rgba(0,0,0,.05);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .user-avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .user-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .user-handle {
            font-size: 1.06rem; font-weight: 700; color: var(--sp-ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-name, .user-subs {
            font-size: .95rem; font-weight: 500; color: var(--sp-mute);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-subs { font-weight: 600; }
        .user-sub-btn {
            flex: 0 0 auto;
            min-width: 92px; height: 36px;
            padding: 0 16px;
            border: none; border-radius: 9px;
            background: var(--sp-accent);
            color: #fff;
            font-family: inherit; font-size: 1rem; font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .12s ease, background .2s;
        }
        .user-sub-btn:active { transform: scale(.95); }
        .user-sub-btn.subscribed { background: var(--sp-field); color: var(--sp-ink); }
        #search-results-container[data-tab="top"] #search-users-results .user-row:nth-child(n+4) { display: none; }
        #search-results-container:not([data-tab="top"]) .discover-section-title { display: none; }
        #search-results-container[data-tab="top"] #search-users-section .discover-section-title { margin-left: 16px !important; }

        .dc-toast {
            position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
            background: rgba(22,24,35,.92); color: #fff;
            padding: 10px 18px; border-radius: 22px; font-size: .9rem;
            z-index: 100000; pointer-events: none;
        }

        /* ---------- Search results ---------- */
        .discover-section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 12px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main, #161823);
        }
        .search-results-wrapper {
            display: none;
            padding: 0 0 28px;
            flex-direction: column;
            gap: 14px;
        }
        #search-feels-section, #search-videos-section { padding: 0 16px; }
        .feels-result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .feels-card-9-16 {
            aspect-ratio: 9 / 16;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #111;
            cursor: pointer;
            transform: translate3d(0,0,0);
        }
        .feels-card-9-16:active { transform: scale(.97); }
        .feels-card-9-16 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .feels-card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
            padding: 12px 10px;
            color: #fff;
        }
        .feels-card-overlay h4 {
            margin: 0;
            font-size: .85rem;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .long-video-list { display: flex; flex-direction: column; gap: 16px; }
        .video-card-16-9 { background: var(--surface, #fff); border-radius: 12px; overflow: hidden; cursor: pointer; }
        .video-card-16-9:active { transform: scale(.98); }
        .video-thumb-16-9 { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #1a1a1a; }
        .video-info-box { padding: 10px 4px 4px; }
        .video-title-txt {
            font-size: .98rem;
            font-weight: 700;
            color: var(--text-main, #161823);
            margin: 0 0 4px 0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta-txt { font-size: .8rem; color: var(--text-muted, #8a8b91); }

        /* ---------- Search results: Home-style cards ---------- */
        .search-results-wrapper { gap: 0 !important; }
        #search-users-section { margin-bottom: 8px; }
        .sr-feed { padding: 0 16px; }                       /* same 16px page padding as Home */
        .sr-feed .fx-card { width: calc(100% + 32px); margin-left: -16px; margin-right: -16px; }
        .sr-feed .feels-home-grid-2col { margin-top: 0; }
        .sr-feels-grid { margin-bottom: 12px; }
    </style>
</head>
<body>

<!-- =========================================================
     DISCOVER TAB
     ========================================================= -->
<div class="tab-content" id="search-tab">

    <!-- Search bar (tap opens the fullscreen search page) -->
    <div class="discover-search-trigger" id="discover-search-trigger" role="search">
        <svg class="dc-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7"></circle>
            <path d="M16 16l5 5"></path>
        </svg>
        <span class="dc-search-placeholder">Discover new topics</span>
        <span class="dc-search-btn">Search</span>
    </div>

    <!-- Category chips -->
    <div class="discover-tags-row">
        <div class="discover-tag-chip active">All</div>
        <div class="discover-tag-chip">Entertainment</div>
        <div class="discover-tag-chip">Music</div>
        <div class="discover-tag-chip">Comedy</div>
        <div class="discover-tag-chip">Action</div>
        <div class="discover-tag-chip">Sci-Fi</div>
        <div class="discover-tag-chip">Trailer</div>
        <div class="discover-tag-chip">Aura</div>
    </div>

    <!-- Masonry feed: app.js fills this from Firebase -->
    <div class="discover-feels-grid" id="discover-feels-grid" data-state="loading" aria-label="Feels">
        <div class="dc-col">
            <div class="dc-skel-thumb" style="aspect-ratio:3/4"></div><div class="dc-skel-line"></div><div class="dc-skel-line" style="width:60%"></div>
            <div class="dc-skel-thumb" style="aspect-ratio:1/1.05"></div><div class="dc-skel-line"></div>
        </div>
        <div class="dc-col">
            <div class="dc-skel-thumb" style="aspect-ratio:1/1.1"></div><div class="dc-skel-line"></div><div class="dc-skel-line" style="width:60%"></div>
            <div class="dc-skel-thumb" style="aspect-ratio:3/4"></div><div class="dc-skel-line"></div>
        </div>
    </div>

    <!-- Regular discover cards (kept for your existing JS) -->
    <div class="movie-grid" id="search-results"></div>

</div>

<!-- =========================================================
     FULLSCREEN SEARCH PAGE
     ========================================================= -->
<div id="fullscreen-search-page">

    <div class="search-topbar">
        <button class="search-back-btn" id="search-back-btn" title="Back" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M10.5 5.5 4 12l6.5 6.5"/></svg>
        </button>

        <div class="search-input-wrap">
            <svg class="search-input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m15.8 15.8 5 5"/></svg>
            <input class="search-main-input" id="search-active-input" type="text" placeholder="Search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"/>

            <button class="search-action-btn" id="search-clear-btn" style="display: none;" title="Clear" aria-label="Clear">
                <span class="search-clear-dot"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></span>
            </button>

            <button class="search-action-btn" id="search-mic-btn" title="Voice Search" aria-label="Voice Search">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <button class="search-go-btn" id="search-go-btn">Search</button>
        <button class="search-more-btn" id="search-more-btn" aria-label="More">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
    </div>

    <div class="search-tabs" id="search-tabs">
        <button class="search-tab-btn active" data-tab="top">Top</button>
        <button class="search-tab-btn" data-tab="users">Users</button>
        <button class="search-tab-btn" data-tab="videos">Videos</button>
        <button class="search-tab-btn" data-tab="photos">Photos</button>
        <button class="search-tab-btn" data-tab="feels">Feels</button>
    </div>

    <div class="recent-wrap" id="search-recent-container" style="display:none;"></div>

    <div id="search-suggestions-wrap" style="display:none;">
        <div class="search-suggestions-list" id="search-suggestions-container"></div>
        <div class="search-report-hint">Press and hold on a suggestion to report it</div>
    </div>

    <div class="search-results-wrapper" id="search-results-container" data-tab="top">

        <div id="search-users-section" style="display: none;">
            <div class="discover-section-title" style="margin: 0 0 4px 0;">
                <i class="fas fa-user" style="color: var(--primary, #FE2C55);"></i> Users
            </div>
            <div id="search-users-results"></div>
        </div>

        <!-- Home-style cards: Videos (long video card), Photos (post card), Feels (2-col grid).
             "Top" shows all of them mixed randomly; app.js fills this. -->
        <div class="sr-feed" id="search-feed-results"></div>
        <div id="search-feed-sentinel" style="height:1px;"></div>

        <div id="search-no-result" style="display: none; text-align: center; padding: 70px 20px; color: var(--text-muted, #8a8b91);">
            <i class="fas fa-search" style="font-size: 2.5rem; opacity: 0.4; margin-bottom: 12px; display: block;"></i>
            <p style="font-weight: 700; margin: 0;">No results found</p>
        </div>

    </div>

</div>

</body>
</html>
