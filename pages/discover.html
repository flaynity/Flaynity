<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flaynity Discover</title>

    <!-- FontAwesome Icon Library (still used by the fullscreen search window) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
           DISCOVER (EXPLORE) PAGE
           Search bar -> category chips -> 2-column masonry feed
           Colors follow your app variables (light + dark), with
           fallbacks that match the reference design in light mode.
           ========================================================= */

        #search-tab {
            --dc-bg: var(--bg-color, #ffffff);
            --dc-ink: var(--text-main, #161823);
            --dc-mute: var(--text-muted, #8a8b91);
            --dc-field: rgba(128, 128, 134, 0.12);   /* search bar + chips */
            --dc-field-on: rgba(128, 128, 134, 0.26); /* selected chip */
            --dc-top: 40px;                           /* space for the status bar */

            margin-top: 0 !important;
            position: relative !important;
            top: 0 !important;
            padding: var(--dc-top) 0 96px 0 !important;
            box-sizing: border-box;
            background: var(--dc-bg);
            color: var(--dc-ink);
        }

        /* ---------- 1. Search bar ---------- */
        .discover-search-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 48px;
            margin: 0 16px 14px;
            padding: 0 18px 0 16px;
            background: var(--dc-field);
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, background .15s ease;
        }
        .discover-search-trigger:active { transform: scale(.985); }

        .dc-search-ic { flex: 0 0 auto; width: 26px; height: 26px; color: var(--dc-ink); }

        .dc-search-placeholder {
            flex: 1;
            min-width: 0;
            font-size: 1.02rem;
            font-weight: 400;
            color: var(--dc-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-search-btn {
            flex: 0 0 auto;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--dc-ink);
            letter-spacing: .1px;
        }

        /* ---------- 2. Category chips ---------- */
        .discover-tags-row {
            display: flex;
            gap: 9px;
            padding: 0 16px 14px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .discover-tags-row::-webkit-scrollbar { display: none; }

        .discover-tag-chip {
            flex: 0 0 auto;
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-radius: 18px;
            background: var(--dc-field);
            color: var(--dc-ink);
            font-size: .96rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background .15s ease, transform .12s ease;
        }
        .discover-tag-chip:active { transform: scale(.96); }
        .discover-tag-chip.active { background: var(--dc-field-on); font-weight: 600; }

        /* ---------- 3. Masonry feed (2 columns) ---------- */
        .discover-feels-grid {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 0 8px;
            width: 100%;
            box-sizing: border-box;
            touch-action: pan-y;
        }
        .dc-col {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .discover-feels-card {
            position: relative;
            display: block;
            min-width: 0;
            cursor: pointer;
            color: var(--dc-ink);
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: pan-y;
        }
        .discover-feels-card:active .dc-thumb { transform: scale(.985); }

        .dc-thumb {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: #1b1b1f;
            transition: transform .15s ease;
        }
        .dc-thumb img,
        .dc-thumb video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .dc-thumb-ph {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            color: #fff;
            font-size: .8rem;
            font-weight: 600;
            background: linear-gradient(160deg, #3a3a44, #17171b);
        }
        .dc-badge {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .38);
            color: #fff;
        }
        .dc-badge svg { width: 18px; height: 18px; }

        .discover-feels-caption {
            margin: 10px 4px 0;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.32;
            color: var(--dc-ink);
            overflow-wrap: anywhere;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .dc-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 9px 4px 0;
            min-width: 0;
        }
        .dc-av {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--dc-field-on);
        }
        .dc-name {
            flex: 1;
            min-width: 0;
            font-size: .86rem;
            color: var(--dc-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dc-like {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: .9rem;
            color: var(--dc-mute);
        }
        .dc-like svg { width: 20px; height: 20px; }

        /* Loading skeleton + empty state */
        .dc-skel-thumb,
        .dc-skel-line {
            background: linear-gradient(100deg, var(--dc-field) 30%, var(--dc-field-on) 50%, var(--dc-field) 70%);
            background-size: 220% 100%;
            animation: dc-shimmer 1.3s linear infinite;
        }
        .dc-skel-thumb { border-radius: 8px; }
        .dc-skel-line { height: 12px; border-radius: 6px; margin: 10px 4px 0; }
        @keyframes dc-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
        @media (prefers-reduced-motion: reduce) { .dc-skel-thumb, .dc-skel-line { animation: none; } }

        .discover-feels-empty {
            flex: 1;
            padding: 60px 20px;
            text-align: center;
            font-size: .92rem;
            color: var(--dc-mute);
        }

        /* =========================================================
           FULLSCREEN SEARCH WINDOW
           ========================================================= */
        #fullscreen-search-page {
            position: fixed;
            top: 35px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 35px);
            background: var(--bg-color, #fff);
            z-index: 99999;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .search-topbar {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--surface, #fff);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color, rgba(0,0,0,.08));
            z-index: 10;
            box-sizing: border-box;
        }
        .search-back-btn {
            background: none;
            border: none;
            color: var(--text-main, #161823);
            font-size: 1.2rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .search-back-btn:active { background: rgba(128,128,134,.16); }

        .search-input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
        .search-main-input {
            width: 100%;
            height: 44px;
            padding: 0 42px 0 16px;
            background: rgba(128, 128, 134, 0.12);
            border: 1.5px solid transparent;
            border-radius: 12px;
            color: var(--text-main, #161823);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            box-sizing: border-box;
            transition: border-color .2s, background .2s;
        }
        .search-main-input:focus { background: transparent; border-color: var(--primary, #FE2C55); }

        .search-action-btn {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: var(--text-muted, #8a8b91);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .search-action-btn:active { color: var(--primary, #FE2C55); }

        .search-suggestions-list { display: flex; flex-direction: column; }
        .suggestion-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color, rgba(0,0,0,.08));
        }
        .suggestion-item:active { background: rgba(128,128,134,.12); }
        .suggestion-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: .95rem;
            font-weight: 600;
            color: var(--text-main, #161823);
        }
        .suggestion-left i { color: var(--text-muted, #8a8b91); font-size: .85rem; }
        .suggestion-item .arrow-icon {
            color: var(--text-muted, #8a8b91);
            font-size: .85rem;
            transform: rotate(-45deg);
        }

        /* ---------- Search results ---------- */
        .discover-section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 12px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main, #161823);
        }
        .search-results-wrapper {
            display: none;
            padding: 16px;
            flex-direction: column;
            gap: 24px;
        }
        .feels-result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .feels-card-9-16 {
            aspect-ratio: 9 / 16;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #111;
            cursor: pointer;
            transform: translate3d(0,0,0);
        }
        .feels-card-9-16:active { transform: scale(.97); }
        .feels-card-9-16 img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .feels-card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
            padding: 12px 10px;
            color: #fff;
        }
        .feels-card-overlay h4 {
            margin: 0;
            font-size: .85rem;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .long-video-list { display: flex; flex-direction: column; gap: 16px; }
        .video-card-16-9 { background: var(--surface, #fff); border-radius: 12px; overflow: hidden; cursor: pointer; }
        .video-card-16-9:active { transform: scale(.98); }
        .video-thumb-16-9 { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #1a1a1a; }
        .video-info-box { padding: 10px 4px 4px; }
        .video-title-txt {
            font-size: .98rem;
            font-weight: 700;
            color: var(--text-main, #161823);
            margin: 0 0 4px 0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-meta-txt { font-size: .8rem; color: var(--text-muted, #8a8b91); }
    </style>
</head>
<body>

<!-- =========================================================
     DISCOVER TAB
     ========================================================= -->
<div class="tab-content" id="search-tab">

    <!-- Search bar (tap opens the fullscreen search page) -->
    <div class="discover-search-trigger" id="discover-search-trigger" role="search">
        <svg class="dc-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7"></circle>
            <path d="M16 16l5 5"></path>
        </svg>
        <span class="dc-search-placeholder">Discover new topics</span>
        <span class="dc-search-btn">Search</span>
    </div>

    <!-- Category chips -->
    <div class="discover-tags-row">
        <div class="discover-tag-chip active">All</div>
        <div class="discover-tag-chip">Entertainment</div>
        <div class="discover-tag-chip">Music</div>
        <div class="discover-tag-chip">Comedy</div>
        <div class="discover-tag-chip">Action</div>
        <div class="discover-tag-chip">Sci-Fi</div>
        <div class="discover-tag-chip">Trailer</div>
        <div class="discover-tag-chip">Aura</div>
    </div>

    <!-- Masonry feed: app.js fills this from Firebase -->
    <div class="discover-feels-grid" id="discover-feels-grid" data-state="loading" aria-label="Feels">
        <div class="dc-col">
            <div class="dc-skel-thumb" style="aspect-ratio:3/4"></div><div class="dc-skel-line"></div><div class="dc-skel-line" style="width:60%"></div>
            <div class="dc-skel-thumb" style="aspect-ratio:1/1.05"></div><div class="dc-skel-line"></div>
        </div>
        <div class="dc-col">
            <div class="dc-skel-thumb" style="aspect-ratio:1/1.1"></div><div class="dc-skel-line"></div><div class="dc-skel-line" style="width:60%"></div>
            <div class="dc-skel-thumb" style="aspect-ratio:3/4"></div><div class="dc-skel-line"></div>
        </div>
    </div>

    <!-- Regular discover cards (kept for your existing JS) -->
    <div class="movie-grid" id="search-results"></div>

</div>

<!-- =========================================================
     FULLSCREEN SEARCH PAGE
     ========================================================= -->
<div id="fullscreen-search-page">

    <div class="search-topbar">
        <button class="search-back-btn" id="search-back-btn" title="Back">
            <i class="fas fa-arrow-left"></i>
        </button>

        <div class="search-input-wrap">
            <input class="search-main-input" id="search-active-input" type="text" placeholder="Search Flaynity..." autocomplete="off"/>

            <button class="search-action-btn" id="search-clear-btn" style="display: none;" title="Clear">
                <i class="fas fa-times"></i>
            </button>

            <button class="search-action-btn" id="search-mic-btn" title="Voice Search">
                <i class="fas fa-microphone"></i>
            </button>
        </div>
    </div>

    <div class="search-suggestions-list" id="search-suggestions-container"></div>

    <div class="search-results-wrapper" id="search-results-container">

        <div id="search-feels-section" style="display: none;">
            <div class="discover-section-title" style="margin: 0 0 12px 0;">
                <i class="fas fa-bolt" style="color: var(--primary, #FE2C55);"></i> Feels
            </div>
            <div class="feels-result-grid" id="search-feels-results"></div>
        </div>

        <div id="search-videos-section" style="display: none;">
            <div class="discover-section-title" style="margin: 16px 0 12px 0;">
                <i class="fas fa-play-circle" style="color: var(--primary, #FE2C55);"></i> Videos
            </div>
            <div class="long-video-list" id="search-videos-results"></div>
        </div>

        <div id="search-no-result" style="display: none; text-align: center; padding: 70px 20px; color: var(--text-muted, #8a8b91);">
            <i class="fas fa-search" style="font-size: 2.5rem; opacity: 0.4; margin-bottom: 12px; display: block;"></i>
            <p style="font-weight: 700; margin: 0;">No results found</p>
        </div>

    </div>

</div>

</body>
</html>
