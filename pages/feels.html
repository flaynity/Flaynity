 <!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Flaynity</title>
<style>
/* =========================================================
   FEELS TAB — TikTok "For You" layout
   top tabs + search | right action rail | solid black info panel
   ========================================================= */
        :root { --feels-panel-h: 88px; }

        /* ---------- Top bar (Following / For You + search) ---------- */
        .feels-topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 30;
            height: 96px; padding: 38px 14px 0;
            display: flex; align-items: flex-start; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
            pointer-events: none;
        }
        .feels-mode-switch {
            display: flex; align-items: center; justify-content: center;
            gap: 22px; padding: 0; margin: 0;
            background: transparent; border: 0; box-shadow: none;
            white-space: nowrap; pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .feels-mode-btn {
            position: relative; appearance: none; border: 0; background: transparent;
            color: #fff; font-size: 17px; font-weight: 500; line-height: 1;
            padding: 8px 0 10px; margin: 0; border-radius: 0; cursor: pointer;
            opacity: .62; white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,.45);
            transition: opacity .2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .feels-mode-btn::after {
            content: ""; position: absolute; left: 50%; bottom: 0;
            width: 0; height: 3px; border-radius: 2px; background: #fff;
            transform: translateX(-50%);
            transition: width .22s cubic-bezier(.22,1,.36,1);
        }
        .feels-mode-btn.active { opacity: 1; font-weight: 700; }
        .feels-mode-btn.active::after { width: 22px; }
        .feels-mode-btn:active { opacity: .85; }

        .feels-search-btn {
            position: absolute; right: 8px; top: 34px;
            width: 40px; height: 40px; border: 0; background: transparent;
            color: #fff; font-size: 21px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; pointer-events: auto;
            text-shadow: 0 1px 4px rgba(0,0,0,.5);
            -webkit-tap-highlight-color: transparent;
        }
        .feels-search-btn:active { transform: scale(.88); }

        .feels-swiper { scroll-behavior: smooth; transition: opacity .18s ease, transform .18s ease; }
        .feels-swiper.feels-switching { opacity: 0; transform: scale(.992); }
        .short-slide { animation: feelsSlideIn .28s ease both; }
        @keyframes feelsSlideIn { from { opacity:.72; } to { opacity:1; } }
        @media (prefers-reduced-motion:reduce) {
            .feels-mode-btn, .short-slide, .feels-swiper { transition: none; animation: none; }
            .feels-swiper { scroll-behavior: auto; }
        }

        #feels-tab {
            position: fixed; top: 0; left: 0; width: 100vw;
            height: calc(100vh - 48px);
            background: #000000 !important; color: #FFFFFF !important;
            z-index: 500; overflow: hidden;
        }
        .feels-swiper {
            height: 100%; width: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-snap-stop: always;
            scrollbar-width: none;
        }
        .feels-swiper::-webkit-scrollbar { display: none; }

        .short-slide {
            height: 100%; width: 100%; scroll-snap-align: start;
            scroll-snap-stop: always; position: relative; background: #000000 !important;
            overflow: hidden;
        }

        /* Video area sits above the solid black panel */
        .short-video-el {
            position: absolute; top: 0; left: 0;
            width: 100%; height: calc(100% - var(--feels-panel-h));
            max-width: 100%;
            object-fit: contain !important; object-position: center !important;
            background: transparent; margin: 0; display: block;
        }

/* ---------- Right action rail ---------- */
        .short-right-actions {
            position: absolute; right: 8px;
            bottom: calc(var(--feels-panel-h) + 14px) !important;
            display: flex; flex-direction: column; gap: 14px; z-index: 10; align-items: center;
        }
        .short-action-container { display: flex; flex-direction: column; align-items: center; }

        /* Avatar with red "+" badge */
        .short-channel-action {
            position: relative; width: 52px; height: 62px;
            display: flex; align-items: flex-start; justify-content: center;
            margin-bottom: 2px; pointer-events: auto;
        }
        .short-channel-action-avatar {
            width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
            border: 1.5px solid #fff; background: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }
        .short-channel-action-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .short-channel-subscribe-btn {
            position: absolute; left: 50%; bottom: 0;
            transform: translateX(-50%);
            width: 22px; height: 22px; padding: 0;
            border: 0; border-radius: 50%;
            background: #FE2C55; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900; line-height: 1;
            transition: transform .22s cubic-bezier(0.175,0.885,0.32,1.275), background .22s ease;
            cursor: pointer; will-change: transform, opacity;
        }
        .short-channel-subscribe-btn:active { transform: translateX(-50%) scale(0.82); }
        .short-channel-subscribe-btn.subscribed { background: #FE2C55; }
        .short-channel-subscribe-btn i { font-size: 11px; }
        .short-channel-subscribe-btn.subscribed i { animation: subscribeTickPop 0.32s cubic-bezier(0.175,0.885,0.32,1.275); }
        @keyframes subscribeTickPop {
            0% { transform: scale(0.45); opacity: 0; }
            65% { transform: scale(1.18); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .short-action-btn-tiktok,
        .short-action-btn-tiktok-other {
            background: transparent !important; border: none !important;
            color: #ffffff !important;
            width: 48px; height: 44px; display: flex;
            align-items: center; justify-content: center;
            font-size: 2rem !important; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: none !important;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,.45));
            -webkit-tap-highlight-color: transparent;
        }
        .short-action-btn-tiktok:active,
        .short-action-btn-tiktok-other:active { transform: scale(0.82); }
        .short-action-btn-tiktok i,
        .short-action-btn-tiktok-other i { color: #FFFFFF !important; font-weight: 900 !important; }
        .short-action-btn-tiktok i.liked {
            color: #FE2C55 !important;
            animation: tiktokHeartPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
        }
        @keyframes tiktokHeartPop {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1.0); }
        }
        .short-action-label-tiktok {
            color: #ffffff !important; font-size: 0.78rem; font-weight: 600;
            margin-top: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

/* ---------- Solid black info panel (username, caption, disc) ---------- */
        .short-bottom-info {
            position: absolute; left: 0; right: 0; bottom: 0 !important;
            height: var(--feels-panel-h);
            padding: 10px 70px 10px 12px;
            background: #000; z-index: 12;
            color: #ffffff !important; text-shadow: none;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow: hidden;
        }
        .short-channel-handle { display: none !important; }
        .short-channel-name {
            max-width: 100%; font-size: 1.12rem; font-weight: 800;
            line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 3px !important; color: #fff !important;
        }
        .short-title-wrap { position: relative; cursor: pointer; }
        .short-title-text {
            font-size: 0.92rem !important; font-weight: 400 !important;
            line-height: 1.32 !important; color: #fff !important;
            text-shadow: none !important; margin: 0;
            display: -webkit-box; -webkit-box-orient: vertical;
            -webkit-line-clamp: 2 !important; overflow: hidden; text-overflow: ellipsis;
        }
        .feels-more {
            display: none; position: absolute; right: 0; bottom: 0;
            padding-left: 22px; font-size: .92rem; line-height: 1.32;
            color: rgba(255,255,255,.7);
            background: linear-gradient(to right, rgba(0,0,0,0), #000 40%);
        }
        .short-title-wrap.has-more .feels-more { display: block; }

        /* small circular avatar / disc, bottom right of panel */
        .short-disc-corner {
            position: absolute; right: 12px; bottom: 14px; z-index: 13;
            width: 46px; height: 46px; border-radius: 50%;
            background: #111; border: 8px solid #1b1b1b; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .short-disc-corner .music-disc-inner {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            animation: rotateDisc 5s linear infinite; animation-play-state: paused;
        }
        .short-disc-corner .music-disc-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .music-disc-inner { animation: rotateDisc 5s linear infinite; animation-play-state: paused; }
        @keyframes rotateDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .short-subscribe-btn {
            background: var(--primary) !important;
            border: none; color: #fff !important; padding: 6px 14px;
            border-radius: 20px; font-weight: 800; font-size: 0.78rem; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .short-subscribe-btn:active { transform: scale(0.95); }

/* ---------- Progress bar (bottom edge of video) ---------- */
        .short-progress-container {
            position: absolute; bottom: var(--feels-panel-h); left: 0;
            width: 100%; height: 3px;
            background: rgba(255, 255, 255, 0.25);
            z-index: 15; cursor: pointer;
        }
        .short-progress-bar { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }

/* ---------- Double tap heart ---------- */
        .double-tap-heart {
            position: absolute; color: #FE2C55; font-size: 11rem !important;
            z-index: 100; pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: heartPopAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 6px 25px rgba(0,0,0,0.45);
        }
        @keyframes heartPopAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(1) rotate(10deg); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.6) translateY(-60px); opacity: 0; }
        }

/* ---------- Expandable description ---------- */
        .short-expandable-panel {
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 16px; margin-top: 10px; display: none;
            border: 1px solid rgba(255,255,255,0.1); max-height: 200px; overflow-y: auto;
            animation: slideUpFast 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUpFast { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

/* ---------- Buffer spinner + play/pause overlay (centered on video area) ---------- */
        @keyframes spinnerSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .short-buffer-spinner {
            position: absolute; top: calc((100% - var(--feels-panel-h)) / 2); left: 50%;
            width: 48px; height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15); border-top-color: #fff;
            border-radius: 50%; animation: spinnerSpin 0.8s linear infinite;
            display: none; z-index: 18; pointer-events: none;
        }
        .short-play-pause-overlay {
            position: absolute; top: calc((100% - var(--feels-panel-h)) / 2); left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.5); color: #fff;
            width: 70px; height: 70px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; opacity: 0; pointer-events: none; z-index: 20;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .short-play-pause-overlay.animate-pop { animation: ppPopIcon 0.8s ease forwards; }
        @keyframes ppPopIcon {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            40% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }
.short-channel-subscribe-btn[aria-hidden="true"]{display:none!important;pointer-events:none!important;}
        .short-channel-action{pointer-events:auto;}
        </style></head><body>
<div class="tab-content" id="feels-tab" style="padding:0;">
<div class="feels-topbar">
<div class="feels-mode-switch" role="tablist" aria-label="Feels feed">
<button type="button" class="feels-mode-btn" data-mode="subscribe" role="tab" aria-selected="false" onclick="setFeelsFeedMode('subscribe')">Following</button>
<button type="button" class="feels-mode-btn active" data-mode="for-you" role="tab" aria-selected="true" onclick="setFeelsFeedMode('for-you')">For You</button>
</div>
<button type="button" class="feels-search-btn" aria-label="Search" onclick="switchTab('search')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg></button>
</div>
<div id="feels-swiper-container" style="height:100%; width:100%;"></div>
</div>
</body></html>
