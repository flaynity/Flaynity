<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Flaynity</title>
<style>
/* =========================================================
   FEELS TAB - Premium Reels Player (redesigned)
   Structure & class names are kept identical to the JS contract.
   ========================================================= */
#feels-tab {
    --fx-accent:#FF3D6E;
    --fx-accent-deep:#D80E45;
    --fx-ink:#FFFFFF;
    --fx-ink-soft:#E9E9EF;
    --fx-ink-mute:#9A9AA8;
    --fx-glass:rgba(18,18,24,.42);
    --fx-glass-strong:rgba(12,12,18,.72);
    --fx-line:rgba(255,255,255,.14);
    --fx-r-lg:22px;
    --fx-r-md:16px;
    --fx-r-pill:999px;
    --fx-shadow:0 12px 32px rgba(0,0,0,.45);
    --fx-blur:blur(22px) saturate(140%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
}

/* ---------- Feed mode switch: floating glass pill ---------- */
.feels-mode-switch {
    position:fixed; top:calc(54px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%);
    z-index:30; display:flex; align-items:center; justify-content:center;
    gap:4px; padding:4px; margin:0;
    background:var(--fx-glass-strong);
    -webkit-backdrop-filter:var(--fx-blur); backdrop-filter:var(--fx-blur);
    border:1px solid var(--fx-line);
    border-radius:var(--fx-r-pill);
    box-shadow:var(--fx-shadow);
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
}
.feels-mode-btn {
    position:relative; appearance:none; border:0; background:transparent;
    color:var(--fx-ink-soft); font-size:14px; font-weight:600; letter-spacing:.01em; line-height:1;
    padding:9px 18px; margin:0; border-radius:var(--fx-r-pill); cursor:pointer;
    opacity:.62; white-space:nowrap;
    transition:opacity .22s ease, color .22s ease, background .22s ease, transform .22s ease;
    -webkit-tap-highlight-color:transparent;
}
.feels-mode-btn::after { content:none; }
.feels-mode-btn.active {
    opacity:1; color:#fff;
    background:linear-gradient(135deg,var(--fx-accent),var(--fx-accent-deep));
    box-shadow:0 6px 16px rgba(216,14,69,.42);
}
.feels-mode-btn:active { transform:scale(.96); }
.feels-mode-btn:focus-visible { outline:2px solid var(--fx-accent); outline-offset:2px; }

/* ---------- Swiper / slides ---------- */
.feels-swiper { scroll-behavior:smooth; transition:opacity .18s ease, transform .18s ease; }
.feels-swiper.feels-switching { opacity:0; transform:scale(.992); }
.short-slide { animation:feelsSlideIn .28s ease both; }
@keyframes feelsSlideIn { from { opacity:.72; transform:scale(.985); } to { opacity:1; transform:scale(1); } }

#feels-tab {
    position:fixed; top:0; left:0;
    width:100vw; height:calc(100vh - 48px);
    background:#05050A !important; color:var(--fx-ink) !important;
    z-index:500; overflow:hidden;
}
.feels-swiper {
    height:100%; width:100%; overflow-y:scroll;
    scroll-snap-type:y mandatory; scroll-snap-stop:always;
    scrollbar-width:none;
}
.feels-swiper::-webkit-scrollbar { display:none; }

.short-slide {
    height:100%; width:100%; scroll-snap-align:start;
    scroll-snap-stop:always; position:relative;
    background:#05050A !important;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
}
/* bottom + top scrims so overlays stay readable on any frame */
.short-slide::before {
    content:""; position:absolute; left:0; right:0; bottom:0; height:42%;
    background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.32) 45%,transparent);
    pointer-events:none; z-index:5;
}
.short-slide::after {
    content:""; position:absolute; left:0; right:0; top:0; height:16%;
    background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);
    pointer-events:none; z-index:5;
}

.short-video-el {
    width:100%; height:100%; max-width:100%; max-height:100%;
    object-fit:contain !important; object-position:center !important;
    background:transparent; margin:auto; display:block;
    position:relative; z-index:1;
}

/* ---------- Right action rail ---------- */
.short-right-actions {
    position:absolute; right:10px; bottom:calc(78px + env(safe-area-inset-bottom,0px)) !important;
    display:flex; flex-direction:column; gap:14px; z-index:10; align-items:center;
}
.short-action-container { display:flex; flex-direction:column; align-items:center; }

/* channel avatar + subscribe */
.short-channel-action {
    position:relative; width:52px; height:60px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
}
.short-channel-action-avatar {
    width:50px; height:50px; border-radius:50%; overflow:hidden;
    border:2px solid rgba(255,255,255,.92); background:#16161E;
    box-shadow:0 6px 18px rgba(0,0,0,.5), 0 0 0 4px rgba(255,61,110,.16);
}
.short-channel-action-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.short-channel-subscribe-btn {
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:24px; height:24px; padding:0;
    border:2px solid #fff; border-radius:50%;
    background:linear-gradient(135deg,var(--fx-accent),var(--fx-accent-deep));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:900; line-height:1;
    box-shadow:0 4px 12px rgba(216,14,69,.5);
    transition:transform .22s cubic-bezier(.175,.885,.32,1.275), background .22s ease;
    cursor:pointer; will-change:transform,opacity;
}
.short-channel-subscribe-btn:active { transform:translateX(-50%) scale(.82); }
.short-channel-subscribe-btn:focus-visible { outline:2px solid #fff; outline-offset:2px; }
.short-channel-subscribe-btn.subscribed {
    background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.55);
}
.short-channel-subscribe-btn i { font-size:11px; }
.short-channel-subscribe-btn.subscribed i { animation:subscribeTickPop .32s cubic-bezier(.175,.885,.32,1.275); }
@keyframes subscribeTickPop {
    0% { transform:scale(.45); opacity:0; }
    65% { transform:scale(1.18); opacity:1; }
    100% { transform:scale(1); opacity:1; }
}

/* action buttons */
.short-action-btn-tiktok,
.short-action-btn-tiktok-other {
    appearance:none; background:var(--fx-glass) !important;
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--fx-line) !important;
    color:#fff !important;
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:none !important;
    transition:transform .2s cubic-bezier(.175,.885,.32,1.275), background .2s ease, border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
}
.short-action-btn-tiktok { font-size:1.55rem !important; }
.short-action-btn-tiktok-other { font-size:1.35rem !important; }
.short-action-btn-tiktok:active { transform:scale(.86); }
.short-action-btn-tiktok-other:active { transform:scale(.88); }
.short-action-btn-tiktok:focus-visible,
.short-action-btn-tiktok-other:focus-visible { outline:2px solid var(--fx-accent); outline-offset:2px; }
.short-action-btn-tiktok i,
.short-action-btn-tiktok-other i { color:#fff !important; font-weight:900 !important; }
.short-action-btn-tiktok i.liked {
    color:var(--fx-accent) !important;
    animation:tiktokHeartPop .35s cubic-bezier(.175,.885,.32,1.5) forwards;
}
@keyframes tiktokHeartPop {
    0% { transform:scale(.5); }
    50% { transform:scale(1.3); }
    100% { transform:scale(1); }
}

.short-action-label-tiktok {
    color:#F2F2F5 !important; font-size:.7rem; font-weight:700; letter-spacing:.02em;
    margin-top:5px; text-shadow:0 1px 4px rgba(0,0,0,.75);
}

/* quality select inside the rail */
#feels-tab .short-right-actions select {
    max-width:66px; background:var(--fx-glass-strong); color:#fff;
    border:1px solid var(--fx-line); border-radius:12px; padding:7px 6px;
    font-size:.7rem; font-weight:700; appearance:none; text-align:center;
}

/* ---------- Bottom info ---------- */
.short-bottom-info {
    position:absolute;
    bottom:calc(78px + env(safe-area-inset-bottom,0px)) !important;
    left:14px; right:78px; z-index:10;
    color:var(--fx-ink) !important;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
}
.short-channel-handle { display:none !important; }
.short-channel-name {
    max-width:100%; font-size:1.06rem; font-weight:700; letter-spacing:-.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.short-title-wrap {
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 12px; margin-top:8px;
    background:var(--fx-glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--fx-line); border-radius:var(--fx-r-pill);
}
.short-title-text {
    font-size:.8rem !important; font-weight:500 !important; color:var(--fx-ink-soft) !important;
    text-shadow:none !important; margin:0;
}
.short-subscribe-btn {
    background:linear-gradient(135deg,var(--fx-accent),var(--fx-accent-deep)) !important;
    border:none; color:#fff !important; padding:8px 16px;
    border-radius:var(--fx-r-pill); font-weight:700; font-size:.78rem; cursor:pointer;
    box-shadow:0 6px 16px rgba(216,14,69,.4); transition:transform .2s ease;
}
.short-subscribe-btn:active { transform:scale(.95); }

/* ---------- Progress bar (seek) ---------- */
.short-progress-container {
    position:absolute; bottom:0; left:0; width:100%; height:3px;
    background:rgba(255,255,255,.22); z-index:15; cursor:pointer;
}
.short-progress-bar {
    width:0%; height:100%;
    background:linear-gradient(90deg,var(--fx-accent),var(--fx-accent-deep));
    box-shadow:0 0 10px rgba(255,61,110,.7);
    transition:width .1s linear;
}

/* ---------- Double tap heart ---------- */
.double-tap-heart {
    position:absolute; color:var(--fx-accent);
    font-size:10rem !important; z-index:100; pointer-events:none;
    transform:translate(-50%,-50%) scale(0);
    animation:heartPopAnim .8s cubic-bezier(.175,.885,.32,1.275) forwards;
    text-shadow:0 8px 30px rgba(216,14,69,.55);
}
@keyframes heartPopAnim {
    0% { transform:translate(-50%,-50%) scale(0) rotate(-15deg); opacity:0; }
    15% { transform:translate(-50%,-50%) scale(1.2) rotate(0deg); opacity:.9; }
    30% { transform:translate(-50%,-50%) scale(1) rotate(10deg); opacity:1; }
    80% { transform:translate(-50%,-50%) scale(1) translateY(-30px); opacity:.8; }
    100% { transform:translate(-50%,-50%) scale(.6) translateY(-60px); opacity:0; }
}

/* ---------- Expandable description sheet ---------- */
.short-expandable-panel {
    background:var(--fx-glass-strong);
    -webkit-backdrop-filter:var(--fx-blur); backdrop-filter:var(--fx-blur);
    border-radius:var(--fx-r-lg); padding:18px; margin-top:10px; display:none;
    border:1px solid var(--fx-line); box-shadow:var(--fx-shadow);
    max-height:200px; overflow-y:auto;
    animation:slideUpFast .25s cubic-bezier(.16,1,.3,1);
}
.short-expandable-panel::-webkit-scrollbar { width:4px; }
.short-expandable-panel::-webkit-scrollbar-thumb { background:var(--fx-line); border-radius:4px; }
@keyframes slideUpFast { from { transform:translateY(15px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* ---------- Native player chrome off ---------- */
video::-webkit-media-controls { display:none !important; }
video::-webkit-media-controls-start-playback-button { display:none !important; -webkit-appearance:none; }

/* ---------- Buffer spinner ---------- */
@keyframes spinnerSpin {
    0% { transform:translate(-50%,-50%) rotate(0deg); }
    100% { transform:translate(-50%,-50%) rotate(360deg); }
}
.short-buffer-spinner {
    position:absolute; top:50%; left:50%;
    width:52px; height:52px;
    border:3px solid rgba(255,255,255,.16);
    border-top-color:var(--fx-accent);
    border-radius:50%;
    animation:spinnerSpin .8s linear infinite;
    display:none; z-index:18; pointer-events:none;
    box-shadow:0 0 20px rgba(255,61,110,.28);
}

/* ---------- Play / pause overlay ---------- */
.short-play-pause-overlay {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(.8);
    background:var(--fx-glass-strong);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--fx-line);
    color:#fff; width:72px; height:72px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.7rem;
    opacity:0; pointer-events:none; z-index:20;
    transition:all .3s cubic-bezier(.175,.885,.32,1.275);
}
.short-play-pause-overlay.animate-pop { animation:ppPopIcon .8s ease forwards; }
@keyframes ppPopIcon {
    0% { transform:translate(-50%,-50%) scale(.5); opacity:0; }
    20% { transform:translate(-50%,-50%) scale(1.2); opacity:.9; }
    40% { transform:translate(-50%,-50%) scale(1); opacity:.9; }
    80% { transform:translate(-50%,-50%) scale(1); opacity:.9; }
    100% { transform:translate(-50%,-50%) scale(.8); opacity:0; }
}

/* ---------- Rotating music disc ---------- */
.music-disc-container {
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(140deg,#1B1B25,#0B0B12);
    border:1px solid var(--fx-line); padding:3px;
    display:flex; align-items:center; justify-content:center; margin-top:6px;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.music-disc-inner {
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    border:1px solid rgba(255,255,255,.16);
    animation:rotateDisc 5s linear infinite; animation-play-state:paused;
}
.music-disc-inner img { width:100%; height:100%; object-fit:cover; }
@keyframes rotateDisc { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

.short-channel-subscribe-btn[aria-hidden="true"] { display:none !important; pointer-events:none !important; }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce) {
    .feels-mode-btn, .short-slide, .feels-swiper, .short-action-btn-tiktok,
    .short-action-btn-tiktok-other, .short-channel-subscribe-btn { transition:none; animation:none; }
    .feels-swiper { scroll-behavior:auto; }
    .music-disc-inner { animation:none; }
}
</style></head><body>
<div class="tab-content" id="feels-tab" style="padding:0;">
<div class="feels-mode-switch" role="tablist" aria-label="Feels feed">
<button type="button" class="feels-mode-btn active" data-mode="for-you" role="tab" aria-selected="true" onclick="setFeelsFeedMode('for-you')">For You</button>
<button type="button" class="feels-mode-btn" data-mode="subscribe" role="tab" aria-selected="false" onclick="setFeelsFeedMode('subscribe')">Subscribe</button>
</div>
<div id="feels-swiper-container" style="height:100%; width:100%;"></div>
</div>
</body></html>
