<!-- pages/shorts.html -->
<style>
/* SHORTS COMPONENT STYLES */
.page-shorts-root {
    width: 100%;
    height: 100%;
    background: #000;
    position: relative;
    color: #fff;
}

.shorts-feed-viewport {
    width: 100%;
    height: calc(100vh - var(--bottom-nav-height) - var(--safe-area-bottom));
    overflow-y: auto;
    overflow-x: hidden;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    background: #000;
}
.shorts-feed-viewport::-webkit-scrollbar { display: none; }

.short-view-container {
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
}

.short-video-element {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    background: #000;
}

.short-ui-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
    background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%);
}

.short-actions-sidebar {
    position: absolute;
    right: 12px;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    align-items: center;
    pointer-events: auto;
}

.s-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
.s-action-btn .material-symbols-outlined { font-size: 32px; font-variation-settings: 'FILL' 1; }
.s-action-btn .count { font-size: 13px; font-weight: 600; }

.music-disc-wrapper {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #222;
    border: 2px solid #555;
    margin-top: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.music-disc-wrapper .material-symbols-outlined { font-size: 24px; color: #fff; }
.disc-spin { animation: spin 4s linear infinite; }
.disc-paused { animation-play-state: paused; }
@keyframes spin { 100% { transform: rotate(360deg); } }

.short-bottom-details {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: calc(100% - 70px);
    pointer-events: auto;
    bottom: 24px;
    position: absolute;
}

.short-channel-row { display: flex; align-items: center; gap: 10px; }
.short-channel-row img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); object-fit: cover; }
.short-handle { font-weight: 600; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.short-sub-btn { background: #fff; color: #000; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 16px; }

.short-title-text {
    font-size: 14px;
    line-height: 1.4;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.short-center-play-indicator {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    width: 72px;
    height: 72px;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
}
.short-center-play-indicator .material-symbols-outlined { font-size: 48px; color: #fff; }
.indicator-flash { opacity: 1; }

.short-buffering-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    pointer-events: none;
}
</style>

<div class="page-shorts-root" id="shorts-root">
    
    <div class="shorts-feed-viewport" id="shorts-feed-container">
        <!-- Short View Template (Injected dynamically by JS) -->
        <div class="short-view-container" id="short-initial-skeleton">
            <div class="short-buffering-spinner"></div>
        </div>
    </div>

</div>
