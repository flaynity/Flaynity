<style>
    .home-page {
        width: 100%;
        height: calc(100vh - var(--nav-height) - var(--safe-area-bottom));
        overflow-y: auto;
        background-color: var(--bg-primary);
        padding-top: var(--safe-area-top);
        -webkit-overflow-scrolling: touch;
    }

    /* Sticky Top Section (Header + Tabs) */
    .home-sticky {
        position: sticky;
        top: 0;
        z-index: 50;
        background-color: var(--bg-primary);
    }

    /* Top Header */
    .home-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
    }

    .home-brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .home-logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        object-fit: cover;
        background-color: var(--bg-surface-light);
    }

    .home-brand-name {
        font-size: 20px;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.3px;
    }

    .home-header-actions {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .home-header-actions .material-symbols-outlined {
        font-size: 24px;
        color: var(--text-primary);
        cursor: pointer;
    }

    /* Category Chips - equal thirds, no horizontal scroll */
    .home-tabs {
        display: flex;
        padding: 4px 16px 12px;
        gap: 8px;
    }

    .home-tab {
        flex: 1;
        text-align: center;
        padding: 10px 0;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        background-color: var(--bg-surface-light);
        position: relative;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.22s cubic-bezier(0.2, 0, 0, 1), color 0.22s cubic-bezier(0.2, 0, 0, 1), transform 0.15s ease;
    }

    .home-tab:active {
        transform: scale(0.97);
    }

    .home-tab.active {
        background-color: var(--text-primary);
        color: var(--bg-primary);
    }

    /* Ripple */
    .home-ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        background-color: rgba(128, 128, 128, 0.35);
        pointer-events: none;
        animation: home-ripple-anim 0.55s ease-out;
    }

    @keyframes home-ripple-anim {
        to {
            transform: scale(2.6);
            opacity: 0;
        }
    }

    /* Feed */
    .home-feed {
        padding: 4px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Shared shimmer skeleton */
    .home-skeleton {
        position: relative;
        overflow: hidden;
        background-color: var(--bg-surface);
    }

    .home-skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        animation: home-shimmer 1.4s infinite;
    }

    @keyframes home-shimmer {
        100% { transform: translateX(100%); }
    }

    /* ===== Shorts grid block (2 columns, 2:3 ratio) ===== */
    .home-shorts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .home-short-card {
        border-radius: 14px;
        overflow: hidden;
        background-color: var(--bg-surface);
        cursor: pointer;
        display: flex;
        flex-direction: column;
    }

    .home-short-thumb-wrap {
        width: 100%;
        aspect-ratio: 2 / 3;
        position: relative;
        background-color: var(--bg-surface-light);
    }

    .home-short-thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .home-short-views-badge {
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
        background-color: rgba(0,0,0,0.55);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 12px;
    }

    .home-short-views-badge .material-symbols-outlined {
        font-size: 13px;
        color: #fff;
    }

    .home-short-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        padding: 8px 10px 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ===== Long video card (full width, 16:9) ===== */
    .home-video-card {
        display: flex;
        flex-direction: column;
        cursor: pointer;
    }

    .home-video-thumb-wrap {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
        background-color: var(--bg-surface);
    }

    .home-video-thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .home-duration-badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        background-color: rgba(0,0,0,0.7);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
    }

    .home-video-info-row {
        display: flex;
        gap: 10px;
        padding-top: 10px;
    }

    .home-channel-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--bg-surface-light);
        flex-shrink: 0;
    }

    .home-video-text {
        flex: 1;
        min-width: 0;
    }

    .home-video-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .home-video-meta {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ===== Post card (Facebook-style) ===== */
    .home-post-card {
        background-color: var(--bg-surface);
        border-radius: 16px;
        overflow: hidden;
    }

    .home-post-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
    }

    .home-post-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--bg-surface-light);
        flex-shrink: 0;
    }

    .home-post-header-text {
        flex: 1;
        min-width: 0;
    }

    .home-post-username {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
    }

    .home-post-time {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 1px;
    }

    .home-post-subscribe {
        background-color: var(--text-primary);
        color: var(--bg-primary);
        font-size: 12px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 16px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease;
        flex-shrink: 0;
    }

    .home-post-subscribe.subscribed {
        background-color: var(--bg-surface-light);
        color: var(--text-primary);
    }

    .home-post-title {
        font-size: 14px;
        color: var(--text-primary);
        padding: 0 14px 12px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.4;
    }

    .home-post-title-more {
        color: var(--text-secondary);
        font-weight: 700;
        cursor: pointer;
    }

    .home-post-media {
        width: 100%;
        aspect-ratio: 3 / 4;
        background-color: var(--bg-surface-light);
        overflow: hidden;
        display: grid;
        gap: 2px;
    }

    .home-post-media.single {
        grid-template-columns: 1fr;
    }

    .home-post-media.multi {
        grid-template-columns: 1fr 1fr;
    }

    .home-post-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        cursor: pointer;
    }

    .home-post-media-more-overlay {
        position: relative;
    }

    .home-post-media-more-overlay::after {
        content: attr(data-count);
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.5);
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .home-post-reactions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px 6px;
        font-size: 13px;
        color: var(--text-secondary);
    }

    .home-reaction-emojis {
        display: flex;
        align-items: center;
    }

    .home-reaction-emojis span {
        font-size: 14px;
        margin-left: -4px;
    }

    .home-reaction-emojis span:first-child {
        margin-left: 0;
    }

    .home-post-actions {
        display: flex;
        border-top: 1px solid var(--bg-surface-light);
        margin-top: 6px;
    }

    .home-post-action-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 11px 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        transition: transform 0.15s ease;
    }

    .home-post-action-btn:active {
        transform: scale(0.94);
    }

    .home-post-action-btn .material-symbols-outlined {
        font-size: 20px;
    }

    .home-post-action-btn.liked {
        color: var(--accent-color);
    }

    .home-post-action-btn.liked .material-symbols-outlined {
        font-variation-settings: 'FILL' 1;
    }

    /* Empty / end states */
    .home-end-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        text-align: center;
        color: var(--text-secondary);
        gap: 6px;
    }

    .home-end-state .material-symbols-outlined {
        font-size: 34px;
        opacity: 0.5;
    }

    .home-end-state-text {
        font-size: 14px;
        font-weight: 500;
    }

    .home-loader {
        display: flex;
        justify-content: center;
        padding: 16px 0;
    }

    .home-loader .material-symbols-outlined {
        font-size: 22px;
        color: var(--text-secondary);
        animation: home-spin 0.9s linear infinite;
    }

    @keyframes home-spin {
        100% { transform: rotate(360deg); }
    }
</style>

<div class="home-page" id="home-page-container">
    <div class="home-sticky">
        <div class="home-header">
            <div class="home-brand">
                <img src="" alt="Flaynity" class="home-logo" id="home-logo-img">
                <span class="home-brand-name">Flaynity</span>
            </div>
            <div class="home-header-actions">
                <span class="material-symbols-outlined" id="home-search-btn">search</span>
                <span class="material-symbols-outlined" id="home-settings-btn">settings</span>
            </div>
        </div>

        <div class="home-tabs" id="home-tabs">
            <div class="home-tab active" data-tab="all">All</div>
            <div class="home-tab" data-tab="posts">Posts</div>
            <div class="home-tab" data-tab="shorts">Shorts</div>
        </div>
    </div>

    <div class="home-feed" id="home-feed-container"></div>
    <div class="home-loader" id="home-loader" style="display:none;">
        <span class="material-symbols-outlined">progress_activity</span>
    </div>
    <div id="home-sentinel" style="height:1px;"></div>
</div>

<script>
(function() {
    const feedContainer = document.getElementById('home-feed-container');
    const loader = document.getElementById('home-loader');
    const sentinel = document.getElementById('home-sentinel');
    const tabs = document.querySelectorAll('.home-tab');
    const db = window.firebase ? window.firebase.database() : null;

    const BATCH = { shorts: 6, videos: 10, posts: 1 };
    const initialLoadAt = Date.now();

    let activeTab = 'all';
    let loading = false;
    let cyclePos = 0; // 0 = shorts, 1 = videos, 2 = posts (used only for 'all' tab)
    let exhausted = { shorts: false, videos: false, posts: false };
    let cursors = { shorts: null, videos: null, posts: null };

    /* ---------------- Ripple / Tab Handling ---------------- */
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            spawnRipple(tab, e);
            if (tab.classList.contains('active')) return;
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            switchTab(tab.dataset.tab);
        });
    });

    function spawnRipple(el, e) {
        const rect = el.getBoundingClientRect();
        const ripple = document.createElement('span');
        const size = Math.max(rect.width, rect.height);
        const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
        const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
        ripple.className = 'home-ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        el.appendChild(ripple);
        setTimeout(() => ripple.remove(), 550);
    }

    function switchTab(tabName) {
        activeTab = tabName;
        feedContainer.innerHTML = '';
        cyclePos = 0;
        exhausted = { shorts: false, videos: false, posts: false };
        cursors = { shorts: null, videos: null, posts: null };
        renderSkeletonBatch();
        loadNext();
    }

    /* ---------------- Skeleton placeholders ---------------- */
    function renderSkeletonBatch() {
        if (activeTab === 'posts') {
            feedContainer.insertAdjacentHTML('beforeend', skeletonPostHTML());
            return;
        }
        if (activeTab === 'shorts') {
            feedContainer.insertAdjacentHTML('beforeend', skeletonShortsGridHTML(6));
            return;
        }
        feedContainer.insertAdjacentHTML('beforeend', skeletonShortsGridHTML(6));
        feedContainer.insertAdjacentHTML('beforeend', skeletonVideoHTML() + skeletonVideoHTML());
    }

    function skeletonVideoHTML() {
        return `
            <div class="home-video-card">
                <div class="home-video-thumb-wrap home-skeleton" style="border-radius:14px;"></div>
                <div class="home-video-info-row">
                    <div class="home-channel-avatar home-skeleton"></div>
                    <div class="home-video-text">
                        <div class="home-skeleton" style="height:14px; width:85%; border-radius:4px;"></div>
                        <div class="home-skeleton" style="height:11px; width:50%; border-radius:4px; margin-top:8px;"></div>
                    </div>
                </div>
            </div>
        `;
    }

    function skeletonShortsGridHTML(count) {
        let cards = '';
        for (let i = 0; i < count; i++) {
            cards += `
                <div class="home-short-card">
                    <div class="home-short-thumb-wrap home-skeleton"></div>
                    <div class="home-skeleton" style="height:12px; width:70%; border-radius:4px; margin:8px 10px 10px;"></div>
                </div>
            `;
        }
        return `<div class="home-shorts-grid">${cards}</div>`;
    }

    function skeletonPostHTML() {
        return `
            <div class="home-post-card">
                <div class="home-post-header">
                    <div class="home-post-avatar home-skeleton"></div>
                    <div class="home-post-header-text">
                        <div class="home-skeleton" style="height:12px; width:40%; border-radius:4px;"></div>
                        <div class="home-skeleton" style="height:10px; width:25%; border-radius:4px; margin-top:6px;"></div>
                    </div>
                </div>
                <div class="home-post-media single home-skeleton"></div>
            </div>
        `;
    }

    function clearLeadingSkeletons() {
        feedContainer.querySelectorAll('.home-skeleton').forEach(el => {
            const wrapper = el.closest('.home-video-card, .home-short-card, .home-post-card, .home-shorts-grid');
            if (wrapper) wrapper.remove();
        });
    }

    /* ---------------- Fetching ---------------- */
    function loadNext() {
        if (loading) return;
        loading = true;
        loader.style.display = 'flex';

        if (!db) {
            // No backend connected - leave skeleton state, stop further loads.
            loading = false;
            loader.style.display = 'none';
            return;
        }

        if (activeTab === 'posts') {
            fetchType('posts', BATCH.posts).then(items => {
                clearLeadingSkeletons();
                finishBatch(items.length > 0, () => renderPostsOnly(items));
            });
            return;
        }

        if (activeTab === 'shorts') {
            fetchType('shorts', 6).then(items => {
                clearLeadingSkeletons();
                finishBatch(items.length > 0, () => renderShortsOnly(items));
            });
            return;
        }

        // 'all' tab - cycle shorts(6) -> videos(10) -> posts(1)
        const order = ['shorts', 'videos', 'posts'];
        const type = order[cyclePos % order.length];
        const count = BATCH[type];

        fetchType(type, count).then(items => {
            clearLeadingSkeletons();
            cyclePos++;
            const gotSomething = items.length > 0;
            finishBatch(gotSomething, () => {
                if (type === 'shorts') appendShortsGrid(items);
                if (type === 'videos') appendVideos(items);
                if (type === 'posts') appendPosts(items);
            });
        });
    }

    function finishBatch(gotSomething, renderFn) {
        loading = false;
        loader.style.display = 'none';
        if (gotSomething) {
            renderFn();
        }
        maybeShowEndState();
    }

    function fetchType(type, count) {
        if (!db || exhausted[type]) return Promise.resolve([]);
        let query = db.ref(type).orderByChild('createdAt').limitToLast(count + (cursors[type] ? 1 : 0));
        if (cursors[type]) {
            query = db.ref(type).orderByChild('createdAt').endAt(cursors[type]).limitToLast(count + 1);
        }
        return query.once('value').then(snapshot => {
            if (!snapshot.exists()) {
                exhausted[type] = true;
                return [];
            }
            let items = [];
            snapshot.forEach(child => {
                items.push({ id: child.key, ...child.val() });
            });
            // newest first
            items.reverse();
            if (cursors[type]) {
                // drop the overlap item we already rendered
                items = items.filter(it => it.createdAt !== cursors[type]);
            }
            if (items.length < count) exhausted[type] = true;
            items = items.slice(0, count);
            if (items.length > 0) {
                cursors[type] = items[items.length - 1].createdAt;
            }
            return items;
        }).catch(() => {
            exhausted[type] = true;
            return [];
        });
    }

    function maybeShowEndState() {
        const allDone = exhausted.shorts && exhausted.videos && exhausted.posts;
        const relevantDone =
            (activeTab === 'posts' && exhausted.posts) ||
            (activeTab === 'shorts' && exhausted.shorts) ||
            (activeTab === 'all' && allDone);
        if (relevantDone && feedContainer.querySelector('.home-end-state') === null) {
            feedContainer.insertAdjacentHTML('beforeend', `
                <div class="home-end-state">
                    <span class="material-symbols-outlined">check_circle</span>
                    <div class="home-end-state-text">You're all caught up</div>
                </div>
            `);
        }
    }

    /* ---------------- Renderers ---------------- */
    function appendShortsGrid(items) {
        if (items.length === 0) return;
        feedContainer.insertAdjacentHTML('beforeend', `<div class="home-shorts-grid">${items.map(shortCardHTML).join('')}</div>`);
    }

    function renderShortsOnly(items) {
        let grid = feedContainer.querySelector('.home-shorts-grid[data-only="1"]');
        if (!grid) {
            feedContainer.insertAdjacentHTML('beforeend', `<div class="home-shorts-grid" data-only="1"></div>`);
            grid = feedContainer.querySelector('.home-shorts-grid[data-only="1"]');
        }
        grid.insertAdjacentHTML('beforeend', items.map(shortCardHTML).join(''));
    }

    function shortCardHTML(s) {
        return `
            <div class="home-short-card" onclick="window.openShortsPlayer && window.openShortsPlayer('${s.id}')">
                <div class="home-short-thumb-wrap">
                    <img src="${s.thumbnailUrl || ''}" alt="" loading="lazy">
                    <div class="home-short-views-badge">
                        <span class="material-symbols-outlined">play_arrow</span>${formatCount(s.views || 0)}
                    </div>
                </div>
                <div class="home-short-title">${escapeHTML(s.title || '')}</div>
            </div>
        `;
    }

    function appendVideos(items) {
        items.forEach(v => {
            feedContainer.insertAdjacentHTML('beforeend', videoCardHTML(v));
        });
    }

    function videoCardHTML(v) {
        return `
            <div class="home-video-card" onclick="window.openWatchPage && window.openWatchPage('${v.id}')">
                <div class="home-video-thumb-wrap">
                    <img src="${v.thumbnailUrl || ''}" alt="" loading="lazy">
                    <div class="home-duration-badge">${formatDuration(v.duration || 0)}</div>
                </div>
                <div class="home-video-info-row">
                    <img class="home-channel-avatar" src="${v.channelAvatarUrl || ''}" alt="">
                    <div class="home-video-text">
                        <div class="home-video-title">${escapeHTML(v.title || '')}</div>
                        <div class="home-video-meta">${escapeHTML(v.channelName || v.ownerId || '')} • ${formatCount(v.views || 0)} views • ${timeAgo(v.createdAt)}</div>
                    </div>
                </div>
            </div>
        `;
    }

    function appendPosts(items) {
        items.forEach(p => {
            feedContainer.insertAdjacentHTML('beforeend', postCardHTML(p));
        });
    }

    function renderPostsOnly(items) {
        items.forEach(p => {
            feedContainer.insertAdjacentHTML('beforeend', postCardHTML(p));
        });
    }

    function postCardHTML(p) {
        const images = Array.isArray(p.images) ? p.images : [];
        let mediaHTML = '';
        if (images.length === 1) {
            mediaHTML = `<div class="home-post-media single"><img src="${images[0]}" alt="" onclick="window.openPostImagePreview && window.openPostImagePreview('${p.id}', 0)"></div>`;
        } else if (images.length > 1) {
            const shown = images.slice(0, 4);
            const extra = images.length - shown.length;
            mediaHTML = `<div class="home-post-media multi">${shown.map((img, i) => {
                const isLastWithMore = extra > 0 && i === shown.length - 1;
                return `<div class="${isLastWithMore ? 'home-post-media-more-overlay' : ''}" ${isLastWithMore ? `data-count="+${extra}"` : ''}>
                    <img src="${img}" alt="" onclick="window.openPostImagePreview && window.openPostImagePreview('${p.id}', ${i})">
                </div>`;
            }).join('')}</div>`;
        }

        const reactionCount = p.reactions ? Object.keys(p.reactions).length : (p.reactionsCount || 0);

        return `
            <div class="home-post-card">
                <div class="home-post-header">
                    <img class="home-post-avatar" src="${p.channelAvatarUrl || ''}" alt="">
                    <div class="home-post-header-text">
                        <div class="home-post-username">${escapeHTML(p.channelName || p.ownerId || '')}</div>
                        <div class="home-post-time">${timeAgo(p.createdAt)}</div>
                    </div>
                    <div class="home-post-subscribe" onclick="window.toggleSubscribe && window.toggleSubscribe(this, '${p.channelId || ''}')">Subscribe</div>
                </div>
                ${p.caption ? `<div class="home-post-title">${escapeHTML(p.caption)} <span class="home-post-title-more" onclick="this.parentElement.style.webkitLineClamp='unset'; this.style.display='none';">...more</span></div>` : ''}
                ${mediaHTML}
                <div class="home-post-reactions">
                    <div class="home-reaction-emojis"><span>❤️</span><span>👍</span><span>🥰</span>&nbsp;${formatCount(reactionCount)} Reactions</div>
                    <div>${formatCount(p.commentsCount || 0)} Comments</div>
                </div>
                <div class="home-post-actions">
                    <div class="home-post-action-btn" onclick="window.togglePostLove && window.togglePostLove(this, '${p.id}')">
                        <span class="material-symbols-outlined">favorite</span> Love
                    </div>
                    <div class="home-post-action-btn" onclick="window.openPostComments && window.openPostComments('${p.id}')">
                        <span class="material-symbols-outlined">chat_bubble</span> Comment
                    </div>
                </div>
            </div>
        `;
    }

    /* ---------------- Realtime new-content prepend ---------------- */
    function attachNewContentListeners() {
        if (!db) return;
        ['shorts', 'videos', 'posts'].forEach(type => {
            db.ref(type).orderByChild('createdAt').startAt(initialLoadAt + 1).on('child_added', (snapshot) => {
                const data = { id: snapshot.key, ...snapshot.val() };
                prependNewItem(type, data);
            });
        });
    }

    function prependNewItem(type, data) {
        if (activeTab === 'all') {
            if (type === 'shorts') feedContainer.insertAdjacentHTML('afterbegin', `<div class="home-shorts-grid">${shortCardHTML(data)}</div>`);
            if (type === 'videos') feedContainer.insertAdjacentHTML('afterbegin', videoCardHTML(data));
            if (type === 'posts') feedContainer.insertAdjacentHTML('afterbegin', postCardHTML(data));
        } else if (activeTab === 'shorts' && type === 'shorts') {
            let grid = feedContainer.querySelector('.home-shorts-grid[data-only="1"]');
            if (grid) grid.insertAdjacentHTML('afterbegin', shortCardHTML(data));
        } else if (activeTab === 'posts' && type === 'posts') {
            feedContainer.insertAdjacentHTML('afterbegin', postCardHTML(data));
        }
    }

    /* ---------------- Infinite Scroll ---------------- */
    const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) loadNext();
        });
    }, { rootMargin: '400px 0px' });
    io.observe(sentinel);

    /* ---------------- Header actions ---------------- */
    document.getElementById('home-search-btn').addEventListener('click', () => {
        if (window.navigateToTab) window.navigateToTab('discover');
    });
    document.getElementById('home-settings-btn').addEventListener('click', () => {
        if (window.openSettings) window.openSettings();
    });

    /* ---------------- Helpers ---------------- */
    function formatCount(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num;
    }

    function formatDuration(seconds) {
        seconds = Math.floor(seconds || 0);
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        return `${m}:${String(s).padStart(2, '0')}`;
    }

    function timeAgo(timestamp) {
        if (!timestamp) return '';
        const diff = Date.now() - timestamp;
        const sec = Math.floor(diff / 1000);
        if (sec < 60) return 'just now';
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min}m ago`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr}h ago`;
        const day = Math.floor(hr / 24);
        if (day < 30) return `${day}d ago`;
        const month = Math.floor(day / 30);
        if (month < 12) return `${month}mo ago`;
        return `${Math.floor(month / 12)}y ago`;
    }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    /* ---------------- Init ---------------- */
    renderSkeletonBatch();
    loadNext();
    attachNewContentListeners();
})();
</script>
