<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Car Game - থ্রিডি কার গেম</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        /* UI Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }
        .hud-item {
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            display: inline-block;
        }
        /* Game Over Screen */
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #game-over-screen h1 {
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        #game-over-screen p {
            font-size: 22px;
            margin-bottom: 25px;
        }
        #restart-btn {
            padding: 12px 36px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #2ed573;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: 0.2s;
        }
        #restart-btn:hover {
            transform: scale(1.05);
            background: #26af5f;
        }
        /* Touch Controls for Mobile */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        @media (min-width: 768px) {
            #mobile-controls {
                display: none; /* Hide on Desktop */
            }
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="hud-item">🏆 স্কোর: <span id="score">0</span></div><br>
        <div class="hud-item">⚡ গতি: <span id="speed">100</span> km/h</div>
    </div>

    <div id="game-over-screen">
        <h1>গেম ওভার!</h1>
        <p>আপনার স্কোর: <span id="final-score">0</span></p>
        <button id="restart-btn">আবার খেলুন</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <div id="game-container"></div>

    <script>
        // --- গেম কনফিগারেশন ও ভ্যারিয়েবল ---
        let scene, camera, renderer;
        let playerCar;
        let roadLines = [];
        let enemies = [];
        let roadsideTrees = [];
        let score = 0;
        let baseSpeed = 1.2;
        let currentSpeed = baseSpeed;
        let isGameOver = false;
        let keys = { left: false, right: false, up: false, down: false };

        const ROAD_WIDTH = 14;
        const LANES = [-4.5, 0, 4.5];

        // --- ৩ডি সিন ইনিশিয়ালাইজেশন ---
        function init() {
            // সিন এবং ফগ (কুয়াশার আবহ)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e272e);
            scene.fog = new THREE.Fog(0x1e272e, 30, 160);

            // ক্যামেরা
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 1.5, -5);

            // রেন্ডারার
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // লাইটিং
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // পরিবেশ তৈরি
            createRoad();
            createPlayerCar();

            // ইভেন্ট লিসেনার
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e.code, true));
            window.addEventListener('keyup', (e) => handleKey(e.code, false));

            // মোবাইল টাচ ইভেন্ট
            setupTouchControls();

            document.getElementById('restart-btn').addEventListener('click', restartGame);

            // অ্যানিমেশন লুপ
            animate();
        }

        // --- রাস্তা এবং ডিভাইডার তৈরি ---
        function createRoad() {
            // মূল রাস্তা
            const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, 400);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x2f3542 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            road.receiveShadow = true;
            scene.add(road);

            // রাস্তার পাশের ঘাস
            const groundGeo = new THREE.PlaneGeometry(300, 400);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x10ac84 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            ground.position.z = -100;
            scene.add(ground);

            // রাস্তার সাদা ড্যাশ লাইন
            for (let i = 0; i < 20; i++) {
                createRoadStripe(-ROAD_WIDTH / 6, i * -20);
                createRoadStripe(ROAD_WIDTH / 6, i * -20);
            }
        }

        function createRoadStripe(x, z) {
            const stripeGeo = new THREE.PlaneGeometry(0.3, 8);
            const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(x, 0.02, z);
            scene.add(stripe);
            roadLines.push(stripe);
        }

        // --- গাড়ি তৈরির ফাংশন (Primitives দিয়ে ৩ডি গাড়ি) ---
        function buildCarMesh(colorHex) {
            const carGroup = new THREE.Group();

            // বডি (নিচের অংশ)
            const bodyGeo = new THREE.BoxGeometry(2, 0.6, 4);
            const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            // কেবিন (কাচ ও ছাদ)
            const cabinGeo = new THREE.BoxGeometry(1.6, 0.55, 2.2);
            const cabinMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.05, -0.2);
            carGroup.add(cabin);

            // চাকা (৪টি)
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            const wheelPositions = [
                [-1.05, 0.35, 1.2],
                [1.05, 0.35, 1.2],
                [-1.05, 0.35, -1.2],
                [1.05, 0.35, -1.2]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            // হেডলাইট
            const lightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfffa65 });
            
            const hl1 = new THREE.Mesh(lightGeo, lightMat);
            hl1.position.set(-0.6, 0.5, -2.01);
            const hl2 = new THREE.Mesh(lightGeo, lightMat);
            hl2.position.set(0.6, 0.5, -2.01);
            carGroup.add(hl1, hl2);

            return carGroup;
        }

        function createPlayerCar() {
            playerCar = buildCarMesh(0xff4757); // লাল গাড়ি
            playerCar.position.set(0, 0, 0);
            scene.add(playerCar);
        }

        // --- এনিমি ট্র্যাফিক কার স্পন ---
        function spawnEnemyCar() {
            const colors = [0x1e90ff, 0xffa502, 0x2ed573, 0x9b59b6];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const enemy = buildCarMesh(randomColor);

            const randomLane = LANES[Math.floor(Math.random() * LANES.length)];
            enemy.position.set(randomLane, 0, -120);
            enemy.rotation.y = Math.PI; // সামনের দিকে তাকানো

            scene.add(enemy);
            enemies.push(enemy);
        }

        // --- কিবোর্ড কন্ট্রোল হ্যান্ডলার ---
        function handleKey(code, state) {
            if (code === 'ArrowLeft' || code === 'KeyA') keys.left = state;
            if (code === 'ArrowRight' || code === 'KeyD') keys.right = state;
            if (code === 'ArrowUp' || code === 'KeyW') keys.up = state;
            if (code === 'ArrowDown' || code === 'KeyS') keys.down = state;
        }

        function setupTouchControls() {
            const leftBtn = document.getElementById('btn-left');
            const rightBtn = document.getElementById('btn-right');

            leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
            leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
            rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
            rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
        }

        // --- প্রধান অ্যানিমেশন লুপ ---
        let lastSpawnTime = 0;

        function animate(timestamp) {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // প্লেয়ার কন্ট্রোল
            if (keys.left && playerCar.position.x > -5) {
                playerCar.position.x -= 0.18;
                playerCar.rotation.y = 0.15; // বাঁক নেওয়ার ইফেক্ট
            } else if (keys.right && playerCar.position.x < 5) {
                playerCar.position.x += 0.18;
                playerCar.rotation.y = -0.15;
            } else {
                playerCar.rotation.y = 0;
            }

            // গতি নিয়ন্ত্রণ
            if (keys.up) currentSpeed = baseSpeed * 1.5;
            else if (keys.down) currentSpeed = baseSpeed * 0.7;
            else currentSpeed = baseSpeed;

            // রাস্তার ড্যাশ লাইন মুভমেন্ট
            roadLines.forEach(stripe => {
                stripe.position.z += currentSpeed;
                if (stripe.position.z > 15) {
                    stripe.position.z = -180;
                }
            });

            // নতুন গাড়ি তৈরি
            if (timestamp - lastSpawnTime > Math.max(1200 - score * 5, 450)) {
                spawnEnemyCar();
                lastSpawnTime = timestamp;
            }

            // ট্র্যাফিক গাড়ির আপডেট এবং কলিশন চেক
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.position.z += currentSpeed * 0.6; // আপেক্ষিক গতি

                // কলিশন বা ধাক্কা লাগার চেক (Bounding Box)
                const dx = Math.abs(playerCar.position.x - enemy.position.x);
                const dz = Math.abs(playerCar.position.z - enemy.position.z);

                if (dx < 1.7 && dz < 3.5) {
                    triggerGameOver();
                    return;
                }

                // গাড়ি পার হয়ে গেলে ডিলিট ও স্কোর যোগ
                if (enemy.position.z > 15) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    baseSpeed = 1.2 + Math.min(score / 500, 1.5); // ধীরে ধীরে গতি বৃদ্ধি
                }
            }

            // ক্যামেরা স্মুথ ফলো
            camera.position.x = playerCar.position.x * 0.3;

            // HUD স্পিড আপডেট
            document.getElementById('speed').innerText = Math.round(currentSpeed * 75);

            renderer.render(scene, camera);
        }

        // --- গেম ওভার ---
        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        // --- রিস্টার্ট ---
        function restartGame() {
            // সমস্ত শত্রু গাড়ি মুছে ফেলা
            enemies.forEach(e => scene.remove(e));
            enemies = [];

            // প্লেয়ার অবস্থান রিসেট
            playerCar.position.set(0, 0, 0);
            score = 0;
            baseSpeed = 1.2;
            isGameOver = false;

            document.getElementById('score').innerText = '0';
            document.getElementById('game-over-screen').style.display = 'none';

            animate(performance.now());
        }

        // --- স্ক্রিন রিসাইজ সাপোর্ট ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // গেম শুরু
        init();
    </script>
</body>
</html>
