<style>
/* FLAYNITY HOME — Prompt-faithful production UI */
.home-page{width:100%;height:calc(100vh - var(--nav-height,0px) - var(--safe-area-bottom,0px));overflow-y:auto;overflow-x:hidden;background:#f5f5f5;color:#111;padding-bottom:28px;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch}
.home-page *{box-sizing:border-box;max-width:100%}

.short-card.skeleton,.skeleton{background:linear-gradient(90deg,#e2e2e2 25%,#f4f4f4 50%,#e2e2e2 75%);background-size:200% 100%;animation:skeleton 1.25s infinite}
@keyframes skeleton{to{background-position:-200% 0}}
.video-feed{display:flex;flex-direction:column;gap:0}

.duration{position:absolute;right:8px;bottom:8px;padding:3px 6px;background:rgba(0,0,0,.82);color:#fff;border-radius:4px;font-size:12px;font-weight:700}

.more-dot{width:32px;height:32px;border:0;background:transparent;flex:0 0 32px}

.post-card{background:#fff;margin:0 0 18px;padding-top:14px}
.post-header{display:flex;align-items:center;gap:10px;padding:0 14px}
.post-user{min-width:0;flex:1}.post-user-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.subscribe-mini:active{transform:scale(.94)}
.post-title{padding:10px 14px 12px;font-size:15px;line-height:1.4}
.post-title.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-more{border:0;background:transparent;font-weight:750;padding:0 3px}
.post-media{width:100%;aspect-ratio:3/4;background:#ddd;overflow:hidden;cursor:pointer;border-radius:10px}
.post-media img{width:100%;height:100%;object-fit:cover;display:block}
.post-reactions{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee;color:#555;font-size:13px}

.reaction-summary .emoji-stack{letter-spacing:-5px;margin-right:5px}
.post-actions{display:grid;grid-template-columns:1fr 1fr;padding:5px 10px}
.post-action{position:relative;border:0;background:transparent;padding:10px;display:flex;justify-content:center;gap:7px;align-items:center;color:#555;font-weight:700;border-radius:9px;overflow:hidden}

@keyframes ripple{to{transform:scale(4);opacity:0}}
/* Watch */
.watch-page{position:fixed;inset:0;z-index:200;background:#f3f3f3;overflow-y:auto;overflow-x:hidden;transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s}
.watch-page.open{transform:translateY(0);visibility:visible}
.watch-player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.watch-player-wrap video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.watch-close{position:absolute;top:10px;left:10px;z-index:5;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff}
.buffer{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}.buffer.show{display:grid}.spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.premium-info{margin:0;background:#fff;padding:14px 16px 16px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.watch-title{font-size:18px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-meta{display:flex;gap:9px;flex-wrap:wrap;color:#666;font-size:12.5px;margin-top:8px}
.watch-more{border:0;background:transparent;padding:0;font-weight:800;color:#111;margin-top:7px}
.channel-actions{display:flex;align-items:center;gap:8px;margin-top:14px;overflow:hidden}
.channel-actions .avatar{width:38px;height:38px;flex-basis:38px}
.subscribe-btn{border:0;border-radius:999px;background:#000;color:#fff;padding:9px 15px;font-weight:800;white-space:nowrap;transition:.2s}
.subscribe-btn.subscribed{background:#e7e7e7;color:#111}
.action-pill{height:38px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:0 11px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:750;white-space:nowrap}
.action-pill:active{transform:scale(.95)}
.comment-card{margin:10px 0 0;background:#fff;border:1px solid #eee;border-radius:12px;padding:12px;cursor:pointer}
.comment-head{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.comment-preview{display:flex;gap:9px;align-items:center;margin-top:10px}.comment-preview .avatar{width:32px;height:32px;flex-basis:32px}.comment-text{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recommended{padding:8px 0 30px}.recommended .video-card{margin-bottom:14px}
.short-recommend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px}
/* Sheets */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:310;opacity:0;visibility:hidden;transition:.25s}
.sheet-backdrop.open{opacity:1;visibility:visible}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:320;max-height:84vh;background:#fff;border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:9px 16px 20px}
.bottom-sheet.open{transform:translateY(0)}.drag{width:42px;height:5px;background:#ccc;border-radius:10px;margin:2px auto 12px}
.sheet-close{position:absolute;right:12px;top:11px;width:34px;height:34px;border:0;border-radius:50%;background:#eee}.sheet-body{max-height:68vh;overflow-y:auto;padding-right:3px}.sheet-body h3{margin:4px 0 12px;font-size:18px}.sheet-row{padding:7px 0;font-size:13px}.sheet-desc{line-height:1.6;color:#555;white-space:pre-wrap}
/* Image preview */
.image-preview{position:fixed;inset:0;z-index:350;background:#000;display:none;align-items:center;justify-content:center}.image-preview.open{display:flex}.image-preview img{max-width:100%;max-height:100%;object-fit:contain}.image-close{position:absolute;top:14px;left:14px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff}
/* Reactions */
.reaction-picker{position:fixed;z-index:500;display:flex;gap:5px;padding:8px 10px;background:#fff;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.22);transform:scale(.85);opacity:0;visibility:hidden;transition:.18s}.reaction-picker.open{transform:scale(1);opacity:1;visibility:visible}.reaction-option{border:0;background:transparent;font-size:27px;padding:1px 4px;cursor:pointer}.reaction-option:hover{animation:bounce .42s ease}.reaction-option:active{transform:scale(1.25)}@keyframes bounce{50%{transform:translateY(-7px) scale(1.1)}}
.float-reaction{position:fixed;z-index:501;font-size:26px;pointer-events:none;animation:floatReaction .8s ease-out forwards}@keyframes floatReaction{to{transform:translateY(-65px) scale(1.4);opacity:0}}
.reacted-page{position:fixed;inset:0;z-index:380;background:#f5f5f5;transform:translateX(100%);visibility:hidden;transition:.3s}.reacted-page.open{transform:translateX(0);visibility:visible}
.reacted-top{height:56px;background:#fff;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:2}.reacted-top h2{font-size:17px;flex:1;text-align:center;margin-right:40px}
.reaction-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#f5f5f5;scrollbar-width:none}.reaction-chips::-webkit-scrollbar{display:none}.reaction-chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 12px;background:#e5e5e5;color:#111;font-size:12px;font-weight:750}.reaction-chip.active{background:#000;color:#fff}
.reacted-list{padding:4px 12px}.reacted-row{display:flex;align-items:center;gap:11px;padding:12px 4px;background:#fff;border-bottom:1px solid #eee}.reacted-row img{width:42px;height:42px;border-radius:50%;object-fit:cover}.reacted-name{flex:1;font-weight:700;font-size:14px}.reacted-emoji{font-size:22px}
.comments-page{position:fixed;inset:0;z-index:390;background:#f5f5f5;transform:translateX(100%);visibility:hidden;transition:.3s}.comments-page.open{transform:translateX(0);visibility:visible}.comments-list{padding:12px}.comment-row{display:flex;gap:10px;margin-bottom:16px}.comment-row .avatar{width:36px;height:36px;flex-basis:36px}.comment-bubble{background:#fff;border-radius:13px;padding:9px 12px;flex:1}.comment-name{font-weight:800;font-size:13px}.comment-body{font-size:13px;margin-top:3px;color:#444}
/* Mobile-safe: no horizontal page scroll */
@media(min-width:700px){.feed-container,.premium-info,.recommended{max-width:760px;margin-left:auto;margin-right:auto}.category-chips{max-width:760px;margin:auto}.home-header{padding-left:max(16px,calc((100vw - 760px)/2));padding-right:max(16px,calc((100vw - 760px)/2))}}
</style>

<div class="home-page" id="home-page">
  <header class="home-header">
    <div class="brand-logo">FLAYNITY<span>.</span></div>
    <div class="header-actions">
      <button class="icon-btn" aria-label="Search"><span class="material-symbols-outlined">search</span></button>
      <button class="icon-btn" aria-label="Settings"><span class="material-symbols-outlined">settings</span></button>
    </div>
  </header>
  <nav class="category-chips" aria-label="Feed categories">
    <button class="chip active" data-tab="all">All</button>
    <button class="chip" data-tab="posts">Posts</button>
    <button class="chip" data-tab="shorts">Shorts</button>
  </nav>
  <main class="feed-container" id="feed-container"></main>
</div>

<!-- Watch page -->
<section class="watch-page" id="watch-page">
  <div class="watch-player-wrap">
    <button class="watch-close" onclick="closeWatchPage()"><span class="material-symbols-outlined">arrow_back</span></button>
    <video id="main-video-player" controls playsinline preload="metadata"></video>
    <div class="buffer" id="video-buffer"><div class="spinner"></div></div>
  </div>
  <div class="premium-info">
    <div class="watch-title" id="watch-title">Loading...</div>
    <div class="watch-meta">
      <span id="watch-handle">@ChannelName</span><span id="watch-likes">0 Likes</span><span id="watch-views">0 Views</span><span id="watch-time">Just now</span>
    </div>
    <button class="watch-more" onclick="openMoreSheet()">...more</button>
    <div class="channel-actions">
      <img id="watch-avatar" class="avatar" src="" alt="">
      <button class="subscribe-btn" id="watch-subscribe" onclick="toggleSubscribe()">Subscribe</button>
      <button class="action-pill" onclick="toggleVideoLike()"><span id="watch-like-icon" class="material-symbols-outlined">thumb_up</span><span id="watch-like-count">0</span></button>
      <button class="action-pill" onclick="toggleVideoDislike()"><span class="material-symbols-outlined">thumb_down</span></button>
      <button class="action-pill" onclick="downloadCurrentVideo()"><span class="material-symbols-outlined">download</span>Download</button>
    </div>
    <div class="comment-card" onclick="openCommentsPage()">
      <div class="comment-head"><span>Comments</span><span id="watch-comments-count">0</span></div>
      <div class="comment-preview"><img id="last-comment-avatar" class="avatar" src="" alt=""><div class="comment-text" id="last-comment-text">Be the first to comment</div></div>
    </div>
  </div>
  <div class="recommended">
    <div class="section-title">Recommended</div>
    <div id="recommended-videos"></div>
    <div class="section-title">Shorts</div>
    <div class="short-recommend-grid" id="recommended-shorts"></div>
  </div>
</section>

<!-- More bottom sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeMoreSheet()"></div>
<section class="bottom-sheet" id="more-sheet">
  <div class="drag"></div><button class="sheet-close" onclick="closeMoreSheet()">×</button>
  <div class="sheet-body">
    <h3 id="sheet-title">Full Title</h3>
    <div class="sheet-row"><b id="sheet-likes">0</b> Likes · <b id="sheet-views">0</b> Views · <span id="sheet-time">Just now</span></div>
    <div class="sheet-desc" id="sheet-description">No description.</div>
  </div>
</section>

<!-- Full image preview -->
<div class="image-preview" id="image-preview" onclick="closeImagePreview()"><button class="image-close" onclick="event.stopPropagation();closeImagePreview()">×</button><img id="preview-image" src="" alt=""></div>

<!-- Reaction picker -->
<div class="reaction-picker" id="reaction-picker">
  <button class="reaction-option" data-reaction="love">❤️</button><button class="reaction-option" data-reaction="like">👍</button><button class="reaction-option" data-reaction="care">🥰</button><button class="reaction-option" data-reaction="haha">😆</button><button class="reaction-option" data-reaction="wow">😮</button><button class="reaction-option" data-reaction="sad">😭</button><button class="reaction-option" data-reaction="angry">😡</button>
</div>

<!-- All People Reacted -->
<section class="reacted-page" id="reacted-page">
  <div class="reacted-top"><button class="icon-btn" onclick="closeReactedPage()"><span class="material-symbols-outlined">arrow_back</span></button><h2>All People Reacted</h2></div>
  <div class="reaction-chips" id="reaction-chips"></div><div class="reacted-list" id="reacted-list"></div>
</section>

<!-- Comments -->
<section class="comments-page" id="comments-page">
  <div class="reacted-top"><button class="icon-btn" onclick="closeCommentsPage()"><span class="material-symbols-outlined">arrow_back</span></button><h2>Comments</h2></div>
  <div class="comments-list" id="comments-list"></div>
</section>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const db=window.firebase?.database?.()||null;
const imgFallback='https://i.pravatar.cc/100?img=12';
let currentTab='all', currentVideo=null, currentPost=null, postLimit=20, videoLimit=30, shortLimit=30;
let data={videos:[],shorts:[],posts:[]}, listeners=[];

const reactions={love:'❤️',like:'👍',care:'🥰',haha:'😆',wow:'😮',sad:'😭',angry:'😡'};
function val(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}
function count(o,...keys){const v=val(o,...keys);return Number(v)||0}
function timeAgo(ts){if(!ts)return 'Just now';let d=Date.now()-Number(ts);if(d<60000)return 'just now';if(d<3600000)return Math.floor(d/60000)+' min ago';if(d<86400000)return Math.floor(d/3600000)+' hours ago';if(d<604800000)return Math.floor(d/86400000)+' days ago';return new Date(Number(ts)).toLocaleDateString()}
function normalizeSnap(snap,type){const out=[];snap?.forEach?.(x=>{const v=x.val()||{};out.push({...v,id:x.key,type})});return out.reverse()}
function addRipple(e){const b=e.currentTarget,r=document.createElement('span');r.className='ripple';const rect=b.getBoundingClientRect(),size=Math.max(rect.width,rect.height);r.style.width=r.style.height=size+'px';r.style.left=e.clientX-rect.left-size/2+'px';r.style.top=e.clientY-rect.top-size/2+'px';b.appendChild(r);setTimeout(()=>r.remove(),600)}

function videoCard(v){const title=val(v,'title','name')||'Untitled video', thumb=val(v,'thumbnailUrl','thumbnail','thumbUrl'), avatar=val(v,'avatarUrl','channelAvatar','channelImage')||imgFallback, channel=val(v,'channelName','channelId','username')||'Channel', views=count(v,'views','viewCount'), duration=val(v,'duration','durationText')||'0:00';return `<article class="video-card" onclick="openWatchPage('${esc(v.id)}')"><div class="video-thumb"><img loading="lazy" src="${esc(thumb)}" onerror="this.style.display='none'"><span class="duration">${esc(duration)}</span></div><div class="video-info"><img class="avatar" loading="lazy" src="${esc(avatar)}" onerror="this.src='${imgFallback}'"><div class="video-copy"><div class="video-title">${esc(title)}</div><div class="video-meta">${esc(channel)} · ${views.toLocaleString()} views · ${timeAgo(val(v,'createdAt','timestamp'))}</div></div><button class="more-dot" onclick="event.stopPropagation()"><span class="material-symbols-outlined">more_vert</span></button></div></article>`}
function shortCard(s){return `<article class="short-card" onclick="openShortPlayer('${esc(s.id)}')"><img loading="lazy" src="${esc(val(s,'thumbnailUrl','thumbnail','thumbUrl'))}" onerror="this.style.display='none'"><span class="short-play material-symbols-outlined">play_arrow</span><div class="short-title">${esc(val(s,'title','name')||'Short')}</div></article>`}
function shortsSection(items,title='Shorts'){if(!items.length)return '';return `<section class="shorts-section"><div class="section-title"><span class="material-symbols-outlined">play_circle</span>${esc(title)}</div><div class="shorts-grid">${items.slice(0,6).map(shortCard).join('')}</div></section>`}
function postCard(p){const title=val(p,'title','caption','text')||'',avatar=val(p,'avatarUrl','userAvatar','channelAvatar')||imgFallback,user=val(p,'userName','channelName','username')||'User',image=val(p,'imageUrl','image','images') instanceof Array?val(p,'images')[0]:val(p,'imageUrl','image','mediaUrl'),rid=p.id||'';const reactionsCount=count(p,'reactionsCount','reactionCount','likesCount'),comments=count(p,'commentsCount','commentCount');return `<article class="post-card" data-post-id="${esc(rid)}"><div class="post-header"><img class="avatar" src="${esc(avatar)}" onerror="this.src='${imgFallback}'"><div class="post-user"><div class="post-user-name">${esc(user)}</div><div class="post-time">${timeAgo(val(p,'createdAt','timestamp'))}</div></div><button class="subscribe-mini" onclick="event.stopPropagation();togglePostSubscribe('${esc(val(p,'channelId','userId','uid')||rid)}',this)">Subscribe</button></div><div class="post-title collapsed" id="post-title-${esc(rid)}">${esc(title)}${title.length>100?` <button class="post-more" onclick="event.stopPropagation();togglePostTitle('${esc(rid)}')">...more</button>`:''}</div>${image?`<div class="post-media" onclick="openImagePreview('${esc(image)}')"><img loading="lazy" src="${esc(image)}" alt="Post image"></div>`:''}<div class="post-reactions"><div class="reaction-summary" onclick="openReactedPage('${esc(rid)}')"><span class="emoji-stack">❤️ 👍 🥰</span><span>${reactionsCount}</span></div><span>${comments} Comments</span></div><div class="post-actions"><button class="post-action" onpointerdown="startReactionPress(event,'${esc(rid)}')" onpointerup="endReactionPress()" onclick="quickLove(event,'${esc(rid)}')"><span class="material-symbols-outlined">favorite_border</span>Love</button><button class="post-action" onclick="openCommentsForPost('${esc(rid)}')"><span class="material-symbols-outlined">chat_bubble_outline</span>Comment</button></div></article>`}

function renderAll(){let html='';const S=data.shorts,V=data.videos,P=data.posts;let si=0,vi=0,pi=0;while(si<S.length||vi<V.length||pi<P.length){const shorts=S.slice(si,si+6);si+=6;if(shorts.length)html+=shortsSection(shorts,'Shorts');const vids=V.slice(vi,vi+10);vi+=10;if(vids.length)html+=`<section class="video-feed">${vids.map(videoCard).join('')}</section>`;const post=P[pi++];if(post)html+=postCard(post);if(si<S.length||vi<V.length||pi<P.length)html+='<div class="pattern-divider"></div>';if(si>=S.length&&vi>=V.length&&pi>=P.length)break} $('feed-container').innerHTML=html||emptyState('No content yet');wireRipples()}
function renderShorts(){ $('feed-container').innerHTML=shortsSection(data.shorts,'All Shorts')||emptyState('No Shorts uploaded yet');wireRipples() }
function renderPosts(){ $('feed-container').innerHTML=data.posts.length?data.posts.map(postCard).join(''):emptyState('No community posts yet');wireRipples() }
function emptyState(t){return `<div style="padding:60px 20px;text-align:center;color:#777">${esc(t)}</div>`}
function wireRipples(){document.querySelectorAll('.post-action,.action-pill,.subscribe-btn,.subscribe-mini').forEach(b=>b.addEventListener('click',addRipple,{once:false}))}

function listenData(){
 if(!db){data.videos=demoVideos();data.shorts=demoShorts();data.posts=demoPosts();render();return}
 listeners.forEach(x=>x.off?.());listeners=[];
 const listen=(path,type,target)=>{const ref=db.ref(path).orderByChild('createdAt').limitToLast(target);const cb=s=>{data[type]=normalizeSnap(s,type);render()};ref.on('value',cb);listeners.push(ref)}
 listen('videos','videos',videoLimit);listen('shorts','shorts',shortLimit);listen('posts','posts',postLimit);
}
function render(){if(currentTab==='all')renderAll();else if(currentTab==='shorts')renderShorts();else renderPosts()}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');currentTab=c.dataset.tab;render()});

window.openWatchPage=function(id){const v=data.videos.find(x=>x.id===id);if(!v)return;currentVideo=v;const w=$('watch-page');w.classList.add('open');document.querySelector('.home-page').scrollTop=0;const player=$('main-video-player');player.src=val(v,'cdnUrl','videoUrl','mediaUrl','url')||'';$('watch-title').textContent=val(v,'title','name')||'Untitled video';$('watch-handle').textContent='@'+(val(v,'channelHandle','channelName','channelId')||'Channel').replace(/^@/,'');$('watch-likes').textContent=count(v,'likes','likeCount')+' Likes';$('watch-views').textContent=count(v,'views','viewCount')+' Views';$('watch-time').textContent=timeAgo(val(v,'createdAt','timestamp'));$('watch-avatar').src=val(v,'avatarUrl','channelAvatar','channelImage')||imgFallback;$('sheet-description').textContent=val(v,'description','caption')||'No description.';$('sheet-title').textContent=val(v,'title','name')||'Untitled video';$('sheet-likes').textContent=count(v,'likes','likeCount');$('sheet-views').textContent=count(v,'views','viewCount');$('sheet-time').textContent=timeAgo(val(v,'createdAt','timestamp'));loadRecommended();if(player.src)player.play().catch(()=>{});}
window.closeWatchPage=function(){$('main-video-player').pause();$('watch-page').classList.remove('open')}
const player=$('main-video-player');player.addEventListener('waiting',()=>$('video-buffer').classList.add('show'));player.addEventListener('playing',()=>$('video-buffer').classList.remove('show'));player.addEventListener('canplay',()=>$('video-buffer').classList.remove('show'));player.addEventListener('ended',()=>{const first=data.videos.find(v=>v.id!==currentVideo?.id);if(first){setTimeout(()=>openWatchPage(first.id),300)}})
function loadRecommended(){const rv=data.videos.filter(v=>v.id!==currentVideo?.id).slice(0,10);$('recommended-videos').innerHTML=rv.map(videoCard).join('');$('recommended-shorts').innerHTML=data.shorts.slice(0,6).map(shortCard).join('')}
window.openShortPlayer=function(id){const s=data.shorts.find(x=>x.id===id);if(!s)return;const url=val(s,'cdnUrl','videoUrl','mediaUrl','url');currentVideo=s;const w=$('watch-page');w.classList.add('open');$('watch-title').textContent=val(s,'title','name')||'Short';$('watch-handle').textContent='@'+(val(s,'channelName','channelId')||'Channel');$('watch-likes').textContent=count(s,'likes','likeCount')+' Likes';$('watch-views').textContent=count(s,'views','viewCount')+' Views';$('watch-time').textContent=timeAgo(val(s,'createdAt','timestamp'));$('main-video-player').src=url||'';$('main-video-player').play().catch(()=>{});loadRecommended()}
window.openMoreSheet=function(){$('sheet-backdrop').classList.add('open');$('more-sheet').classList.add('open')};window.closeMoreSheet=function(){$('sheet-backdrop').classList.remove('open');$('more-sheet').classList.remove('open')}
window.toggleSubscribe=function(){const b=$('watch-subscribe'),on=b.classList.toggle('subscribed');b.textContent=on?'Subscribed':'Subscribe';if(db&&currentVideo){const uid=window.currentUser?.uid||'guest';db.ref(`channels/${val(currentVideo,'channelId','uid')}/subscribers/${uid}`).set(on)}}
window.togglePostSubscribe=function(channelId,b){b.classList.toggle('subscribed');b.textContent=b.classList.contains('subscribed')?'Subscribed':'Subscribe';if(db){const uid=window.currentUser?.uid||'guest';db.ref(`channels/${channelId}/subscribers/${uid}`).set(b.classList.contains('subscribed'))}}
window.toggleVideoLike=function(){if(!currentVideo)return;const i=$('watch-like-icon');const on=i.textContent==='thumb_up';i.textContent=on?'thumb_up':'thumb_up';i.style.fontVariationSettings=on?"'FILL' 1":'';const c=Math.max(0,count(currentVideo,'likes','likeCount')+(on?1:-1));$('watch-like-count').textContent=c}
window.toggleVideoDislike=function(){document.querySelector('#watch-page .action-pill:nth-of-type(3)')?.animate([{transform:'scale(1)'},{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:220})}
window.downloadCurrentVideo=function(){if(currentVideo){const u=val(currentVideo,'cdnUrl','videoUrl','mediaUrl','url');if(u)window.open(u,'_blank')}}
window.openImagePreview=function(src){$('preview-image').src=src;$('image-preview').classList.add('open')};window.closeImagePreview=function(){$('image-preview').classList.remove('open')}
window.togglePostTitle=function(id){const e=$('post-title-'+id);e.classList.toggle('collapsed');const b=e.querySelector('.post-more');if(b)b.textContent=e.classList.contains('collapsed')?'...more':'...less'}
let pressTimer=null,pressPost=null;
window.startReactionPress=function(e,id){pressPost=id;pressTimer=setTimeout(()=>showReactionPicker(e.clientX,e.clientY,id),500)}
window.endReactionPress=function(){clearTimeout(pressTimer)}
window.quickLove=function(e,id){if(Date.now()-(window.__reactionOpenedAt||0)<700)return;saveReaction(id,'love',e.clientX,e.clientY)}
function showReactionPicker(x,y,id){window.__reactionOpenedAt=Date.now();const p=$('reaction-picker');p.style.left=Math.max(5,Math.min(innerWidth-300,x-140))+'px';p.style.top=Math.max(8,y-70)+'px';p.dataset.postId=id;p.classList.add('open')}
$('reaction-picker').querySelectorAll('.reaction-option').forEach(b=>b.onclick=()=>{const p=$('reaction-picker');saveReaction(p.dataset.postId,b.dataset.reaction,innerWidth/2,innerHeight/2);p.classList.remove('open')});
function saveReaction(id,type,x,y){if(db){const uid=window.currentUser?.uid||'guest';db.ref(`posts/${id}/reactions/${uid}`).set(type)}const f=document.createElement('span');f.className='float-reaction';f.textContent=reactions[type];f.style.left=(x||innerWidth/2)+'px';f.style.top=(y||innerHeight/2)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),850)}
document.addEventListener('click',e=>{if(!$('reaction-picker').contains(e.target))$('reaction-picker').classList.remove('open')});
const reactionDefs=[['all','All'],['love','❤️ Love'],['like','👍 Like'],['care','🥰 Care'],['haha','😆 Haha'],['wow','😮 Wow'],['sad','😭 Sad'],['angry','😡 Angry']];
window.openReactedPage=function(id){currentPost=id;$('reacted-page').classList.add('open');selectReaction('all')}
window.closeReactedPage=function(){$('reacted-page').classList.remove('open')}
window.selectReaction=function(type){$('reaction-chips').innerHTML=reactionDefs.map(([k,l])=>`<button class="reaction-chip ${k===type?'active':''}" onclick="selectReaction('${k}')">${l} (${reactionCount(type)})</button>`).join('');loadReacted(type)}
function reactionCount(type){if(!db)return type==='all'?10:5;return '…'}
function loadReacted(type){const list=$('reacted-list');if(!db){list.innerHTML=Array.from({length:type==='all'?10:5},(_,i)=>`<div class="reacted-row"><img src="https://i.pravatar.cc/100?img=${i+10}"><div class="reacted-name">User ${i+1}</div><div class="reacted-emoji">${reactions[type==='all'?'love':type]||'❤️'}</div></div>`).join('');return}db.ref(`posts/${currentPost}/reactions`).once('value').then(s=>{let h='';s.forEach((x,i)=>{const r=x.val();if(type==='all'||r===type)h+=`<div class="reacted-row"><img src="${imgFallback}"><div class="reacted-name">${esc(x.key)}</div><div class="reacted-emoji">${reactions[r]||'❤️'}</div></div>`});list.innerHTML=h||emptyState('No reactions yet')})}
window.openCommentsPage=function(){loadComments(currentVideo?.id);$('comments-page').classList.add('open')};window.openCommentsForPost=function(id){currentPost=id;loadComments(id);$('comments-page').classList.add('open')};window.closeCommentsPage=function(){$('comments-page').classList.remove('open')}
function loadComments(id){const list=$('comments-list');if(!db){list.innerHTML=emptyState('No comments yet');return}db.ref(`comments/${id}`).limitToLast(50).once('value').then(s=>{let h='';s.forEach(x=>{const c=x.val()||{};h+=`<div class="comment-row"><img class="avatar" src="${esc(val(c,'avatarUrl','avatar')||imgFallback)}"><div class="comment-bubble"><div class="comment-name">${esc(val(c,'userName','username','uid')||'User')}</div><div class="comment-body">${esc(val(c,'text','comment')||'')}</div></div></div>`});list.innerHTML=h||emptyState('No comments yet')})}
function demoVideos(){return Array.from({length:30},(_,i)=>({id:'demo-v'+i,title:'FLAYNITY Long Video '+(i+1),thumbnailUrl:'https://picsum.photos/seed/flaynityv'+i+'/1280/720',avatarUrl:'https://i.pravatar.cc/100?img='+(i%60+1),channelName:'Flaynity Creator',views:(i+1)*137000,createdAt:Date.now()-i*3600000,duration:'12:34',description:'This is demo content. Connect Firebase to load real user uploads.',cdnUrl:''}))}
function demoShorts(){return Array.from({length:18},(_,i)=>({id:'demo-s'+i,title:'Amazing Short '+(i+1),thumbnailUrl:'https://picsum.photos/seed/flaynitys'+i+'/600/900',channelName:'Creator '+(i+1),views:(i+1)*12000,createdAt:Date.now()-i*7200000}))}
function demoPosts(){return Array.from({length:6},(_,i)=>({id:'demo-p'+i,title:'Welcome to FLAYNITY community — this is a professional Facebook-style community post with a longer title to demonstrate the two-line limit and more expansion.',imageUrl:'https://picsum.photos/seed/flaynityp'+i+'/900/1200',userName:'FLAYNITY User '+(i+1),avatarUrl:'https://i.pravatar.cc/100?img='+(i+20),createdAt:Date.now()-i*900000,reactionsCount:100+i,commentsCount:14+i}))}
window.addEventListener('scroll',()=>{if(currentTab==='posts'&&innerHeight+scrollY>=document.documentElement.scrollHeight-500&&db){postLimit+=10;listenData()}});
listenData();
})();
</script>
