<style>
    :root {
        --bg-primary: #ffffff;
        --bg-surface: #f8f9fa;
        --bg-surface-light: #e4e6eb;
        --text-primary: #0f0f0f;
        --text-secondary: #606060;
        --accent-color: #ff0000;
        --like-color: #0695FF;
        --love-color: #E41E3F;
        --border-color: #e5e5e5;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .home-page {
        width: 100%;
        min-height: 100vh;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        padding-bottom: 80px;
    }

    /* Fixed Category Bar */
    .category-chips-bar {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        width: 100%;
        padding: 10px 12px;
        gap: 8px;
        background-color: var(--bg-primary);
        position: sticky;
        top: 0;
        z-index: 45;
        overflow: hidden;
    }

    .chip-btn {
        width: 100%;
        text-align: center;
        padding: 9px 0;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background-color: var(--bg-surface-light);
        color: #050505;
        border: none;
        outline: none;
        transition: background-color 0.25s ease, color 0.25s ease, transform 0.1s ease;
        user-select: none;
    }

    .chip-btn:active {
        transform: scale(0.97);
    }

    .chip-btn.active {
        background-color: #000000;
        color: #ffffff;
    }

    /* Feed Container */
    .feed-container {
        width: 100%;
        display: flex;
        flex-direction: column;
    }

    /* Skeleton Loading */
    .skeleton {
        background: linear-gradient(90deg, #ececec 25%, #f7f7f7 50%, #ececec 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.4s infinite ease-in-out;
    }

    @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }

    /* Shorts 2-Column Grid */
    .shorts-shelf {
        padding: 16px 0 20px;
        background: var(--bg-primary);
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 16px;
    }

    .shorts-shelf-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px 12px;
        font-size: 17px;
        font-weight: 700;
    }

    .shorts-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px;
    }

    .short-card {
        position: relative;
        aspect-ratio: 2 / 3;
        border-radius: 12px;
        overflow: hidden;
        background-color: #000;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .short-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .short-card-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 24px 8px 8px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
    }

    .short-card-title {
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* YouTube-style Long Video Card */
    .video-card {
        width: 100%;
        margin-bottom: 24px;
        cursor: pointer;
    }

    .video-thumbnail-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: #000;
    }

    .video-thumbnail-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .video-duration {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background-color: rgba(0, 0, 0, 0.8);
        color: #ffffff;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
    }

    .video-info-box {
        display: flex;
        padding: 12px 14px 0;
        gap: 12px;
    }

    .channel-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--bg-surface-light);
        flex-shrink: 0;
    }

    .video-text-box {
        flex: 1;
        overflow: hidden;
    }

    .video-title-row {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 4px;
    }

    .video-meta-row {
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Facebook-Style Post Card */
    .post-card {
        width: 100%;
        background-color: var(--bg-primary);
        border-top: 6px solid var(--bg-surface-light);
        border-bottom: 6px solid var(--bg-surface-light);
        padding: 14px 0 8px;
        margin-bottom: 16px;
        position: relative;
    }

    .post-header {
        display: flex;
        align-items: center;
        padding: 0 14px 10px;
        gap: 10px;
    }

    .post-user-info {
        flex: 1;
    }

    .post-user-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
    }

    .post-time {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
    }

    .post-sub-btn {
        background: transparent;
        border: none;
        color: #000;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        padding: 4px 8px;
    }

    .post-caption {
        padding: 0 14px 10px;
        font-size: 14px;
        line-height: 1.45;
        color: var(--text-primary);
    }

    .post-caption.clamped {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .post-more-btn {
        color: var(--text-secondary);
        font-weight: 600;
        cursor: pointer;
        margin-left: 4px;
    }

    .post-image-container {
        width: 100%;
        aspect-ratio: 3 / 4;
        background-color: #000;
        cursor: pointer;
        overflow: hidden;
    }

    .post-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.2s ease;
    }

    .post-stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        font-size: 13px;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-color);
        cursor: pointer;
    }

    .post-reaction-icons {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .emoji-stack {
        display: flex;
        align-items: center;
    }

    .emoji-stack span {
        margin-right: -4px;
        font-size: 15px;
    }

    .post-actions-bar {
        display: flex;
        padding: 4px 10px;
        position: relative;
    }

    .post-act-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
        user-select: none;
        position: relative;
    }

    .post-act-btn:active {
        background-color: var(--bg-surface-light);
    }

    /* Floating Reaction Picker */
    .reaction-picker {
        position: absolute;
        bottom: 44px;
        left: 10px;
        background: #ffffff;
        border-radius: 30px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        display: none;
        align-items: center;
        padding: 6px 10px;
        gap: 10px;
        z-index: 60;
        animation: pickerPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pickerPop {
        0% { transform: scale(0.6) translateY(20px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .reaction-emoji {
        font-size: 26px;
        cursor: pointer;
        display: inline-block;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: emojiWobble 2s infinite ease-in-out;
    }

    .reaction-emoji:hover, .reaction-emoji:active {
        transform: scale(1.45) translateY(-8px);
    }

    @keyframes emojiWobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg) scale(1.05); }
        75% { transform: rotate(5deg) scale(1.05); }
    }

    /* Full Screen Image Preview Modal */
    .fullscreen-image-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: #000000;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
    }

    .modal-close-btn {
        position: absolute;
        top: 20px;
        left: 20px;

        border: none;
        border-radius: 50%;

        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 22px;
        cursor: pointer;
        z-index: 1010;
        backdrop-filter: blur(8px);
    }

    .fullscreen-image-modal img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    /* Watch Page Overlay */
    .watch-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: var(--bg-primary);
        z-index: 200;
        display: none;
        flex-direction: column;
        overflow-y: auto;
    }

    .watch-player-wrapper {
        position: sticky;
        top: 0;
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: #000000;
        z-index: 50;
    }

    .watch-player-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .watch-back-btn {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 60;
    }

    .video-details-card {
        padding: 14px 16px;
        background-color: #ffffff;
        border-bottom: 1px solid var(--border-color);
    }

    .details-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 6px;
    }

    .details-metadata-row {
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .meta-more-btn {
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
    }

    .channel-action-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
    }

    .channel-action-row .channel-avatar {
        width: 38px;
        height: 38px;
    }

    .pill-sub-btn {
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .pill-sub-btn.subscribed {
        background-color: var(--bg-surface-light);
        color: #000000;
    }

    .actions-scroll-group {
        display: flex;
        gap: 8px;
        margin-left: auto;
    }

    .action-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background-color: var(--bg-surface-light);
        padding: 7px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: transform 0.1s ease;
    }

    .action-pill:active {
        transform: scale(0.96);
    }

    .action-pill.active-like {
        color: var(--like-color);
    }

    /* Comment Preview Card */
    .comment-preview-box {
        margin: 12px 16px;
        padding: 12px;
        background-color: var(--bg-surface);
        border-radius: 12px;
        cursor: pointer;
    }

    .comment-preview-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .comment-preview-content {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .comment-preview-content img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
    }

    .comment-preview-text {
        font-size: 13px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
    }

    /* Bottom Sheets */
    .bottom-sheet-backdrop {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: 500;
        display: none;
    }

    .bottom-sheet {
        position: fixed;
        bottom: 0; left: 0; width: 100%;
        max-height: 75vh;
        background-color: #ffffff;
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
        z-index: 510;
        display: none;
        flex-direction: column;
        padding: 14px 16px 24px;
        box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
        animation: slideUp 0.25s ease-out forwards;
    }

    @keyframes slideUp {
        0% { transform: translateY(100%); }
        100% { transform: translateY(0); }
    }

    .sheet-drag-handle {
        width: 40px;
        height: 4px;
        background: #ccc;
        border-radius: 4px;
        margin: 0 auto 12px;
    }

    .sheet-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
    }

    .sheet-body {
        overflow-y: auto;
        padding: 12px 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--text-primary);
    }

    /* All People Reacted Page / Modal */
    .reacted-users-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: var(--bg-primary);
        z-index: 600;
        display: none;
        flex-direction: column;
    }

    .reacted-topbar {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);

    .reacted-filter-chips {
        display: flex;

        padding: 10px 14px;

    .reacted-filter-chips::-webkit-scrollbar {

    .reacted-filter-chip {

        font-weight: 600;
        background-color: var(--bg-surface-light);

        white-space: nowrap;
        cursor: pointer;
        border: none;
    }

    .reacted-filter-chip.active {

    }

    .reacted-users-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .reacted-user-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .reacted-user-emoji {
        margin-left: auto;
        font-size: 20px;
    }
</style>

<script>
(function() {
    // Cloudflare CDN Domain configured
    const CDN_DOMAIN = 'https://pub-bcff9c709dbe44d7a50c78e9a0f9bd59.r2.dev';

    // Helper: Turn Cloudflare R2 key or path into fast CDN link
    function getCdnUrl(url) {
        if (!url) return '';
        if (url.startsWith('http://') || url.startsWith('https://')) {
            // Replace raw bucket endpoints with high performance CDN if applicable
            return url.replace('https://b3741135bd1f3e96b6744f11e6a06600.r2.cloudflarestorage.com/flaynity-storage', CDN_DOMAIN);
        }
        return `${CDN_DOMAIN}/${url.replace(/^\/+/, '')}`;
    }

    // Number compact formatter (1.2K, 3.4M)
    function formatCount(num) {
        if (!num || isNaN(num)) return '0';
        if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        return num.toString();
    }

    // Relative Time Formatter
    function timeAgo(dateParam) {
        if (!dateParam) return 'Just now';
        const date = typeof dateParam === 'object' ? dateParam : new Date(dateParam);
        const today = new Date();
        const seconds = Math.round((today - date) / 1000);
        const minutes = Math.round(seconds / 60);
        const hours = Math.round(minutes / 60);
        const days = Math.round(hours / 24);

        if (seconds < 60) return 'Just now';
        if (minutes < 60) return `${minutes}m ago`;
        if (hours < 24) return `${hours}h ago`;
        if (days < 30) return `${days}d ago`;
        return date.toLocaleDateString();
    }

    // Current State
    let activeTab = 'all';
    let currentVideoData = null;
    let allVideos = [];
    let allShorts = [];
    let allPosts = [];
    let activePostReactions = {};

    const feedContainer = document.getElementById('feed-container');

    // Tab Switching
    window.switchCategory = function(tabName) {
        activeTab = tabName;
        document.querySelectorAll('.chip-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
        renderCurrentFeed();
    };

    // Firebase Listeners (Realtime synchronization)
    function initRealtimeData() {
        if (!window.db) {
            console.warn('[Flaynity] Firebase Realtime Database not ready.');
            return;
        }

        // Realtime listener for Videos
        window.db.ref('videos').limitToLast(50).on('value', snapshot => {
            const val = snapshot.val();
            allVideos = val ? Object.keys(val).map(key => ({ id: key, ...val[key] })).reverse() : [];
            renderCurrentFeed();
        });

        // Realtime listener for Shorts
        window.db.ref('shorts').limitToLast(50).on('value', snapshot => {
            const val = snapshot.val();
            allShorts = val ? Object.keys(val).map(key => ({ id: key, ...val[key] })).reverse() : [];
            renderCurrentFeed();
        });

        // Realtime listener for Posts
        window.db.ref('posts').limitToLast(50).on('value', snapshot => {
            const val = snapshot.val();
            allPosts = val ? Object.keys(val).map(key => ({ id: key, ...val[key] })).reverse() : [];
            renderCurrentFeed();
        });
    }

    // Render Master Method
    function renderCurrentFeed() {
        feedContainer.innerHTML = '';

        if (activeTab === 'all') {
            renderAllTabFeed();
        } else if (activeTab === 'posts') {
            renderPostsOnly();
        } else if (activeTab === 'shorts') {
            renderShortsOnly();
        }
    }

    // Pattern in "All": 6 Shorts -> 10 Videos -> 1 Post -> Repeat
    function renderAllTabFeed() {
        let shortIndex = 0;
        let videoIndex = 0;
        let postIndex = 0;

        const maxLoops = Math.max(
            Math.ceil(allShorts.length / 6),
            Math.ceil(allVideos.length / 10),
            allPosts.length
        ) || 1;

        for (let i = 0; i < maxLoops; i++) {
            // 1. Take up to 6 shorts
            const currentShorts = allShorts.slice(shortIndex, shortIndex + 6);
            if (currentShorts.length > 0) {
                feedContainer.insertAdjacentHTML('beforeend', createShortsShelfHtml(currentShorts));
                shortIndex += 6;
            }

            // 2. Take up to 10 Videos
            const currentVideos = allVideos.slice(videoIndex, videoIndex + 10);
            currentVideos.forEach(video => {
                feedContainer.insertAdjacentHTML('beforeend', createVideoCardHtml(video));
            });
            videoIndex += 10;

            // 3. Take 1 Post
            if (postIndex < allPosts.length) {
                feedContainer.insertAdjacentHTML('beforeend', createPostCardHtml(allPosts[postIndex]));
                postIndex += 1;
            }
        }
    }

    function renderPostsOnly() {
        if (allPosts.length === 0) {
            feedContainer.innerHTML = '<div style="text-align:center; padding:40px; color:gray;">No posts found</div>';
            return;
        }
        allPosts.forEach(post => {
            feedContainer.insertAdjacentHTML('beforeend', createPostCardHtml(post));
        });
    }

    function renderShortsOnly() {
        if (allShorts.length === 0) {
            feedContainer.innerHTML = '<div style="text-align:center; padding:40px; color:gray;">No shorts found</div>';
            return;
        }
        const shelf = document.createElement('div');
        shelf.className = 'shorts-shelf';
        shelf.style.borderBottom = 'none';
        shelf.innerHTML = `<div class="shorts-grid" style="padding-top:10px;">
            ${allShorts.map(short => createShortCardInnerHtml(short)).join('')}
        </div>`;
        feedContainer.appendChild(shelf);
    }

    // HTML Generator Functions
    function createShortsShelfHtml(shortsArray) {
        return `
            <div class="shorts-shelf">
                <div class="shorts-shelf-header">
                    <span style="color:var(--accent-color);">⚡</span> Shorts
                </div>
                <div class="shorts-grid">
                    ${shortsArray.map(short => createShortCardInnerHtml(short)).join('')}
                </div>
            </div>
        `;
    }

    function createShortCardInnerHtml(short) {
        const thumb = getCdnUrl(short.thumbnailUrl || short.coverUrl);
        return `
            <div class="short-card" onclick="openShortViewer('${short.id}')">
                <img src="${thumb}" loading="lazy" alt="">
                <div class="short-card-overlay">
                    <div class="short-card-title">${escapeHtml(short.title || 'Untitled')}</div>
                </div>
            </div>
        `;
    }

    function createVideoCardHtml(video) {
        const thumb = getCdnUrl(video.thumbnailUrl || video.coverUrl);
        const avatar = getCdnUrl(video.channelAvatar || video.authorAvatar || 'https://via.placeholder.com/80');
        const duration = video.duration || '0:00';
        return `
            <div class="video-card" onclick="openWatchPage('${video.id}')">
                <div class="video-thumbnail-wrap">
                    <img src="${thumb}" loading="lazy" alt="">
                    <div class="video-duration">${duration}</div>
                </div>
                <div class="video-info-box">
                    <img src="${avatar}" class="channel-avatar" loading="lazy">
                    <div class="video-text-box">
                        <div class="video-title-row">${escapeHtml(video.title || 'Untitled')}</div>
                        <div class="video-meta-row">
                            ${escapeHtml(video.channelName || video.authorName || 'Creator')} • ${formatCount(video.views || 0)} views • ${timeAgo(video.createdAt)}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function createPostCardHtml(post) {
        const avatar = getCdnUrl(post.authorAvatar || post.channelAvatar || 'https://via.placeholder.com/80');
        const mediaUrl = getCdnUrl(post.mediaUrl || post.imageUrl);
        const reactions = post.reactions || {};
        const reactionCount = Object.keys(reactions).length;
        const commentsCount = post.commentsCount || 0;

        return `
            <div class="post-card" id="post-${post.id}">
                <div class="post-header">
                    <img src="${avatar}" class="channel-avatar" loading="lazy">
                    <div class="post-user-info">
                        <div class="post-user-name">${escapeHtml(post.authorName || 'User')}</div>
                        <div class="post-time">${timeAgo(post.createdAt)}</div>
                    </div>
                    <button class="post-sub-btn" onclick="toggleSubscribeChannel('${post.channelId || post.userId}')">Subscribe</button>
                </div>
                <div class="post-caption clamped" id="post-caption-${post.id}">
                    ${escapeHtml(post.caption || '')}
                </div>
                ${(post.caption && post.caption.length > 90) ? `
                    <span class="post-more-btn" onclick="expandPostCaption('${post.id}')">...more</span>
                ` : ''}
                ${mediaUrl ? `
                    <div class="post-image-container" onclick="openImagePreview('${mediaUrl}')">
                        <img src="${mediaUrl}" loading="lazy" alt="">
                    </div>
                ` : ''}
                <div class="post-stats-bar" onclick="openReactedModal('${post.id}')">
                    <div class="post-reaction-icons">
                        <div class="emoji-stack">
                            <span>❤️</span><span>👍</span><span>🥰</span>
                        </div>
                        <span>${reactionCount} Reactions</span>
                    </div>
                    <div>${commentsCount} Comments</div>
                </div>
                <div class="post-actions-bar">
                    <!-- Long press trigger for reaction picker -->
                    <button class="post-act-btn" 
                        onmousedown="startReactionHold('${post.id}')" 
                        onmouseup="endReactionHold()" 
                        ontouchstart="startReactionHold('${post.id}')" 
                        ontouchend="endReactionHold()"
                        onclick="toggleDefaultLove('${post.id}')">
                        <span id="post-love-icon-${post.id}">❤️</span> Love
                    </button>
                    <button class="post-act-btn" onclick="openPostComments('${post.id}')">
                        <span>💬</span> Comment
                    </button>

                    <!-- Floating Reaction Bar -->
                    <div class="reaction-picker" id="picker-${post.id}">
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '❤️')">❤️</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '👍')">👍</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '🥰')">🥰</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '😆')">😆</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '😮')">😮</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '😭')">😭</span>
                        <span class="reaction-emoji" onclick="selectReaction('${post.id}', '😡')">😡</span>
                    </div>
                </div>
            </div>
        `;
    }

    // Expand Caption
    window.expandPostCaption = function(postId) {
        const el = document.getElementById(`post-caption-${postId}`);
        if (el) el.classList.remove('clamped');
    };

    // Reaction Hold Logic
    let reactionTimer = null;
    window.startReactionHold = function(postId) {
        reactionTimer = setTimeout(() => {
            document.querySelectorAll('.reaction-picker').forEach(p => p.style.display = 'none');
            const picker = document.getElementById(`picker-${postId}`);
            if (picker) picker.style.display = 'flex';
        }, 400);
    };

    window.endReactionHold = function() {
        if (reactionTimer) clearTimeout(reactionTimer);
    };

    // Select Reaction & Save to Firebase RTDB
    window.selectReaction = function(postId, emoji) {
        const picker = document.getElementById(`picker-${postId}`);
        if (picker) picker.style.display = 'none';

        const userId = window.auth?.currentUser?.uid || 'guest_user';
        if (window.db) {
            window.db.ref(`posts/${postId}/reactions/${userId}`).set({
                emoji: emoji,
                userName: window.auth?.currentUser?.displayName || 'Flaynity User',
                userAvatar: window.auth?.currentUser?.photoURL || 'https://via.placeholder.com/80',
                timestamp: Date.now()
            });
        }
    };

    window.toggleDefaultLove = function(postId) {
        window.selectReaction(postId, '❤️');
    };

    // All People Reacted Modal & Filter
    let currentReactedPostId = null;
    window.openReactedModal = function(postId) {
        currentReactedPostId = postId;
        const modal = document.getElementById('reacted-modal');
        modal.style.display = 'flex';

        if (window.db) {
            window.db.ref(`posts/${postId}/reactions`).on('value', snapshot => {
                const reactions = snapshot.val() || {};
                renderReactedUsers(reactions, 'All');
            });
        }
    };

    window.closeReactedModal = function() {
        document.getElementById('reacted-modal').style.display = 'none';
        if (window.db && currentReactedPostId) {
            window.db.ref(`posts/${currentReactedPostId}/reactions`).off();
        }
    };

    function renderReactedUsers(reactionsObj, selectedFilter) {
        const users = Object.keys(reactionsObj).map(uid => ({ uid, ...reactionsObj[uid] }));
        const chipsContainer = document.getElementById('reaction-chips-row');
        const listContainer = document.getElementById('reacted-users-list');

        // Counts per reaction
        const counts = { All: users.length };
        users.forEach(u => {
            counts[u.emoji] = (counts[u.emoji] || 0) + 1;
        });

        // Render filter chips
        chipsContainer.innerHTML = `
            <button class="reacted-filter-chip ${selectedFilter === 'All' ? 'active' : ''}" onclick="filterReacted('All')">All (${counts.All || 0})</button>
            ${['❤️', '👍', '🥰', '😆', '😮', '😭', '😡'].map(emoji => `
                <button class="reacted-filter-chip ${selectedFilter === emoji ? 'active' : ''}" onclick="filterReacted('${emoji}')">${emoji} (${counts[emoji] || 0})</button>
            `).join('')}
        `;

        // Filter list
        const filteredUsers = selectedFilter === 'All' ? users : users.filter(u => u.emoji === selectedFilter);

        listContainer.innerHTML = filteredUsers.map(u => `
            <div class="reacted-user-row">
                <img src="${getCdnUrl(u.userAvatar)}" class="channel-avatar" style="width:36px; height:36px;">
                <div style="font-weight:600; font-size:14px;">${escapeHtml(u.userName || 'User')}</div>
                <div class="reacted-user-emoji">${u.emoji}</div>
            </div>
        `).join('');
    }

    window.filterReacted = function(emojiFilter) {
        if (!window.db || !currentReactedPostId) return;
        window.db.ref(`posts/${currentReactedPostId}/reactions`).once('value', snap => {
            renderReactedUsers(snap.val() || {}, emojiFilter);
        });
    };

    // Full Screen Image Preview
    window.openImagePreview = function(url) {
        document.getElementById('image-modal-src').src = url;
        document.getElementById('image-modal').style.display = 'flex';
    };

    window.closeImagePreview = function() {
        document.getElementById('image-modal').style.display = 'none';
    };

    // Watch Page (YouTube Style Long Video Player)
    window.openWatchPage = function(videoId) {
        const video = allVideos.find(v => v.id === videoId);
        if (!video) return;
        currentVideoData = video;

        const overlay = document.getElementById('watch-overlay');
        overlay.style.display = 'flex';

        // Set CDN video stream
        const videoPlayer = document.getElementById('watch-video-element');
        videoPlayer.src = getCdnUrl(video.cdnUrl || video.videoUrl);
        videoPlayer.play();

        // Increment Views in Firebase
        if (window.db) {
            window.db.ref(`videos/${videoId}/views`).transaction(current => (current || 0) + 1);
        }

        // Fill Details
        document.getElementById('watch-title').innerText = video.title || 'Untitled';
        document.getElementById('watch-handle').innerText = `@${video.channelHandle || video.channelName || 'creator'}`;
        document.getElementById('watch-likes-count').innerText = `${formatCount(video.likes || 0)} Likes`;
        document.getElementById('watch-views-count').innerText = `${formatCount((video.views || 0) + 1)} Views`;
        document.getElementById('watch-time').innerText = timeAgo(video.createdAt);
        document.getElementById('watch-channel-avatar').src = getCdnUrl(video.channelAvatar || 'https://via.placeholder.com/80');
        document.getElementById('desc-full-text').innerText = video.description || 'No description available.';

        // Render Recommended List
        const recContainer = document.getElementById('watch-recommended-feed');
        recContainer.innerHTML = allVideos
            .filter(v => v.id !== videoId)
            .map(v => createVideoCardHtml(v))
            .join('');

        // Video Ended -> Auto-play / Show Next
        videoPlayer.onended = function() {
            const nextVideo = allVideos.find(v => v.id !== videoId);
            if (nextVideo) openWatchPage(nextVideo.id);
        };
    };

    window.closeWatchPage = function() {
        const videoPlayer = document.getElementById('watch-video-element');
        videoPlayer.pause();
        videoPlayer.src = '';
        document.getElementById('watch-overlay').style.display = 'none';
    };

    // Subscribe live toggle
    window.toggleSubscribeCurrent = function() {
        if (!currentVideoData) return;
        toggleSubscribeChannel(currentVideoData.channelId || currentVideoData.userId);
    };

    window.toggleSubscribeChannel = function(channelId) {
        const userId = window.auth?.currentUser?.uid || 'guest_user';
        if (!window.db || !channelId) return;

        const subRef = window.db.ref(`subscriptions/${userId}/${channelId}`);
        subRef.once('value', snap => {
            const isSubbed = snap.val();
            subRef.set(!isSubbed);
            window.db.ref(`channels/${channelId}/subscribersCount`).transaction(count => {
                return isSubbed ? Math.max(0, (count || 1) - 1) : (count || 0) + 1;
            });
            const subBtn = document.getElementById('watch-sub-btn');
            if (subBtn) {
                subBtn.innerText = !isSubbed ? 'Subscribed' : 'Subscribe';
                subBtn.classList.toggle('subscribed', !isSubbed);
            }
        });
    };

    // Watch Like Live Toggle
    window.toggleWatchLike = function() {
        if (!currentVideoData || !window.db) return;
        const videoId = currentVideoData.id;
        const userId = window.auth?.currentUser?.uid || 'guest_user';
        const likeRef = window.db.ref(`videos/${videoId}/userLikes/${userId}`);

        likeRef.once('value', snap => {
            const isLiked = snap.val();
            likeRef.set(!isLiked);
            window.db.ref(`videos/${videoId}/likes`).transaction(current => {
                return isLiked ? Math.max(0, (current || 1) - 1) : (current || 0) + 1;
            });
            document.getElementById('watch-like-btn').classList.toggle('active-like', !isLiked);
        });
    };

    // Bottom Sheet Handlers
    window.openDescriptionSheet = function() {
        document.getElementById('desc-backdrop').style.display = 'block';
        document.getElementById('desc-sheet').style.display = 'flex';
    };

    window.closeDescriptionSheet = function() {
        document.getElementById('desc-backdrop').style.display = 'none';
        document.getElementById('desc-sheet').style.display = 'none';
    };

    // Navigation trigger for Shorts
    window.openShortViewer = function(shortId) {
        window.location.hash = `#shorts?id=${shortId}`;
    };

    // Download Handler
    window.triggerDownload = function() {
        if (currentVideoData) {
            const url = getCdnUrl(currentVideoData.cdnUrl || currentVideoData.videoUrl);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentVideoData.title || 'video'}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    };

    // Escape helper
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    // Start App & Listeners
    initRealtimeData();
})();
</script>
