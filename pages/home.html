<style>
    /* Home Page Specific Scoped CSS */
    .home-container {
        width: 100%; height: 100%; display: flex; flex-direction: column; position: relative;
    }
    
    /* Splash Screen */
    #splash-screen {
        position: absolute; inset: 0; background: #ffffff; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
    }
    .flaynity-logo-text { font-size: 32px; font-weight: 900; color: #ff2a5f; letter-spacing: -1px; }
    
    /* Auth Screen */
    #auth-screen {
        position: absolute; inset: 0; background: #ffffff; z-index: 9998; display: none;
        flex-direction: column; padding: 24px; justify-content: center;
    }
    .auth-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .auth-input { width: 100%; padding: 16px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
    .auth-input:focus { border-color: #ff2a5f; }
    .btn-primary { width: 100%; padding: 16px; background: #ff2a5f; color: white; border: none; border-radius: 100px; font-size: 16px; font-weight: 600; cursor: pointer; }
    
    /* Top Bar */
    .top-bar {
        display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
        background: #ffffff; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .top-bar-left { display: flex; align-items: center; gap: 8px; }
    .top-bar-right { display: flex; gap: 16px; color: #0f0f0f; }
    
    /* Category Chips (Strict No Horizontal Scroll, Equal Divide) */
    .category-chips {
        display: flex; width: 100%; background: #ffffff; padding: 8px; gap: 8px; flex-shrink: 0; border-bottom: 1px solid #f0f0f0;
    }
    .chip {
        flex: 1; padding: 8px 0; text-align: center; border-radius: 8px; font-size: 14px; font-weight: 500;
        background: #f2f2f2; color: #0f0f0f; transition: all 0.2s; cursor: pointer;
    }
    .chip.active { background: #0f0f0f; color: #ffffff; }

    /* Feed Area */
    .feed-container {
        flex: 1; overflow-y: auto; overflow-x: hidden; background: #f8f8f8; padding-bottom: 80px; /* Space for Bottom Nav */
    }

    /* Video Player Overlay (Initially Hidden) */
    #video-player-view {
        position: absolute; inset: 0; background: #ffffff; z-index: 1000; display: none; flex-direction: column; overflow-y: auto;
    }
    .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
</style>

<div class="home-container">
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="flaynity-logo-text">Flaynity</div>
        <div style="margin-top: 16px; font-size: 14px; color: #666;" id="splash-status">Loading...</div>
    </div>

    <!-- Auth / Login Screen -->
    <div id="auth-screen">
        <div class="flaynity-logo-text" style="margin-bottom: 32px;">Flaynity</div>
        <div class="auth-title">Welcome back</div>
        <p style="color: #666; margin-bottom: 24px;">Sign in to continue</p>
        <input type="email" id="auth-email" class="auth-input" placeholder="Email address">
        <input type="password" id="auth-pass" class="auth-input" placeholder="Password">
        <button class="btn-primary" id="auth-btn">Sign In</button>
        <p style="text-align: center; margin-top: 16px; color: #666; font-size: 14px;">
            Don't have an account? <span style="color: #ff2a5f; font-weight: 600;" id="toggle-auth">Register</span>
        </p>
    </div>

    <!-- Main Home UI -->
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="material-symbols-rounded" style="color: #ff2a5f; font-size: 28px;">play_circle</span>
            <span class="flaynity-logo-text" style="font-size: 20px;">Flaynity</span>
        </div>
        <div class="top-bar-right">
            <span class="material-symbols-rounded">search</span>
            <span class="material-symbols-rounded">settings</span>
        </div>
    </div>

    <div class="category-chips">
        <div class="chip active" data-category="all">All</div>
        <div class="chip" data-category="posts">Posts</div>
        <div class="chip" data-category="shorts">Shorts</div>
    </div>

    <!-- Scrollable Feed -->
    <div class="feed-container" id="home-feed">
        <!-- Skeleton Loaders will be injected here via JS -->
        <div id="feed-content"></div>
    </div>

    <!-- Video Player View (Full Screen Overlay) -->
    <div id="video-player-view">
        <div class="video-wrapper">
            <video id="main-video-player" width="100%" height="100%" controls controlsList="nodownload"></video>
        </div>
        <div id="video-info-card" style="padding: 16px;">
            <!-- Video Meta Injected by JS -->
        </div>
    </div>
</div>
