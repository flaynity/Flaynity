<!-- ===================================================================
     Flaynity — Posts page (pages/posts.html)
     Single file: HTML + CSS + JS.
     Layout: [Home top bar] -> [Feels card row, swipe left/right] -> [All Posts feed]
     The top bar is the shared app header (logo, name, Upload +, Search, Theme).
     Post cards are drawn by the same renderer the Home feed uses, so they
     look and behave exactly like Home post cards.
==================================================================== -->
<style>
/* Posts tab: sits under the 82px app top bar. Same side padding as Home so
   the shared .post-card.fb-post full-bleed styling matches Home exactly. */
#posts-tab { padding-top: 82px; padding-bottom: 0; }

/* ---------- "What's on your mind?" composer ---------- */
.px-compose {
    margin: 0 -16px;
    width: calc(100% + 32px);
    box-sizing: border-box;
    padding: 12px 16px 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
}
.px-me {
    flex: 0 0 40px; width: 40px; height: 40px;
    border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, var(--primary), #FF7A00);
}
.px-input {
    flex: 1 1 auto; min-width: 0; height: 46px;
    display: flex; align-items: center;
    padding: 0 18px;
    border: 1.5px solid var(--border-color);
    border-radius: 999px;
    font-size: 1rem; font-weight: 500;
    color: var(--text-main);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.px-input:active { opacity: .7; }
.px-pic { flex: 0 0 auto; display: flex; padding: 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.px-pic svg { width: 26px; height: 26px; display: block; }

/* ---------- Feels card row (horizontal scroll, edge to edge) ---------- */
.px-feels {
    margin: 0 -16px;
    width: calc(100% + 32px);
    padding: 8px 0 14px;
    background: var(--surface);
    border-bottom: 6px solid var(--fb-line, var(--border-color));
}
.px-feels-strip {
    display: flex;
    gap: 8px;
    padding: 0 15px;
    scroll-padding-left: 15px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    /* The app sets touch-action: pan-y on <body>; this row is its own scroller */
    touch-action: pan-x pan-y;
}
.px-feels-strip::-webkit-scrollbar { display: none; }

.px-card {
    position: relative;
    flex: 0 0 auto;
    width: max(104px, calc((100vw - 40px) / 3.3));
    aspect-ratio: 0.54;
    border-radius: 14px;
    overflow: hidden;
    background: #111;
    cursor: pointer;
    scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease;
}
.px-card:active { transform: scale(0.97); }
.px-card > img.px-poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
}
.px-card::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
    pointer-events: none;
}
.px-ring {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--primary);
    box-sizing: border-box;
    background: #fff;
}
.px-av {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid #fff;
    box-sizing: border-box;
    background: #3a3a3a;
}
.px-meta {
    position: absolute; left: 9px; right: 9px; bottom: 9px; z-index: 2;
    color: #fff;
}
.px-title {
    font-weight: 800; font-size: .82rem; line-height: 1.22;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
}
.px-views {
    margin-top: 3px;
    font-size: .7rem; font-weight: 700; opacity: .92;
    display: flex; align-items: center; gap: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
}
.px-views i { font-size: .6rem; }

/* ---------- Feed ---------- */
#posts-feed-container { margin-top: 0; }
#posts-sentinel { height: 1px; width: 100%; }
</style>

<div class="tab-content" id="posts-tab">
    <!-- What's on your mind? -->
    <div class="px-compose" id="posts-compose">
        <div class="px-me" id="posts-me"></div>
        <div class="px-input" id="posts-compose-input">What's on your mind?</div>
        <div class="px-pic" id="posts-compose-pic" aria-label="Add photo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="#3FB950"/><circle cx="8.6" cy="8.6" r="2" fill="#fff"/><path d="M4 18.5l4.6-5.2 3.2 3.4 3.1-4.2 5.1 6z" fill="#fff"/></svg>
        </div>
    </div>

    <!-- Feels card row -->
    <div class="px-feels" id="posts-feels-wrap" style="display:none;">
        <div class="px-feels-strip" id="posts-feels-strip"></div>
    </div>

    <!-- All posts (same Facebook-style cards as Home) -->
    <div id="posts-feed-container"></div>
    <div id="posts-sentinel"></div>
</div>

<script>
(function () {
    "use strict";
    if (window.FlaynityPosts) return;

    var PAGE_SIZE = 8;          // posts drawn per batch (infinite scroll)
    var FEELS_LIMIT = 20;       // cards in the Feels row
    var list = [];              // filtered + sorted posts
    var rendered = 0;           // how many of `list` are on screen
    var lastFeelSig = null;
    var lastPostSig = null;
    var observer = null;
    var timer = 0;

    function $(id) { return document.getElementById(id); }
    function isActive() {
        var t = $('posts-tab');
        return !!(t && t.classList.contains('active'));
    }
    function esc(s) {
        return (typeof escapeHTML === 'function') ? escapeHTML(String(s == null ? '' : s))
            : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
    }
    function hiddenChannel(x) {
        try { return !!(x.userId && _fxHiddenChannels && _fxHiddenChannels.has(String(x.userId))); }
        catch (e) { return false; }
    }
    function featureOn(flag) {
        try { return (typeof isAdminFeatureEnabled === 'function') ? isAdminFeatureEnabled(flag) : true; }
        catch (e) { return true; }
    }
    function newest(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); }

    /* ---------------- data (same rules as the Home feed) ---------------- */
    function getFeels() {
        var arr = [];
        try { arr = Array.isArray(allFeels) ? allFeels.slice() : []; } catch (e) {}
        if (!featureOn('homeFeelsEnabled')) return [];
        return arr.filter(function (x) { return !hiddenChannel(x); }).sort(newest).slice(0, FEELS_LIMIT);
    }
    function getPosts() {
        var arr = [];
        try { arr = Array.isArray(allCommunityPosts) ? allCommunityPosts.slice() : []; } catch (e) {}
        if (!featureOn('homePostsEnabled')) return [];
        return arr.filter(function (x) { return !hiddenChannel(x); }).sort(newest);
    }

    /* ---------------- Feels card row ---------------- */
    function renderFeels() {
        var wrap = $('posts-feels-wrap'), strip = $('posts-feels-strip');
        if (!wrap || !strip) return;
        var feels = getFeels();
        var sig = feels.map(function (f) { return f.id; }).join(',');
        if (sig === lastFeelSig) return;
        lastFeelSig = sig;

        if (!feels.length) { strip.innerHTML = ''; wrap.style.display = 'none'; return; }
        wrap.style.display = '';

        var uids = {};
        strip.innerHTML = feels.map(function (s) {
            if (s.userId) uids[s.userId] = 1;
            return '<div class="px-card" data-id="' + esc(s.id) + '">' +
                '<img class="px-poster" src="' + esc(s.poster || '') + '" loading="lazy" alt="">' +
                '<div class="px-ring"><div class="px-av live-avatar-' + esc(s.userId || '') + '"></div></div>' +
                '<div class="px-meta">' +
                    '<div class="px-title">' + esc(s.title || '') + '</div>' +
                    '<div class="px-views"><i class="fas fa-play"></i><span id="px-views-' + esc(s.id) + '">0</span></div>' +
                '</div>' +
            '</div>';
        }).join('');

        Object.keys(uids).forEach(function (u) {
            try { bindLiveChannelUI(u); } catch (e) {}
        });
        feels.forEach(function (s) {
            try {
                db.ref('movie_stats/' + s.id + '/views').once('value', function (snap) {
                    var label = document.getElementById('px-views-' + s.id);
                    if (label) label.innerText = (typeof formatCount === 'function')
                        ? formatCount(Object.keys(snap.val() || {}).length)
                        : String(Object.keys(snap.val() || {}).length);
                });
            } catch (e) {}
        });
    }

    /* ---------------- Post feed ---------------- */
    function drawPosts(from, to) {
        var box = $('posts-feed-container');
        if (!box || typeof renderSinglePostSegmentUI !== 'function') return;
        var slice = list.slice(from, to);
        var html = '', uids = {};
        slice.forEach(function (p) {
            if (p.userId) uids[p.userId] = 1;
            html += renderSinglePostSegmentUI(p);
        });
        box.insertAdjacentHTML('beforeend', html);
        Object.keys(uids).forEach(function (u) { try { bindLiveChannelUI(u); } catch (e) {} });
        slice.forEach(function (p) { try { registerPostReactionsListener(p.id); } catch (e) {} });
    }

    function renderPosts() {
        var box = $('posts-feed-container');
        if (!box) return;
        list = getPosts();
        var sig = list.map(function (p) { return p.id; }).join(',');
        if (sig === lastPostSig && box.children.length) return;   // nothing new: keep scroll as is
        lastPostSig = sig;

        var keep = Math.max(rendered, PAGE_SIZE);
        rendered = 0;
        box.innerHTML = '';

        if (!list.length) {
            box.innerHTML = (typeof getHomeSkeletonHTML === 'function') ? getHomeSkeletonHTML() : '';
            return;
        }
        var end = Math.min(keep, list.length);
        drawPosts(0, end);
        rendered = end;
        watch();
    }

    function loadMore() {
        if (rendered >= list.length) return;
        var end = Math.min(rendered + PAGE_SIZE, list.length);
        drawPosts(rendered, end);
        rendered = end;
        watch();
    }

    function watch() {
        var s = $('posts-sentinel');
        if (!s || !('IntersectionObserver' in window)) return;
        if (!observer) {
            observer = new IntersectionObserver(function (entries) {
                if (isActive() && entries.some(function (e) { return e.isIntersecting; })) loadMore();
            }, { rootMargin: '900px 0px' });
        } else {
            observer.unobserve(s);   // re-observe so a still-visible sentinel fires again
        }
        observer.observe(s);
    }

    /* ---------------- composer ---------------- */
    function renderComposer() {
        var me = $('posts-me');
        if (!me) return;
        var uid = null;
        try { uid = auth.currentUser && auth.currentUser.uid; } catch (e) {}
        if (!uid) return;
        me.className = 'px-me live-avatar-' + uid;
        try { bindLiveChannelUI(uid); } catch (e) {}
    }
    function openComposer() {
        if (typeof openCreateBottomSheet !== 'function') return;
        openCreateBottomSheet();
        try {
            var studio = document.getElementById('premium-upload-studio');
            if (studio && studio.style.display === 'flex' && typeof switchUploadMode === 'function') switchUploadMode('post');
        } catch (e) {}
    }
    ['posts-compose-input', 'posts-compose-pic'].forEach(function (id) {
        var el = $(id);
        if (el) el.addEventListener('click', openComposer);
    });
    try { auth.onAuthStateChanged(function () { renderComposer(); }); } catch (e) {}

    /* ---------------- refresh / hooks ---------------- */
    function refresh() {
        if (!isActive()) return;
        renderComposer();
        renderFeels();
        renderPosts();
    }
    function schedule() {
        if (!isActive()) return;
        clearTimeout(timer);
        timer = setTimeout(refresh, 150);
    }

    // Feels card tap -> open it in the Feels player (same as Home Feels cards).
    var strip = $('posts-feels-strip');
    if (strip) {
        strip.addEventListener('click', function (e) {
            var card = e.target.closest ? e.target.closest('.px-card') : null;
            if (!card) return;
            var id = card.getAttribute('data-id');
            if (id && typeof openShortFromHome === 'function') openShortFromHome(id);
        });
    }

    // Draw whenever the Posts tab is opened.
    window.addEventListener('flaynity-tab-changed', function () { if (isActive()) refresh(); });
    window.addEventListener('online', schedule);

    // Firebase data lands -> Home feed rebuilds; follow it so Posts stays live.
    try {
        if (typeof buildHomeFeed === 'function' && !buildHomeFeed.__flaynityPosts) {
            var original = buildHomeFeed;
            var wrapped = function () {
                var result = original.apply(this, arguments);
                schedule();
                return result;
            };
            wrapped.__flaynityPosts = true;
            window.buildHomeFeed = wrapped;
        }
    } catch (e) {}

    window.FlaynityPosts = { refresh: refresh };
})();
</script>
