<style>
    .shorts-container {
        width: 100%; height: 100%; background: #000000; color: #ffffff;
        position: relative; overflow: hidden;
    }
    
    /* Scroll Snapping for Vertical Swipe */
    .shorts-feed {
        width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
        scroll-behavior: smooth; padding-bottom: 60px; /* Bottom Nav Space */
    }
    .shorts-feed::-webkit-scrollbar { display: none; }
    
    /* Individual Short Container */
    .short-item {
        width: 100%; height: 100%; scroll-snap-align: start; position: relative;
    }
    
    .short-video {
        width: 100%; height: 100%; object-fit: cover;
    }

    /* Overlays */
    .short-overlay-bottom {
        position: absolute; bottom: 80px; left: 16px; right: 70px; z-index: 10;
    }
    .short-title { font-size: 15px; font-weight: 400; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .short-channel { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .channel-avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; }
    .channel-name { font-weight: 600; font-size: 14px; }
    .btn-subscribe-short { background: #ffffff; color: #000; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; border: none; }

    /* Right Action Sidebar */
    .short-sidebar {
        position: absolute; bottom: 80px; right: 12px; z-index: 10;
        display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .action-btn {
        display: flex; flex-direction: column; align-items: center; gap: 4px; color: white;
    }
    .action-btn .material-symbols-rounded { font-size: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .action-text { font-size: 12px; font-weight: 500; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    
    /* Top Bar Over Shorts */
    .shorts-header {
        position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
        display: flex; justify-content: space-between;
    }
</style>

<div class="shorts-container">
