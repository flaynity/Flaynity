<style>
    .shorts-container {
        width: 100vw; height: calc(100vh - var(--nav-height));
        background-color: var(--bg-primary); overflow-y: scroll;
        scroll-snap-type: y mandatory; -ms-overflow-style: none; scrollbar-width: none;
    }
    .shorts-container::-webkit-scrollbar { display: none; }

    .short-wrapper {
        width: 100vw; height: 100%; scroll-snap-align: start; position: relative;
        background-color: #000; display: flex; justify-content: center; align-items: center;
    }
    
    /* Video Element (Intelligent Fitting) */
    .short-video { width: 100%; height: 100%; object-fit: contain; }

    /* Right Action Bar */
    .short-actions {
        position: absolute; right: 12px; bottom: 100px;
        display: flex; flex-direction: column; align-items: center; gap: 24px; z-index: 10;
    }
    .action-item {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        color: white; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8)); cursor: pointer;
    }
    .action-item .material-symbols-outlined { font-size: 36px; transition: transform 0.2s; }
    .action-item:active .material-symbols-outlined { transform: scale(0.8); }
    .action-text { font-size: 13px; font-weight: 600; }

    /* Music Disc */
    .music-disc {
        width: 46px; height: 46px; border-radius: 50%; background: #222;
        border: 4px solid #444; animation: spin 4s linear infinite;
        display: flex; justify-content: center; align-items: center; margin-top: 8px;
    }
    .music-disc img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .music-disc.paused { animation-play-state: paused; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Bottom Info Bar */
    .short-info {
        position: absolute; bottom: 16px; left: 16px; right: 80px; z-index: 10;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); color: white;
    }
    .short-channel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .short-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
    .short-channel-name { font-size: 15px; font-weight: 700; }
    .btn-short-sub { background: white; color: black; padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; border: none; }
    .short-title { font-size: 14px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Animations */
    .play-pause-overlay {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 64px; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.4);
        border-radius: 50%; padding: 16px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 15;
    }
    
    /* Double Tap Heart Animation */
    .floating-heart {
        position: absolute; font-size: 80px; color: var(--accent-color);
        top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
        opacity: 0; pointer-events: none; z-index: 20;
    }
    @keyframes likeHeartAnim {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
        15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        70% { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1.5) translateY(-50px); opacity: 0; }
    }
</style>

<div class="shorts-container" id="shorts-scroll">
    <!-- Shorts Injected via JS -->
</div>

<script>
    (function() {
        const container = document.getElementById('shorts-scroll');

        // Observer for Auto Play/Pause when scrolling
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                const disc = entry.target.querySelector('.music-disc');
                if(entry.isIntersecting) {
                    video.play().catch(e => console.log("Autoplay blocked"));
                    if(disc) disc.classList.remove('paused');
                } else {
                    video.pause(); video.currentTime = 0;
                    if(disc) disc.classList.add('paused');
                }
            });
        }, { threshold: 0.7 });

        function loadMockShort() {
            const wrapper = document.createElement('div');
            wrapper.className = 'short-wrapper';
            wrapper.innerHTML = `
                <video class="short-video" src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline></video>
                <span class="material-symbols-outlined play-pause-overlay">play_arrow</span>
                <span class="material-symbols-outlined floating-heart" font-variation-settings="'FILL' 1">favorite</span>
                
                <div class="short-actions">
                    <div class="action-item" onclick="toggleShortLike(this)">
                        <span class="material-symbols-outlined short-like-icon">favorite</span>
                        <span class="action-text">1.4M</span>
                    </div>
                    <div class="action-item">
                        <span class="material-symbols-outlined">chat</span>
                        <span class="action-text">45K</span>
                    </div>
                    <div class="action-item">
                        <span class="material-symbols-outlined">download</span>
                        <span class="action-text">Save</span>
                    </div>
                    <div class="music-disc paused">
                        <img src="https://via.placeholder.com/100/1A1A1A/FFF">
                    </div>
                </div>

                <div class="short-info">
                    <div class="short-channel-row">
                        <img src="https://via.placeholder.com/100/FF1744/FFF" class="short-avatar">
                        <span class="short-channel-name">@FlaynityCreators</span>
                        <button class="btn-short-sub">Subscribe</button>
                    </div>
                    <div class="short-title">Look at this amazing cinematic transition! #shorts #flaynity</div>
                </div>
            `;

            // Video Tap Logic (Single: Play/Pause, Double: Like)
            const video = wrapper.querySelector('video');
            const overlay = wrapper.querySelector('.play-pause-overlay');
            const disc = wrapper.querySelector('.music-disc');
            const heartAnim = wrapper.querySelector('.floating-heart');
            const likeBtn = wrapper.querySelector('.action-item');
            
            let lastTap = 0;
            video.addEventListener('click', (e) => {
                const now = new Date().getTime();
                if(now - lastTap < 300) {
                    // Double Tap
                    e.preventDefault();
                    heartAnim.style.animation = 'none';
                    setTimeout(() => heartAnim.style.animation = 'likeHeartAnim 0.8s forwards', 10);
                    // Also trigger the like button visually
                    const icon = likeBtn.querySelector('.short-like-icon');
                    icon.style.fontVariationSettings = "'FILL' 1";
                    icon.style.color = "var(--accent-color)";
                } else {
                    // Single Tap
                    if(video.paused) { video.play(); overlay.innerText = 'play_arrow'; disc.classList.remove('paused'); }
                    else { video.pause(); overlay.innerText = 'pause'; disc.classList.add('paused'); }
                    overlay.style.opacity = '1';
                    setTimeout(() => overlay.style.opacity = '0', 800);
                }
                lastTap = now;
            });

            container.appendChild(wrapper);
            observer.observe(wrapper);
        }

        window.toggleShortLike = function(el) {
            const icon = el.querySelector('.short-like-icon');
            if(icon.style.fontVariationSettings.includes('1')) {
                icon.style.fontVariationSettings = "'FILL' 0"; icon.style.color = "white";
            } else {
                icon.style.fontVariationSettings = "'FILL' 1"; icon.style.color = "var(--accent-color)";
            }
        };

        // Load 3 mock shorts
        loadMockShort(); loadMockShort(); loadMockShort();
    })();
</script>
