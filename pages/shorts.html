<div class="fl-shorts-root">
  <!-- Shorts Full-screen Vertical Feed -->
  <div id="fl-shorts-snap-container" class="fl-shorts-slider">
    <!-- Shorts are dynamically injected here -->
    <div id="fl-shorts-loading-indicator" class="fl-shorts-loader">
      <div class="fl-spinner-white"></div>
    </div>
  </div>

  <!-- Shorts Comments Bottom Sheet -->
  <div id="fl-shorts-comment-sheet" class="fl-bottom-sheet-backdrop hidden">
    <div class="fl-bottom-sheet fl-sheet-tall">
      <div class="fl-sheet-handle"></div>
      <div class="fl-sheet-header">
        <h3>Comments <span id="fl-shorts-comments-count">0</span></h3>
        <button class="fl-icon-btn" onclick="FlaynityShorts.closeComments()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="fl-shorts-comments-list" class="fl-comments-scroll-area"></div>
      <div class="fl-comment-input-bar">
        <input type="text" id="fl-short-comment-input" placeholder="Add a comment..." />
        <button id="fl-btn-short-send-comment" class="fl-icon-btn" onclick="FlaynityShorts.sendComment()">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Double-Tap Heart Animation Container -->
  <div id="fl-double-tap-heart" class="fl-heart-pop-wrap hidden">
    <span class="material-symbols-outlined fl-heart-pop">favorite</span>
  </div>

  <!-- Fixed Bottom Navigation Bar (Persistent across pages) -->
  <nav class="fl-bottom-nav">
    <button class="fl-nav-item" onclick="FlaynityNav.navigateTo('home')">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </button>
    <button class="fl-nav-item active" onclick="FlaynityNav.navigateTo('shorts')">
      <span class="material-symbols-outlined filled">play_circle</span>
      <span>Shorts</span>
    </button>
    <button class="fl-nav-item fl-nav-create-btn" onclick="FlaynityNav.navigateTo('upload')">
      <div class="fl-plus-icon-circle">
        <span class="material-symbols-outlined">add</span>
      </div>
    </button>
    <button class="fl-nav-item" onclick="FlaynityNav.navigateTo('discover')">
      <span class="material-symbols-outlined">explore</span>
      <span>Discover</span>
    </button>
    <button class="fl-nav-item" onclick="FlaynityNav.navigateTo('you')">
      <span class="material-symbols-outlined">person</span>
      <span>You</span>
    </button>
  </nav>
</div>

<style>
  /* ==========================================================================
     SHORTS FULL-SCREEN DEDICATED STYLES
     ========================================================================== */
  .fl-shorts-root {
    width: 100%;
    height: 100vh;
    background: #000000;
    position: relative;
    overflow: hidden;
  }

  .fl-shorts-slider {
    width: 100%;
    height: calc(100vh - var(--fl-bottom-nav-height));
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .fl-short-item-slide {
    width: 100%;
    height: 100%;
    position: relative;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }

  .fl-short-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Right-hand Action Column */
  .fl-short-actions-bar {
    position: absolute;
    right: 12px;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .fl-short-action-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
  }

  .fl-short-action-pill .material-symbols-outlined {
    font-size: 30px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  .fl-short-action-pill span {
    font-size: 11px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .fl-short-avatar-pill {
    position: relative;
    width: 44px;
    height: 44px;
    margin-bottom: 6px;
  }

  .fl-short-avatar-pill img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid #FFFFFF;
    object-fit: cover;
  }

  .fl-short-sub-badge {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--fl-primary);
    color: #FFF;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  /* Sound spinning disc animation */
  .fl-short-disc {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #1F1F1F;
    border: 3px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fl-disc-spin 3s linear infinite;
  }

  /* Bottom Metadata Details */
  .fl-short-meta-bottom {
    position: absolute;
    bottom: 16px;
    left: 14px;
    right: 70px;
    z-index: 10;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .fl-short-user-handle {
    font-size: 14px;
    font-weight: 700;
  }

  .fl-short-caption {
    font-size: 13px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .fl-short-music-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    opacity: 0.9;
  }

  /* Double-tap Heart Pop */
  .fl-heart-pop-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 999;
    pointer-events: none;
  }

  .fl-heart-pop {
    font-size: 90px !important;
    color: var(--fl-primary);
    font-variation-settings: 'FILL' 1 !important;
    animation: fl-heart-animate 0.6s ease-out forwards;
  }

  .fl-shorts-loader {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fl-spinner-white {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: fl-spin 0.8s linear infinite;
  }

  @keyframes fl-disc-spin { to { transform: rotate(360deg); } }
  @keyframes fl-heart-animate {
    0% { transform: scale(0.2); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
</style>

<script>
  /**
   * FLAYNITY SHORTS CONTROLLER
   * Snap scrolling, Video Play/Pause Management, Realtime Likes & Comments
   */
  window.FlaynityShorts = (function() {
    let shortsData = [];
    let currentShortId = null;
    let observer = null;
    let lastTapTime = 0;

    function init() {
      loadShorts();
    }

    function loadShorts() {
      if (!window.FlaynityDB) {
        setTimeout(loadShorts, 300);
        return;
      }

      window.FlaynityDB.ref('shorts').limitToLast(20).once('value', snapshot => {
        const slider = document.getElementById('fl-shorts-snap-container');
        slider.innerHTML = '';
        shortsData = [];

        snapshot.forEach(child => {
          shortsData.unshift({ id: child.key, ...child.val() });
        });

        if (shortsData.length === 0) {
          slider.innerHTML = `<div style="color:#FFF; display:flex; height:100%; align-items:center; justify-content:center;">No Shorts available.</div>`;
          return;
        }

        shortsData.forEach((short, idx) => {
          slider.appendChild(createShortSlide(short, idx));
        });

        setupIntersectionObserver();
      });
    }

    function createShortSlide(short, index) {
      const slide = document.createElement('div');
      slide.className = 'fl-short-item-slide';
      slide.dataset.id = short.id;

      slide.innerHTML = `
        <video class="fl-short-video" src="${short.videoUrl}" loop playsinline preload="metadata" data-index="${index}"></video>
        
        <!-- Right Action Column -->
        <div class="fl-short-actions-bar">
          <div class="fl-short-avatar-pill">
            <img src="${short.channelAvatar || 'https://via.placeholder.com/44'}" />
            <div class="fl-short-sub-badge">+</div>
          </div>
          <button class="fl-short-action-pill" onclick="FlaynityShorts.toggleLike('${short.id}')">
            <span class="material-symbols-outlined" id="short-like-icon-${short.id}">favorite</span>
            <span id="short-like-count-${short.id}">${formatViews(short.likes || 0)}</span>
          </button>
          <button class="fl-short-action-pill" onclick="FlaynityShorts.openComments('${short.id}')">
            <span class="material-symbols-outlined">chat_bubble</span>
            <span>${formatViews(short.comments || 0)}</span>
          </button>
          <button class="fl-short-action-pill" onclick="FlaynityShorts.shareShort('${short.id}')">
            <span class="material-symbols-outlined">share</span>
            <span>Share</span>
          </button>
          <div class="fl-short-disc">
            <span class="material-symbols-outlined" style="font-size:18px;">music_note</span>
          </div>
        </div>

        <!-- Bottom Description -->
        <div class="fl-short-meta-bottom">
          <span class="fl-short-user-handle">${escapeHtml(short.channelHandle || '@creator')}</span>
          <p class="fl-short-caption">${escapeHtml(short.title || '')}</p>
          <div class="fl-short-music-tag">
            <span class="material-symbols-outlined" style="font-size:14px;">music_note</span>
            <span>${escapeHtml(short.audioTitle || 'Original Audio')}</span>
          </div>
        </div>
      `;

      // Tap for pause/play & Double-tap for heart pop
      slide.addEventListener('click', (e) => {
        if (e.target.closest('.fl-short-actions-bar')) return;
        const now = Date.now();
        if (now - lastTapTime < 300) {
          triggerDoubleTapHeart(short.id);
        } else {
          const video = slide.querySelector('video');
          if (video.paused) video.play(); else video.pause();
        }
        lastTapTime = now;
      });

      return slide;
    }

    function setupIntersectionObserver() {
      if (observer) observer.disconnect();

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (entry.isIntersecting) {
            video.play().catch(() => {});
            currentShortId = entry.target.dataset.id;
            // Record Unique View in Firebase
            if (window.FlaynityDB && currentShortId) {
              window.FlaynityDB.ref(`shorts/${currentShortId}/views`).transaction(v => (v || 0) + 1);
            }
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.65 });

      document.querySelectorAll('.fl-short-item-slide').forEach(slide => observer.observe(slide));
    }

    function triggerDoubleTapHeart(shortId) {
      const heart = document.getElementById('fl-double-tap-heart');
      heart.classList.remove('hidden');
      toggleLike(shortId, true);
      setTimeout(() => heart.classList.add('hidden'), 600);
    }

    function toggleLike(shortId, forceLike = false) {
      if (!window.FlaynityAuth?.currentUser) {
        document.getElementById('fl-auth-modal')?.classList.remove('hidden');
        return;
      }
      const uid = window.FlaynityAuth.currentUser.uid;
      const ref = window.FlaynityDB.ref(`shorts/${shortId}/likes/${uid}`);
      ref.transaction(curr => {
        if (curr && !forceLike) return null;
        return true;
      });
    }

    function openComments(shortId) {
      currentShortId = shortId;
      document.getElementById('fl-shorts-comment-sheet').classList.remove('hidden');
      loadShortComments(shortId);
    }

    function closeComments() {
      document.getElementById('fl-shorts-comment-sheet').classList.add('hidden');
    }

    function loadShortComments(shortId) {
      const list = document.getElementById('fl-shorts-comments-list');
      list.innerHTML = '<div class="fl-spinner-small"></div>';
      window.FlaynityDB.ref(`shorts/${shortId}/commentsList`).limitToLast(30).on('value', snap => {
        list.innerHTML = '';
        snap.forEach(c => {
          const val = c.val();
          const item = document.createElement('div');
          item.className = 'fl-comment-item';
          item.innerHTML = `
            <img class="fl-avatar-small" src="${val.userAvatar || 'https://via.placeholder.com/28'}" />
            <div>
              <div class="fl-comment-meta">${escapeHtml(val.userName || 'User')}</div>
              <div style="font-size:12px; color:#111;">${escapeHtml(val.text || '')}</div>
            </div>
          `;
          list.appendChild(item);
        });
      });
    }

    function sendComment() {
      const input = document.getElementById('fl-short-comment-input');
      const text = input.value.trim();
      if (!text || !currentShortId || !window.FlaynityAuth?.currentUser) return;

      const user = window.FlaynityAuth.currentUser;
      window.FlaynityDB.ref(`shorts/${currentShortId}/commentsList`).push({
        userId: user.uid,
        userName: user.displayName || 'Creator',
        userAvatar: user.photoURL || '',
        text: text,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
      window.FlaynityDB.ref(`shorts/${currentShortId}/comments`).transaction(c => (c || 0) + 1);
      input.value = '';
    }

    function formatViews(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toString();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
    }

    return {
      init,
      toggleLike,
      openComments,
      closeComments,
      sendComment,
      shareShort: (id) => {
        if (navigator.share) navigator.share({ title: 'Flaynity Short', url: window.location.href });
      }
    };
  })();

  FlaynityShorts.init();
</script>
