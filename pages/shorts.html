<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF" id="flaynity-theme-color">
<script>(function(){var m=document.getElementById('flaynity-theme-color');var dark='#0F0F0F';var light='#FFFFFF';function sync(){var t=localStorage.getItem('flaynity-theme-pref')||'light';if(m)m.setAttribute('content',t==='dark'?dark:light);}sync();})();</script><title>Flaynity</title>
<style>
/* SHORTS TAB CONFIGURATIONS ( TikTok Premium Player Layout ) */
        #shorts-tab {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 48px); 
            background: #0F0F0F !important;
            color: #FFFFFF !important;
            z-index: 500;
            overflow: hidden;
        }
        .shorts-swiper {
            height: 100%; width: 100%; overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-snap-stop: always;
            scrollbar-width: none;
        }
        .shorts-swiper::-webkit-scrollbar { display: none; }
        
        .short-slide {
            height: 100%; width: 100%; scroll-snap-align: start;
            scroll-snap-stop: always; position: relative; background: #0F0F0F !important;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        
        .short-video-el { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            background: transparent; 
            margin: auto;
        }

/* Shorts Action Button Overlays */
        .short-right-actions {
            position: absolute; right: 12px; bottom: 54px !important; 
            display: flex; flex-direction: column; gap: 16px; z-index: 10; align-items: center;
        }
        .short-action-container { display: flex; flex-direction: column; align-items: center; }
        
        .short-action-btn-tiktok {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            width: 48px; height: 48px; display: flex;
            align-items: center; justify-content: center; font-size: 2.2rem !important;
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: none !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .short-action-btn-tiktok:active { transform: scale(0.8) rotate(-15deg); }
        .short-action-btn-tiktok i.liked {
            color: #FF2E55 !important;
            animation: tiktokHeartPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
        }
        @keyframes tiktokHeartPop {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1.0); }
        }

        .short-action-btn-tiktok-other {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            width: 48px; height: 48px; display: flex;
            align-items: center; justify-content: center; font-size: 2.0rem !important;
            cursor: pointer; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: none !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .short-action-btn-tiktok-other:active { transform: scale(0.85); }
        
        .short-action-label-tiktok {
            color: #ffffff !important;
            font-size: 0.75rem;
            font-weight: 800;
            margin-top: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

/* Bottom Information Overlays */
        .short-bottom-info {
            position: absolute;
            bottom: 54px !important; 
            left: 12px;
            right: 76px;
            z-index: 10;
            color: #ffffff !important;
            text-shadow: 0 1px 4px rgba(0, 15, 30, 0.8);
        }
        .short-channel-handle {
            color: #FFFFFF !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8) !important;
        }
        .short-title-text {
            color: #FFFFFF !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8) !important;
        }
        .short-subscribe-btn {
            background: var(--primary) !important;
            border: none; color: #fff !important; padding: 6px 14px;
            border-radius: 20px; font-weight: 800; font-size: 0.78rem; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .short-subscribe-btn:active { transform: scale(0.95); }

/* YouTube-like Progress Bar */
        .short-progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 15;
            cursor: pointer;
        }
        .short-progress-bar {
            width: 0%;
            height: 100%;
            background: #FF2E55;
            transition: width 0.1s linear;
        }

/* Double Tap Heart Animation Styles */
        .double-tap-heart {
            position: absolute;
            color: #FF2E55;
            font-size: 11rem !important; 
            z-index: 100;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: heartPopAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 6px 25px rgba(0,0,0,0.45);
        }
        @keyframes heartPopAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(1) rotate(10deg); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.6) translateY(-60px); opacity: 0; }
        }

/* Shorts Expandable Description bottom sheet */
        .short-expandable-panel {
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 16px; margin-top: 10px; display: none;
            border: 1px solid rgba(255,255,255,0.1); max-height: 200px; overflow-y: auto;
            animation: slideUpFast 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUpFast { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* =========================================================
           UPDATED PREMIUM SHORTS CUSTOM DESIGN EXTENSIONS
           ========================================================= */
        video::-webkit-media-controls {
            display: none !important;
        }
        video::-webkit-media-controls-start-playback-button {
            display: none !important;
            -webkit-appearance: none;
        }

/* Centered Dynamic Buffer Indicator */
        @keyframes spinnerSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .short-buffer-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #FF2E55;
            border-radius: 50%;
            animation: spinnerSpin 0.8s linear infinite;
            display: none;
            z-index: 18;
            pointer-events: none;
        }

/* Centered Play/Pause Interaction Overlays */
        .short-play-pause-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .short-play-pause-overlay.animate-pop {
            animation: ppPopIcon 0.8s ease forwards;
        }
        @keyframes ppPopIcon {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            40% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

/* Premium Rotating Music Disc Under Download */
        .music-disc-container {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #222;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .music-disc-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #333;
            animation: rotateDisc 5s linear infinite;
            animation-play-state: paused;
        }
        .music-disc-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes rotateDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
</style></head><body>
<div class="tab-content" id="shorts-tab" style="padding:0;">
<div id="shorts-swiper-container" style="height:100%; width:100%;"></div>
</div>
<div class="premium-download-modal" id="short-desc-bottom-sheet" style="z-index: 1900;">
<div class="premium-download-content" style="max-height: 50vh;">
<div class="drag-handle-line" id="short-desc-drag-handle"></div>
<div class="download-modal-header">
<h3>Description</h3>
<button class="close-download-modal" onclick="closeShortDescBottomSheet()"><i class="fas fa-times"></i></button>
</div>
<div class="download-modal-scrollable" style="padding-bottom: 24px;">
<h2 id="short-sheet-full-title" style="font-size: 1.15rem; font-weight: 800; margin: 0 0 8px 0; color: var(--text-main);">Title</h2>
<p id="short-sheet-hashtags" style="font-size: 0.9rem; color: var(--primary); font-weight: 700; margin: 0 0 12px 0;">Hashtags</p>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: var(--bg-color); padding: 12px; border-radius: 12px; margin-bottom: 16px;">
<div style="text-align: center;">
<span style="font-size: 0.72rem; color: var(--text-muted); display: block; font-weight: 700;">Views</span>
<span id="short-sheet-views" style="font-size: 0.95rem; font-weight: 800; color: var(--text-main);">0</span>
</div>
<div style="text-align: center; border-left: 1px solid var(--glass-border); border-right: 1px solid var(--glass-border);">
<span style="font-size: 0.72rem; color: var(--text-muted); display: block; font-weight: 700;">Likes</span>
<span id="short-sheet-likes" style="font-size: 0.95rem; font-weight: 800; color: var(--text-main);">0</span>
</div>
<div style="text-align: center;">
<span style="font-size: 0.72rem; color: var(--text-muted); display: block; font-weight: 700;">Uploaded</span>
<span id="short-sheet-uploaded" style="font-size: 0.95rem; font-weight: 800; color: var(--text-main);">Just Now</span>
</div>
</div>
<p id="short-sheet-description" style="font-size: 0.9rem; line-height: 1.5; color: var(--text-muted); white-space: pre-wrap; margin: 0;"></p>
</div>
</div>
</div>
</body></html>
