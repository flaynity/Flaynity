<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flaynity Studio</title>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━
   PREMIUM STUDIO CSS
━━━━━━━━━━━━━━━━━━━━━━ */
.studio-btn { background: var(--primary); color: white; border: none; border-radius: 24px; padding: 16px 24px; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 8px 24px var(--primary-glow); transition: 0.2s; }
.studio-btn:active { transform: scale(0.96); }

.mode-slider-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); z-index: 100; }
.mode-slider { display: flex; gap: 40px; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); align-items: center; white-space: nowrap; }
.mode-item { padding: 10px 24px; border-radius: 30px; font-weight: 800; font-size: 1.15rem; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.5); }
.mode-item.active { background: #333333; color: #FFFFFF; }

.camera-ctrl-btn { background: rgba(0,0,0,0.4); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); }

.timeline-wrap { position: relative; height: 50px; background: #222; border-radius: 8px; margin: 16px 0; overflow: hidden; border: 2px solid #444; }
.timeline-playhead { position: absolute; top: 0; bottom: 0; width: 3px; background: white; z-index: 10; box-shadow: 0 0 8px rgba(255,255,255,0.8); pointer-events: none; }
.timeline-handle-start, .timeline-handle-end { position: absolute; top: 0; bottom: 0; width: 16px; background: var(--primary); z-index: 11; cursor: ew-resize; }
.timeline-handle-start { left: 0; border-radius: 6px 0 0 6px; }
.timeline-handle-end { right: 0; border-radius: 0 6px 6px 0; }
.timeline-frames { display: flex; width: 100%; height: 100%; opacity: 0.5; background: repeating-linear-gradient(45deg, #111, #111 10px, #222 10px, #222 20px); }

.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
.form-input, .form-textarea, .form-select { width: 100%; background: var(--surface); border: 1.5px solid var(--glass-border); padding: 16px; border-radius: 16px; font-size: 1rem; font-weight: 600; color: var(--text-main); outline: none; transition: 0.2s; box-sizing: border-box; }
.form-textarea { height: 120px; resize: none; }
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

.topbar-nav { display: flex; justify-content: space-between; padding: 16px; align-items: center; background: rgba(0,0,0,0.4); position: absolute; top: 0; left: 0; right: 0; z-index: 50; }
.topbar-nav.solid { background: var(--surface); border-bottom: 1px solid var(--border-color); position: relative; }
</style>
</head>
<body>

<!-- Hidden Native File Inputs -->
<input accept="video/mp4, video/quicktime, video/mkv, video/webm" id="video-file-input" style="display:none;" type="file" onchange="handleVideoOrShortSelected(this.files[0], 'video-long')"/>
<input accept="video/mp4, video/quicktime, video/mkv, video/webm" id="short-file-input" style="display:none;" type="file" onchange="handleVideoOrShortSelected(this.files[0], 'video-short')"/>
<input accept="image/jpeg, image/png, image/webp" id="post-image-input" style="display:none;" type="file" onchange="handlePostImageSelected(this.files[0])"/>
<input accept="image/jpeg, image/png, image/webp" id="custom-thumb-input" style="display:none;" type="file" onchange="handleCustomThumbSelected(event)"/>

<!-- ━━━━━━━━━━━━━━━━━━━━━━
   1. MAIN PREMIUM UPLOAD STUDIO
━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="premium-upload-studio" class="fullscreen-page" style="display: none; background: #000; color: #fff; z-index: 9999;">
    
    <div id="upload-dynamic-area" style="position: absolute; top: 0; left: 0; right: 0; bottom: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; padding-top: 40px;">
        
        <!-- VIDEO SELECTOR VIEW -->
        <div id="upload-video-view" style="display: none; width: 100%; height: 100%; max-width: 400px; max-height: 600px; aspect-ratio: 2/3; background: #111; border-radius: 24px; position: relative; overflow: hidden;">
            <div style="padding: 20px; display: flex; align-items: center; justify-content: space-between; background: #1A1A1A;">
                <button onclick="closePremiumUploadStudio()" style="background: none; color: white; font-size: 1.5rem; border: none; cursor: pointer;"><i class="fas fa-times"></i></button>
                <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800;">Videos</h3>
                <div style="width: 24px;"></div>
            </div>
            <div style="padding: 24px; text-align: center; height: calc(100% - 70px); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <i class="fas fa-film" style="font-size: 3rem; color: #555; margin-bottom: 16px;"></i>
                <p style="color: #888; font-size: 0.95rem; font-weight: 600; margin-bottom: 24px;">Select a video from your device to upload.</p>
                <button class="studio-btn" style="width: 100%;" onclick="document.getElementById('video-file-input').click()">Browse Device Videos</button>
            </div>
        </div>

        <!-- SHORT CAMERA VIEW -->
        <div id="upload-short-view" style="display: none; width: 100%; height: 100%; max-width: 400px; max-height: 711px; aspect-ratio: 9/16; background: #111; border-radius: 24px; position: relative; overflow: hidden;">
            <video id="short-camera-preview" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            
            <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center;">
                <button onclick="closePremiumUploadStudio()" style="background: rgba(0,0,0,0.4); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer;"><i class="fas fa-times"></i></button>
                <button style="background: rgba(0,0,0,0.4); color: white; border: none; padding: 10px 20px; border-radius: 24px; font-weight: 800; font-size: 0.95rem; cursor: pointer;"><i class="fas fa-music"></i> Add Sound</button>
                <div style="width: 44px;"></div>
            </div>

            <div style="position: absolute; right: 16px; top: 80px; display: flex; flex-direction: column; gap: 16px; align-items: center;">
                <button onclick="toggleShortCamera()" class="camera-ctrl-btn"><i class="fas fa-sync"></i></button>
                <button class="camera-ctrl-btn"><i class="fas fa-bolt"></i></button>
                <button class="camera-ctrl-btn"><i class="fas fa-stopwatch"></i></button>
                <button class="camera-ctrl-btn" style="font-size: 0.9rem; font-weight: 800;">15s</button>
                <button class="camera-ctrl-btn" style="font-size: 0.9rem; font-weight: 800;">1x</button>
            </div>

            <div style="position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; align-items: center;">
                <button onclick="document.getElementById('short-file-input').click()" style="position: absolute; left: 30px; background: rgba(0,0,0,0.4); color: white; border: none; width: 44px; height: 44px; border-radius: 12px; font-size: 1.2rem; cursor: pointer;"><i class="fas fa-image"></i></button>
                
                <div id="record-btn-outer" style="width: 76px; height: 76px; border-radius: 50%; border: 4px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <div id="record-btn-inner" style="width: 60px; height: 60px; border-radius: 50%; background: #FF2E55; transition: 0.2s;"></div>
                </div>

                <button id="record-done-btn" style="display: none; position: absolute; right: 30px; background: white; color: black; border: none; padding: 12px 20px; border-radius: 24px; font-weight: 800; cursor: pointer;">Done</button>
            </div>
        </div>

        <!-- POST SELECTOR VIEW -->
        <div id="upload-post-view" style="display: none; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <button class="studio-btn" style="max-width: 250px; font-size: 1.1rem; padding: 18px 30px;" onclick="document.getElementById('post-image-input').click()"><i class="fas fa-image"></i> Pick Image</button>
        </div>
    </div>

    <!-- YouTube Style Mode Selector -->
    <div class="mode-slider-wrap">
        <div id="mode-slider" class="mode-slider">
            <div class="mode-item" data-mode="video">Video</div>
            <div class="mode-item" data-mode="short">Short</div>
            <div class="mode-item" data-mode="post">Post</div>
        </div>
    </div>
</div>

<!-- ━━━━━━━━━━━━━━━━━━━━━━
   2. VIDEO & SHORT PREVIEW PAGES
━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="video-preview-page" class="fullscreen-page" style="display: none; background: #000; color: #fff; z-index: 10000; flex-direction: column;">
    <div class="topbar-nav">
        <button onclick="AppNavigation.pop()" style="background: none; color: white; border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <div style="font-size: 1.2rem; cursor: pointer;" onclick="togglePreviewPlay('video-preview-el', 'vp-icon')"><i class="fas fa-play" id="vp-icon"></i></div>
        <div style="width: 24px;"></div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
        <video id="video-preview-el" autoplay loop playsinline style="max-width: 100%; max-height: 100%; object-fit: contain;" onclick="togglePreviewPlay('video-preview-el', 'vp-icon')"></video>
    </div>
    <div style="padding: 24px; background: #111;">
        <div class="timeline-wrap">
            <div class="timeline-frames"></div>
            <div class="timeline-handle-start"></div>
            <div class="timeline-handle-end"></div>
            <div class="timeline-playhead" id="vp-playhead"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="vp-time-display" style="font-size: 0.95rem; font-weight: 800; color: #AAA;">00:00 / 00:00</span>
            <button onclick="gotoUploadDetails('video')" style="background: white; color: black; padding: 12px 30px; border-radius: 24px; font-weight: 800; border: none; cursor: pointer;">Next</button>
        </div>
    </div>
</div>

<div id="short-preview-page" class="fullscreen-page" style="display: none; background: #000; color: #fff; z-index: 10000; flex-direction: column;">
    <div class="topbar-nav">
        <button onclick="AppNavigation.pop()" style="background: none; color: white; border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <div style="font-size: 1.1rem; font-weight: 800; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; cursor: pointer;"><i class="fas fa-music"></i> Add Sound</div>
        <div style="font-size: 1.2rem; cursor: pointer;"><i class="fas fa-volume-up"></i></div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
        <video id="short-preview-el" autoplay loop playsinline style="width: 100%; height: 100%; object-fit: cover;" onclick="togglePreviewPlay('short-preview-el', 'none')"></video>
        
        <div style="position: absolute; right: 16px; top: 100px; display: flex; flex-direction: column; gap: 16px;">
            <button class="camera-ctrl-btn"><i class="fas fa-font"></i></button>
            <button class="camera-ctrl-btn"><i class="fas fa-microphone"></i></button>
            <button class="camera-ctrl-btn"><i class="fas fa-download"></i></button>
        </div>
    </div>
    <div style="padding: 20px; background: #111; display: flex; justify-content: flex-end;">
        <button onclick="gotoUploadDetails('short')" style="background: white; color: black; padding: 12px 30px; border-radius: 24px; font-weight: 800; border: none; cursor: pointer;">Next</button>
    </div>
</div>

<!-- ━━━━━━━━━━━━━━━━━━━━━━
   3. VIDEO & SHORT DETAILS PAGES
━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="video-details-page" class="fullscreen-page" style="display: none; background: var(--bg-color); z-index: 10001; flex-direction: column;">
    <div class="topbar-nav solid">
        <button onclick="AppNavigation.pop()" style="background: none; color: var(--text-main); border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--text-main);">Add Details</h3>
        <div style="width: 24px;"></div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 20px;">
        <div style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; position: relative; overflow: hidden; margin-bottom: 24px;">
            <img id="vd-thumb" src="" style="width: 100%; height: 100%; object-fit: cover;" />
            <button onclick="document.getElementById('custom-thumb-input').click()" style="position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: white; padding: 8px 16px; border-radius: 12px; border: none; font-size: 0.85rem; font-weight: 800; cursor: pointer;"><i class="fas fa-image"></i> Custom</button>
        </div>
        
        <div class="form-group">
            <label class="form-label">Title (required)</label>
            <input type="text" id="vd-title" class="form-input" placeholder="Create a title" maxlength="100" oninput="updateCharCount(this, 'vd-title-count')">
            <div class="input-counter" id="vd-title-count" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 700;">0/100</div>
        </div>

        <div class="form-group">
            <label class="form-label">Description (required)</label>
            <textarea id="vd-desc" class="form-textarea" placeholder="Add a description" maxlength="5000" oninput="updateCharCount(this, 'vd-desc-count')"></textarea>
            <div class="input-counter" id="vd-desc-count" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 700;">0/5000</div>
        </div>

        <div class="form-group">
            <label class="form-label">Visibility</label>
            <select id="vd-visibility" class="form-select" onchange="toggleScheduleDate('vd-visibility', 'vd-schedule-container')">
                <option value="Public">🌍 Public</option>
                <option value="Private">🔒 Private</option>
                <option value="Schedule">📅 Schedule Publish</option>
            </select>
        </div>
        
        <div class="form-group" id="vd-schedule-container" style="display: none;">
            <label class="form-label">Schedule Date & Time</label>
            <input type="datetime-local" id="vd-schedule-date" class="form-input">
        </div>

        <div class="form-group" style="background: var(--surface); padding: 16px; border-radius: 16px; border: 1.5px solid var(--glass-border);">
            <label class="form-label">Settings</label>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                <span style="font-weight: 700; color: var(--text-main);">Allow Comments</span>
                <input type="checkbox" id="vd-allow-comments" checked style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                <span style="font-weight: 700; color: var(--text-main);">Hide Likes</span>
                <input type="checkbox" id="vd-hide-likes" style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
        </div>

        <button class="studio-btn" style="margin: 10px 0 40px; width: 100%; padding: 18px;" onclick="publishVideoOrShort('video-long')">PUBLISH VIDEO</button>
    </div>
</div>

<div id="short-details-page" class="fullscreen-page" style="display: none; background: var(--bg-color); z-index: 10001; flex-direction: column;">
    <div class="topbar-nav solid">
        <button onclick="AppNavigation.pop()" style="background: none; color: var(--text-main); border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--text-main);">Add Details</h3>
        <div style="width: 24px;"></div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 20px;">
        <div style="display: flex; gap: 16px; margin-bottom: 24px;">
            <div style="width: 100px; aspect-ratio: 9/16; background: #000; border-radius: 12px; position: relative; overflow: hidden; flex-shrink: 0;">
                <img id="sd-thumb" src="" style="width: 100%; height: 100%; object-fit: cover;" />
                <button onclick="document.getElementById('custom-thumb-input').click()" style="position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; padding: 6px 8px; border-radius: 8px; border: none; font-size: 0.75rem; cursor: pointer;"><i class="fas fa-image"></i></button>
            </div>
            <div style="flex: 1;">
                <label class="form-label">Caption your Short (required)</label>
                <textarea id="sd-title" class="form-textarea" placeholder="Write a catchy caption..." maxlength="100" style="height: 100%; min-height: 120px;" oninput="updateCharCount(this, 'sd-title-count')"></textarea>
                <div class="input-counter" id="sd-title-count" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 700;">0/100</div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Description (required)</label>
            <textarea id="sd-desc" class="form-textarea" placeholder="Add a description" maxlength="5000" oninput="updateCharCount(this, 'sd-desc-count')"></textarea>
            <div class="input-counter" id="sd-desc-count" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 700;">0/5000</div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Visibility</label>
            <select id="sd-visibility" class="form-select" onchange="toggleScheduleDate('sd-visibility', 'sd-schedule-container')">
                <option value="Public">🌍 Public</option>
                <option value="Private">🔒 Private</option>
                <option value="Schedule">📅 Schedule Publish</option>
            </select>
        </div>
        
        <div class="form-group" id="sd-schedule-container" style="display: none;">
            <label class="form-label">Schedule Date & Time</label>
            <input type="datetime-local" id="sd-schedule-date" class="form-input">
        </div>

        <div class="form-group" style="background: var(--surface); padding: 16px; border-radius: 16px; border: 1.5px solid var(--glass-border);">
            <label class="form-label">Settings</label>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                <span style="font-weight: 700; color: var(--text-main);">Allow Comments</span>
                <input type="checkbox" id="sd-allow-comments" checked style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                <span style="font-weight: 700; color: var(--text-main);">Hide Likes</span>
                <input type="checkbox" id="sd-hide-likes" style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
        </div>

        <button class="studio-btn" style="margin: 10px 0 40px; width: 100%; padding: 18px;" onclick="publishVideoOrShort('video-short')">PUBLISH SHORT</button>
    </div>
</div>

<!-- ━━━━━━━━━━━━━━━━━━━━━━
   4. POST PREVIEW & DETAILS PAGES
━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="post-preview-page" class="fullscreen-page" style="display: none; background: #000; z-index: 10000; flex-direction: column;">
    <div class="topbar-nav">
        <button onclick="AppNavigation.pop()" style="background: none; color: white; border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <div style="width: 24px;"></div>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding-bottom: 80px;">
        <img id="post-preview-img" src="" style="width: 100%; max-width: 400px; aspect-ratio: 3/4; object-fit: contain; background: #111;" />
    </div>
    <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 24px; background: #111; display: flex; justify-content: flex-end;">
        <button onclick="gotoUploadDetails('post')" style="background: white; color: black; padding: 12px 30px; border-radius: 24px; font-weight: 800; border: none; cursor: pointer;">Next</button>
    </div>
</div>

<div id="post-details-page" class="fullscreen-page" style="display: none; background: var(--bg-color); z-index: 10001; flex-direction: column;">
    <div class="topbar-nav solid">
        <button onclick="AppNavigation.pop()" style="background: none; color: var(--text-main); border: none; font-size: 1.4rem; cursor: pointer;"><i class="fas fa-arrow-left"></i></button>
        <h3 style="margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--text-main);">Create Post</h3>
        <div style="width: 24px;"></div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 20px;">
        <div class="form-group">
            <label class="form-label">Title / Caption (required)</label>
            <textarea id="pd-title" class="form-textarea" placeholder="Write something about this post..." maxlength="1000" oninput="updateCharCount(this, 'pd-title-count')"></textarea>
            <div class="input-counter" id="pd-title-count" style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; font-weight: 700;">0/1000</div>
        </div>

        <div class="form-group">
            <label class="form-label">Visibility</label>
            <select id="pd-visibility" class="form-select" onchange="toggleScheduleDate('pd-visibility', 'pd-schedule-container')">
                <option value="Public">🌍 Publish</option>
                <option value="Schedule">📅 Schedule Publish</option>
            </select>
        </div>
        
        <div class="form-group" id="pd-schedule-container" style="display: none;">
            <label class="form-label">Schedule Date & Time</label>
            <input type="datetime-local" id="pd-schedule-date" class="form-input">
        </div>

        <div class="form-group" style="background: var(--surface); padding: 16px; border-radius: 16px; border: 1.5px solid var(--glass-border);">
            <label class="form-label">Settings</label>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
                <span style="font-weight: 700; color: var(--text-main);">Allow Comments</span>
                <input type="checkbox" id="pd-allow-comments" checked style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                <span style="font-weight: 700; color: var(--text-main);">Hide Likes</span>
                <input type="checkbox" id="pd-hide-likes" style="width: 22px; height: 22px; accent-color: var(--primary);">
            </div>
        </div>

        <button class="studio-btn" style="margin: 10px 0 40px; width: 100%; padding: 18px;" onclick="publishPostUpload()">PUBLISH POST</button>
    </div>
</div>

<!-- Upload Manager Screen (Kept for Queue processing) -->
<div class="premium-download-modal" id="upload-manager-screen" style="z-index: 2050;">
    <div class="premium-download-content" style="max-height: 85vh; height: 85vh;">
        <div class="drag-handle-line"></div>
        <div class="download-modal-header" style="margin-bottom: 8px;">
            <h3 style="font-size: 1.3rem;"><i class="fas fa-tasks" style="color: var(--primary);"></i> Upload Manager</h3>
            <button class="close-download-modal" onclick="closeUploadManager()"><i class="fas fa-times"></i></button>
        </div>
        <div class="inner-tab-container">
            <div class="inner-tab-item active" id="man-tab-uploading" onclick="switchManagerTab('uploading')">Active (<span id="man-count-active">0</span>)</div>
            <div class="inner-tab-item" id="man-tab-drafts" onclick="switchManagerTab('drafts')">Drafts (<span id="man-count-drafts">0</span>)</div>
            <div class="inner-tab-item" id="man-tab-completed" onclick="switchManagerTab('completed')">Completed</div>
        </div>
        <div class="download-modal-scrollable" id="manager-items-list" style="flex-grow: 1;"></div>
    </div>
</div>

</body></html>
