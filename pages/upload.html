<style>
    .upload-container {
        width: 100%; height: 100%; background: #f8f8f8; display: flex; flex-direction: column;
        position: relative;
    }
    
    /* Top Bar for Form */
    .upload-header {
        display: none; justify-content: space-between; align-items: center; padding: 16px;
        background: #ffffff; border-bottom: 1px solid #f0f0f0;
    }
    .upload-header-title { font-size: 18px; font-weight: 600; }
    
    /* Bottom Sheet Style Menu */
    .upload-menu-sheet {
        position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff;
        border-radius: 24px 24px 0 0; padding: 24px 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        display: flex; flex-direction: column; gap: 16px; z-index: 50; transition: transform 0.3s ease;
    }
    .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px auto; }
    .sheet-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    
    .upload-option {
        display: flex; align-items: center; gap: 16px; padding: 16px; background: #f8f8f8;
        border-radius: 16px; cursor: pointer; transition: background 0.2s;
    }
    .upload-option:active { background: #eee; }
    .option-icon {
        width: 48px; height: 48px; border-radius: 50%; background: #ffe6eb; color: #ff2a5f;
        display: flex; align-items: center; justify-content: center;
    }
    .option-text h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .option-text p { font-size: 13px; color: #666; }

    /* Upload Forms (Initially Hidden) */
    .upload-form-area {
        display: none; flex: 1; padding: 16px; overflow-y: auto; background: #ffffff;
    }
    .input-group { margin-bottom: 20px; }
    .input-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #333; }
    .custom-input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }
    .custom-input:focus { border-color: #ff2a5f; }
    textarea.custom-input { resize: none; height: 100px; }
    
    .file-drop-area {
        border: 2px dashed #ddd; border-radius: 16px; padding: 32px 16px; text-align: center;
        background: #fafafa; cursor: pointer; margin-bottom: 20px;
    }
    .file-drop-area .material-symbols-rounded { font-size: 40px; color: #aaa; margin-bottom: 8px; }
    
    .btn-submit {
        width: 100%; padding: 16px; background: #ff2a5f; color: white; border: none;
        border-radius: 100px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
</style>

<div class="upload-container">
    
    <!-- Step 1: Upload Options Bottom Sheet -->
    <div class="upload-menu-sheet" id="upload-selection-sheet">
        <div class="sheet-handle"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div class="sheet-title">Create content</div>
            <span class="material-symbols-rounded" style="cursor: pointer;" id="close-upload">close</span>
        </div>

        <div class="upload-option" data-type="video">
            <div class="option-icon"><span class="material-symbols-rounded">upload</span></div>
            <div class="option-text">
                <h3>Video Upload</h3>
                <p>Upload videos or long movies up to 10GB</p>
            </div>
        </div>

        <div class="upload-option" data-type="short">
            <div class="option-icon"><span class="material-symbols-rounded">app_shortcut</span></div>
            <div class="option-text">
                <h3>Short Upload</h3>
                <p>Share quick portrait clips up to 3 mins</p>
            </div>
        </div>

        <div class="upload-option" data-type="post">
            <div class="option-icon"><span class="material-symbols-rounded">post_add</span></div>
            <div class="option-text">
                <h3>Create Post</h3>
                <p>Share images up to 5 photos as grid</p>
            </div>
        </div>
    </div>

    <!-- Step 2: Form Header -->
    <div class="upload-header" id="upload-form-header">
        <span class="material-symbols-rounded" style="cursor: pointer;" id="back-to-upload-menu">arrow_back</span>
        <div class="upload-header-title" id="upload-form-title">Upload</div>
        <span style="width: 24px;"></span> <!-- Spacer for center alignment -->
    </div>

    <!-- Step 3: Generic Form Area (Handled Dynamically by JS) -->
    <div class="upload-form-area" id="upload-form-area">
        <div class="file-drop-area" id="file-selector-btn">
            <span class="material-symbols-rounded">cloud_upload</span>
            <p style="font-weight: 500; font-size: 15px;">Tap to select file</p>
            <p style="font-size: 12px; color: #888; margin-top: 4px;" id="file-limits-text">MP4, MOV</p>
            <input type="file" id="media-file-input" style="display: none;">
        </div>

        <div class="input-group">
            <label class="input-label">Title</label>
            <input type="text" id="upload-title" class="custom-input" placeholder="Give your content a catchy title">
        </div>

        <div class="input-group" id="desc-group">
            <label class="input-label">Description</label>
            <textarea id="upload-desc" class="custom-input" placeholder="Tell viewers about your content..."></textarea>
        </div>

        <button class="btn-submit" id="start-upload-btn">Publish to Flaynity</button>
    </div>
</div>
