<!-- pages/upload.html -->
<style>
/* UPLOAD COMPONENT STYLES */
.page-upload-root {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 3000;
}

/* Backdrop for bottom sheet */
.upload-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}
.upload-backdrop.active { opacity: 1; }

/* Bottom Sheet */
.upload-bottom-sheet {
    background: var(--flaynity-surface);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 24px 16px max(24px, var(--safe-area-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
}
.upload-bottom-sheet.active { transform: translateY(0); }

.upload-sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.upload-sheet-title { font-size: 20px; font-weight: 700; color: var(--flaynity-text); }
.upload-sheet-close {
    background: var(--flaynity-skeleton);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--flaynity-text);
}

.upload-options-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}
.upload-option-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px 8px;
    background: var(--flaynity-bg);
    border: 1px solid var(--flaynity-divider);
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.2s;
}
.upload-option-card:active { background: var(--flaynity-skeleton); }
.upload-option-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--flaynity-skeleton);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--flaynity-text);
}
.upload-option-icon .material-symbols-outlined { font-size: 28px; font-variation-settings: 'FILL' 1; }
.upload-option-label { font-size: 14px; font-weight: 600; color: var(--flaynity-text); }

/* Full Screen Flow Layers (Video, Short, Post) */
.upload-flow-layer {
    position: absolute;
    inset: 0;
    background: var(--flaynity-bg);
    z-index: 3100;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.upload-flow-layer.active { transform: translateY(0); }

/* Common Flow Top Bar */
.flow-top-bar {
    height: var(--top-bar-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    padding-top: var(--safe-area-top);
    border-bottom: 1px solid var(--flaynity-divider);
    background: var(--flaynity-surface);
}
.flow-top-bar .title { font-size: 18px; font-weight: 700; color: var(--flaynity-text); }
.flow-btn-primary {
    background: var(--flaynity-text);
    color: var(--flaynity-bg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
}
.flow-btn-primary:disabled { opacity: 0.5; }

/* Upload Forms & Editors */
.upload-form-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: calc(16px + var(--safe-area-bottom));
}
.form-group { margin-bottom: 24px; }
.form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--flaynity-text); }
.form-input, .form-textarea, .form-select {
    width: 100%;
    background: var(--flaynity-skeleton);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    color: var(--flaynity-text);
    font-family: inherit;
    transition: border 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--flaynity-text);
    outline: none;
}
.form-textarea { resize: none; min-height: 120px; }

/* Video Preview Box */
.video-preview-box {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.video-preview-box video { width: 100%; height: 100%; object-fit: contain; }

/* Short Camera UI Simulator */
.short-camera-view {
    flex: 1;
    background: #000;
    position: relative;
    display: flex;
    flex-direction: column;
}
.camera-preview { width: 100%; height: 100%; object-fit: cover; }
.camera-controls-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 16px max(32px, var(--safe-area-bottom));
}
.camera-top-actions { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
.camera-side-tools { display: flex; flex-direction: column; gap: 16px; }
.cam-tool { background: rgba(0,0,0,0.5); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.camera-bottom-actions { display: flex; justify-content: center; align-items: center; gap: 32px; pointer-events: auto; }
.cam-record-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: var(--flaynity-accent); transition: transform 0.2s; }
.cam-record-btn:active { transform: scale(0.9); }

/* Post Image Grid Maker */
.post-image-picker-box {
    width: 100%; aspect-ratio: 3/4; background: var(--flaynity-skeleton); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--flaynity-text-secondary);
    border: 2px dashed var(--flaynity-divider); cursor: pointer; margin-bottom: 16px; overflow: hidden; position: relative;
}
.post-image-picker-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }

/* Upload Progress Engine Overlay */
.upload-progress-overlay {
    position: absolute; inset: 0; background: var(--flaynity-surface); z-index: 4000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
}
.progress-ring { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--flaynity-skeleton); border-top-color: var(--flaynity-accent); animation: spin 1s linear infinite; margin-bottom: 24px; }
.progress-text { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.progress-subtext { font-size: 14px; color: var(--flaynity-text-secondary); }
</style>

<div class="page-upload-root" id="upload-root">
    
    <!-- Backdrop & Bottom Sheet Selection -->
    <div class="upload-backdrop" id="upload-backdrop">
        <div class="upload-bottom-sheet" id="upload-sheet">
            <div class="upload-sheet-header">
                <div class="upload-sheet-title">Create</div>
                <div class="upload-sheet-close" id="btn-close-upload-sheet">
                    <span class="material-symbols-outlined">close</span>
                </div>
            </div>
            
            <div class="upload-options-grid">
                <div class="upload-option-card" id="btn-create-video">
                    <div class="upload-option-icon"><span class="material-symbols-outlined">upload_file</span></div>
                    <div class="upload-option-label">Video</div>
                </div>
                <div class="upload-option-card" id="btn-create-short">
                    <div class="upload-option-icon"><span class="material-symbols-outlined">app_shortcut</span></div>
                    <div class="upload-option-label">Short</div>
                </div>
                <div class="upload-option-card" id="btn-create-post">
                    <div class="upload-option-icon"><span class="material-symbols-outlined">edit_square</span></div>
                    <div class="upload-option-label">Post</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Upload Flow -->
    <div class="upload-flow-layer flaynity-hidden" id="flow-video">
        <div class="flow-top-bar">
            <span class="material-symbols-outlined" id="btn-close-video-flow" style="cursor:pointer;">arrow_back</span>
            <div class="title">Upload Video</div>
            <button class="flow-btn-primary" id="btn-publish-video">Publish</button>
        </div>
        <div class="upload-form-scroll">
            <div class="video-preview-box" id="video-file-picker-trigger">
                <span class="material-symbols-outlined" style="font-size: 48px; color: var(--flaynity-text-secondary);">add_photo_alternate</span>
                <video id="video-preview-element" class="flaynity-hidden" controls></video>
                <input type="file" id="input-video-file" accept="video/*" class="flaynity-hidden">
            </div>
            
            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-input" id="input-video-title" placeholder="Create a title">
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-textarea" id="input-video-desc" placeholder="Add a description"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Visibility</label>
                <select class="form-select" id="input-video-visibility">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select class="form-select" id="input-video-category">
                    <option value="Entertainment">Entertainment</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Education">Education</option>
                    <option value="Music">Music</option>
                    <option value="Technology">Technology</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Short Upload Flow (Camera Simulator & Details) -->
    <div class="upload-flow-layer flaynity-hidden" id="flow-short">
        <!-- Camera View -->
        <div class="short-camera-view" id="short-camera-ui">
            <video class="camera-preview" id="short-camera-video" autoplay muted playsinline></video>
            <div class="camera-controls-overlay">
                <div class="camera-top-actions">
                    <div class="cam-tool" id="btn-close-short-flow"><span class="material-symbols-outlined">close</span></div>
                    <div class="camera-side-tools">
                        <div class="cam-tool"><span class="material-symbols-outlined">flip_camera_ios</span></div>
                        <div class="cam-tool"><span class="material-symbols-outlined">speed</span></div>
                        <div class="cam-tool"><span class="material-symbols-outlined">timer</span></div>
                    </div>
                </div>
                <div class="camera-bottom-actions">
                    <div class="cam-tool" id="btn-short-gallery"><span class="material-symbols-outlined">photo_library</span></div>
                    <div class="cam-record-btn" id="btn-record-short"></div>
                    <div class="cam-tool" id="btn-short-next"><span class="material-symbols-outlined">check</span></div>
                </div>
            </div>
            <input type="file" id="input-short-file" accept="video/*" class="flaynity-hidden">
        </div>
        
        <!-- Short Details View -->
        <div class="upload-flow-layer flaynity-hidden" id="short-details-ui" style="z-index: 3101;">
            <div class="flow-top-bar">
                <span class="material-symbols-outlined" id="btn-back-short-details" style="cursor:pointer;">arrow_back</span>
                <div class="title">Details</div>
                <button class="flow-btn-primary" id="btn-publish-short">Upload Short</button>
            </div>
            <div class="upload-form-scroll">
                <div class="form-group">
                    <label class="form-label">Caption your Short</label>
                    <textarea class="form-textarea" id="input-short-title" placeholder="Write a caption..." style="min-height: 80px;"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Visibility</label>
                    <select class="form-select" id="input-short-visibility">
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Post Creation Flow -->
    <div class="upload-flow-layer flaynity-hidden" id="flow-post">
        <div class="flow-top-bar">
            <span class="material-symbols-outlined" id="btn-close-post-flow" style="cursor:pointer;">close</span>
            <div class="title">Create Post</div>
            <button class="flow-btn-primary" id="btn-publish-post">Post</button>
        </div>
        <div class="upload-form-scroll">
            <div class="post-image-picker-box" id="post-image-picker-trigger">
                <span class="material-symbols-outlined" style="font-size: 32px; margin-bottom: 8px;">add_photo_alternate</span>
                <span style="font-size: 13px; font-weight: 500;">Select Image (3:4 ratio)</span>
                <img id="post-image-preview" src="" class="flaynity-hidden">
                <input type="file" id="input-post-file" accept="image/*" class="flaynity-hidden">
            </div>
            <div class="form-group">
                <textarea class="form-textarea" id="input-post-text" placeholder="What's on your mind?"></textarea>
            </div>
        </div>
    </div>

    <!-- Global Upload Engine Progress -->
    <div class="upload-progress-overlay flaynity-hidden" id="upload-progress-engine">
        <div class="progress-ring"></div>
        <div class="progress-text">Uploading to Flaynity...</div>
        <div class="progress-subtext" id="upload-progress-percentage">0%</div>
    </div>

</div>
